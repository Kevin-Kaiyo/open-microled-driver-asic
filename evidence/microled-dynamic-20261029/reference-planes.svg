<rect x="923" y="225" width="24" height="70" fill="none" stroke="#243746" stroke-width="2.5"/>
<line x1="935" y1="295" x2="935" y2="350" stroke="#243746" stroke-width="2.5" />
<text x="960" y="265" font-size="20" fill="#243746" text-anchor="start">rd</text>
<line x1="1075" y1="185" x2="1075" y2="250" stroke="#243746" stroke-width="2.5" />
<line x1="1051" y1="250" x2="1099" y2="250" stroke="#243746" stroke-width="2.5" />
<line x1="1051" y1="270" x2="1099" y2="270" stroke="#243746" stroke-width="2.5" />
<line x1="1075" y1="270" x2="1075" y2="350" stroke="#243746" stroke-width="2.5" />
<text x="1105" y="265" font-size="20" fill="#243746" text-anchor="start">C</text>
<line x1="935" y1="350" x2="935" y2="365" stroke="#243746" stroke-width="2.5" />
<line x1="915" y1="365" x2="955" y2="365" stroke="#243746" stroke-width="2.5" />
<line x1="922" y1="373" x2="948" y2="373" stroke="#243746" stroke-width="2.5" />
<line x1="929" y1="381" x2="941" y2="381" stroke="#243746" stroke-width="2.5" />
<circle cx="725" cy="270" r="30" fill="#fcfcfa" stroke="#243746" stroke-width="2.5"/>
<line x1="725" y1="185" x2="725" y2="240" stroke="#243746" stroke-width="2.5" />
<line x1="725" y1="300" x2="725" y2="350" stroke="#243746" stroke-width="2.5" />
<text x="948" y="173" font-size="17" fill="#243746" text-anchor="start">vLED</text>
<circle cx="935" cy="185" r="4" fill="#243746"/>
<circle cx="935" cy="350" r="4" fill="#243746"/>
<rect x="760" y="178" width="120" height="14" fill="#f1f6f7"/>
<line x1="760" y1="185" x2="780" y2="185" stroke="#243746" stroke-width="2.5" />
<rect x="780" y="173" width="65" height="24" fill="#f1f6f7" stroke="#243746" stroke-width="2.5"/>
<line x1="845" y1="185" x2="880" y2="185" stroke="#243746" stroke-width="2.5" />
<text x="810" y="160" font-size="17" fill="#243746" text-anchor="middle">Rs</text>
<text x="725" y="262" font-size="20" fill="#243746" text-anchor="middle">+</text>
<text x="725" y="290" font-size="20" fill="#243746" text-anchor="middle">−</text>
<text x="677" y="315" font-size="17" fill="#243746" text-anchor="start">vIN</text>
<text x="665" y="416" font-size="19" fill="#243746" text-anchor="start">H归一化 = 1 / [1 + s (Rs ∥ rd) C]</text>
<text x="40" y="492" font-size="20" fill="#243746" text-anchor="start">同一条件下的计算结果（电容充放电极点；不含载流子复合、光学或接收器）</text>
<text x="40" y="530" font-size="18" fill="#243746" text-anchor="start">25 µA：rd = 10.768 kΩ</text>
<text x="385" y="530" font-size="18" fill="#0e7490" text-anchor="start">τI = 2153.6 ps</text>
<text x="650" y="530" font-size="18" fill="#924b6a" text-anchor="start">τV = 9.95 ps</text>
<text x="930" y="530" font-size="18" fill="#243746" text-anchor="start">50 Ω ≪ rd</text>
<text x="40" y="570" font-size="18" fill="#243746" text-anchor="start">100 µA：rd = 2.955 kΩ</text>
<text x="385" y="570" font-size="18" fill="#0e7490" text-anchor="start">τI = 590.9 ps</text>
<text x="650" y="570" font-size="18" fill="#924b6a" text-anchor="start">τV = 9.83 ps</text>
<text x="930" y="570" font-size="18" fill="#243746" text-anchor="start">50 Ω ≪ rd</text>
<line x1="35" y1="597" x2="1205" y2="597" stroke="#243746" stroke-width="2.5" />
<text x="40" y="630" font-size="21" fill="#243746" text-anchor="start">文献 S21 的实际测量跨度</text>
<text x="40" y="668" font-size="19" fill="#0e7490" text-anchor="start">VNA → bias tee → LED 电学端口 → 电光转换 → 光纤 → SPD-4 检测器 → VNA</text>
<text x="40" y="705" font-size="17" fill="#243746" text-anchor="start">要改成晶体管仿真模型，必须知道参考面及测量链响应；整条 S21 不能再叠加已有 LED RC / RX 极点。</text>
<text x="40" y="746" font-size="17" fill="#62717d" text-anchor="start">50 Ω 并非 A 路线的实测输出阻抗，也不意味着该示例已复现文献测试夹具。</text>
</svg>