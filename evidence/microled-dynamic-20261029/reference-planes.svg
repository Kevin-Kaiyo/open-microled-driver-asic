<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="790" viewBox="0 0 1240 790">
<rect width="1240" height="790" fill="#fcfcfa"/>
<style>text{font-family:"Noto Sans CJK SC","PingFang SC",sans-serif}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0e7490"/></marker></defs>
<text x="35" y="42" font-size="26" fill="#243746" text-anchor="start">为什么同一个 LED，电流驱动与电压驱动的 RC 时间常数不同？</text>
<text x="35" y="73" font-size="17" fill="#62717d" text-anchor="start">小信号等效原理图；rd 取自现有静态 I–V。C = 200 fF 与 Rs = 50 Ω 都只是说明用假设。</text>
<rect x="25" y="100" width="570" height="350" rx="12" fill="#f1f6f7"/>
<text x="45" y="133" font-size="21" fill="#243746" text-anchor="start">① 理想电流输入</text>
<line x1="105" y1="185" x2="455" y2="185" stroke="#243746" stroke-width="2.5" />
<line x1="105" y1="350" x2="455" y2="350" stroke="#243746" stroke-width="2.5" />
