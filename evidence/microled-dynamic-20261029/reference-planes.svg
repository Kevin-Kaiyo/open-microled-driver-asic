<line x1="315" y1="295" x2="315" y2="350" stroke="#243746" stroke-width="2.5" />
<text x="340" y="265" font-size="20" fill="#243746" text-anchor="start">rd</text>
<line x1="455" y1="185" x2="455" y2="250" stroke="#243746" stroke-width="2.5" />
<line x1="431" y1="250" x2="479" y2="250" stroke="#243746" stroke-width="2.5" />
<line x1="431" y1="270" x2="479" y2="270" stroke="#243746" stroke-width="2.5" />
<line x1="455" y1="270" x2="455" y2="350" stroke="#243746" stroke-width="2.5" />
<text x="485" y="265" font-size="20" fill="#243746" text-anchor="start">C</text>
<line x1="315" y1="350" x2="315" y2="365" stroke="#243746" stroke-width="2.5" />
<line x1="295" y1="365" x2="335" y2="365" stroke="#243746" stroke-width="2.5" />
<line x1="302" y1="373" x2="328" y2="373" stroke="#243746" stroke-width="2.5" />
<line x1="309" y1="381" x2="321" y2="381" stroke="#243746" stroke-width="2.5" />
<circle cx="105" cy="270" r="30" fill="#fcfcfa" stroke="#243746" stroke-width="2.5"/>
<line x1="105" y1="185" x2="105" y2="240" stroke="#243746" stroke-width="2.5" />
<line x1="105" y1="300" x2="105" y2="350" stroke="#243746" stroke-width="2.5" />
<text x="328" y="173" font-size="17" fill="#243746" text-anchor="start">vLED</text>
<circle cx="315" cy="185" r="4" fill="#243746"/>
<circle cx="315" cy="350" r="4" fill="#243746"/>
<line x1="105" y1="285" x2="105" y2="255" stroke="#243746" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="57" y="315" font-size="17" fill="#243746" text-anchor="start">iIN</text>
<text x="45" y="416" font-size="19" fill="#243746" text-anchor="start">i导电 / iIN = 1 / (1 + s rd C)</text>
<rect x="645" y="100" width="570" height="350" rx="12" fill="#f1f6f7"/>
<text x="665" y="133" font-size="21" fill="#243746" text-anchor="start">② 电压源经过输出电阻</text>
<line x1="725" y1="185" x2="1075" y2="185" stroke="#243746" stroke-width="2.5" />
<line x1="725" y1="350" x2="1075" y2="350" stroke="#243746" stroke-width="2.5" />
