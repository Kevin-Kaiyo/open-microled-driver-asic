<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#426873"/></marker></defs><style>text{font-family:Avenir Next,PingFang SC,sans-serif;fill:#244b56;font-size:18px}.small{font-size:15px}.title{font-size:21px;font-weight:600}.box{fill:#edf5f4;stroke:#44818a;stroke-width:1.6}.pending{fill:#fff8ee;stroke:#ae8452;stroke-dasharray:6 4;stroke-width:1.5}.wire{fill:none;stroke:#426873;stroke-width:2;marker-end:url(#arrow)}</style><text x="20" y="28" class="title">从设计到硅片：每一步有不同的输入、输出和验收</text><rect x="20" y="70" width="290" height="90" rx="6" class="box"/><text x="165.0" y="97" text-anchor="middle">需求 / 测试规范</text><text x="165.0" y="122" text-anchor="middle">电流、时序、LED、接口</text><path d="M310,115 H350" class="wire"/><rect x="350" y="70" width="290" height="90" rx="6" class="box"/><text x="495.0" y="97" text-anchor="middle">RTL / 原理图</text><text x="495.0" y="122" text-anchor="middle">逻辑功能与MOS网络</text><path d="M640,115 H680" class="wire"/><rect x="680" y="70" width="290" height="90" rx="6" class="box"/><text x="825.0" y="97" text-anchor="middle">综合 / 布局布线</text><text x="825.0" y="122" text-anchor="middle">几何、供电、时钟</text><rect x="20" y="235" width="290" height="90" rx="6" class="box"/><text x="165.0" y="262" text-anchor="middle">提取 / 复验</text><text x="165.0" y="287" text-anchor="middle">RC、时序、电流、故障</text><path d="M310,280 H350" class="wire"/><rect x="350" y="235" width="290" height="90" rx="6" class="box"/><text x="495.0" y="262" text-anchor="middle">流片冻结 / 制造接受</text><text x="495.0" y="287" text-anchor="middle">GDS、报告、manifest</text><path d="M640,280 H680" class="wire"/><rect x="680" y="235" width="290" height="90" rx="6" class="box"/><text x="825.0" y="262" text-anchor="middle">封装 / 测试 / 关联</text><text x="825.0" y="287" text-anchor="middle">引脚、PCB、实测与模型</text><path d="M970,160 V204 H165 V235" class="wire"/><text x="20" y="375">测试计划在需求阶段定义；流片前要能说明每一项性能怎样测、怎样判定。</text><text x="20" y="405" class="small">当前：旧核心已有版图，新参考和保护主要为前仿真；最终制造包仍为空。</text></svg>