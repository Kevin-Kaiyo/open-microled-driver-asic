<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#426873"/></marker></defs><style>text{font-family:Avenir Next,PingFang SC,sans-serif;fill:#244b56;font-size:18px}.small{font-size:15px}.title{font-size:21px;font-weight:600}.box{fill:#edf5f4;stroke:#44818a;stroke-width:1.6}.pending{fill:#fff8ee;stroke:#ae8452;stroke-dasharray:6 4;stroke-width:1.5}.wire{fill:none;stroke:#426873;stroke-width:2;marker-end:url(#arrow)}</style><text x="20" y="25" class="title">目标系统：电源、信号、电流与光四条链路</text><rect x="20" y="65" width="150" height="85" rx="6" class="box"/><text x="95.0" y="92" text-anchor="middle">主控 / FPGA</text><text x="95.0" y="117" text-anchor="middle">命令与时钟</text><rect x="210" y="65" width="175" height="85" rx="6" class="pending"/><text x="297.5" y="92" text-anchor="middle">输入与寄存器</text><text x="297.5" y="117" text-anchor="middle">帧边界提交</text><rect x="425" y="65" width="160" height="85" rx="6" class="box"/><text x="505.0" y="92" text-anchor="middle">PWM逻辑</text><text x="505.0" y="117" text-anchor="middle">0…256 时槽</text><rect x="625" y="65" width="155" height="85" rx="6" class="box"/><text x="702.5" y="92" text-anchor="middle">保护门</text><text x="702.5" y="117" text-anchor="middle">输出buffer</text><rect x="820" y="65" width="160" height="85" rx="6" class="box"/><text x="900.0" y="92" text-anchor="middle">像素开关</text><text x="900.0" y="117" text-anchor="middle">MOUT gate</text><path d="M170,107 H210" class="wire"/><path d="M385,107 H425" class="wire"/><path d="M585,107 H625" class="wire"/><path d="M780,107 H820" class="wire"/><rect x="20" y="220" width="210" height="85" rx="6" class="box"/><text x="125.0" y="247" text-anchor="middle">外部VSET / RSET</text><text x="125.0" y="272" text-anchor="middle">精密基准边界</text><rect x="270" y="220" width="230" height="85" rx="6" class="box"/><text x="385.0" y="247" text-anchor="middle">参考源 + 隔离</text><text x="385.0" y="272" text-anchor="middle">IREF → VBIAS</text><rect x="540" y="220" width="160" height="85" rx="6" class="box"/><text x="620.0" y="247" text-anchor="middle">MREF / MOUT</text><text x="620.0" y="272" text-anchor="middle">设定导通电流</text><rect x="740" y="220" width="240" height="85" rx="6" class="box"/><text x="860.0" y="247" text-anchor="middle">外接 MicroLED</text><text x="860.0" y="272" text-anchor="middle">电流 → 光响应</text><path d="M230,263 H270" class="wire"/><path d="M500,263 H540" class="wire"/><path d="M700,263 H740" class="wire"/><path d="M900,150 V185 H620 V220" class="wire"/><text x="20" y="350">LED主电流：VLED → LED → MOUT → VSS；逻辑输出主要搬运栅极电荷。</text><text x="20" y="380" class="small">虚线：目标硬件未实现；实线：已有部分电路或实验，不表示全系统已物理集成。</text><text x="20" y="405" class="small">供电稳压、POR、pad/ESD、封装、PCB、温度检测与光学测量也属于产品边界，尚需建立。</text></svg>