<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#426873"/></marker></defs><style>text{font-family:Avenir Next,PingFang SC,sans-serif;fill:#244b56;font-size:18px}.small{font-size:15px}.title{font-size:21px;font-weight:600}.box{fill:#edf5f4;stroke:#44818a;stroke-width:1.6}.pending{fill:#fff8ee;stroke:#ae8452;stroke-dasharray:6 4;stroke-width:1.5}.wire{fill:none;stroke:#426873;stroke-width:2;marker-end:url(#arrow)}</style><text x="20" y="28" class="title">电路要完成两种工作：设定电流，再决定何时送入LED</text><rect x="25" y="75" width="250" height="85" rx="6" class="box"/><text x="150.0" y="102" text-anchor="middle">设定量：VSET / RSET</text><text x="150.0" y="127" text-anchor="middle">ISENSE ≈ 100 µA</text><rect x="375" y="75" width="250" height="85" rx="6" class="box"/><text x="500.0" y="102" text-anchor="middle">参考输出镜像</text><text x="500.0" y="127" text-anchor="middle">IREF → MREF → VBIAS</text><rect x="725" y="75" width="250" height="85" rx="6" class="box"/><text x="850.0" y="102" text-anchor="middle">像素镜像</text><text x="850.0" y="127" text-anchor="middle">ILED ≈ k · IREF</text><path d="M275,117 H375" class="wire"/><path d="M625,117 H725" class="wire"/><rect x="25" y="240" width="250" height="85" rx="6" class="box"/><text x="150.0" y="267" text-anchor="middle">时间量：duty / clock</text><text x="150.0" y="292" text-anchor="middle">Tframe = 256 / fCLK</text><rect x="375" y="240" width="250" height="85" rx="6" class="box"/><text x="500.0" y="267" text-anchor="middle">保护 / buffer / 开关</text><text x="500.0" y="292" text-anchor="middle">Gate连到BIAS或VSS</text><rect x="725" y="240" width="250" height="85" rx="6" class="box"/><text x="850.0" y="267" text-anchor="middle">输出积分</text><text x="850.0" y="292" text-anchor="middle">Iavg = QLED / Tframe</text><path d="M275,282 H375" class="wire"/><path d="M625,282 H725" class="wire"/><path d="M850,160 V240" class="wire"/><text x="25" y="385" class="small">镜像比、headroom、失配、动态寄生会造成误差；电气平均电流不是已测光输出。</text></svg>