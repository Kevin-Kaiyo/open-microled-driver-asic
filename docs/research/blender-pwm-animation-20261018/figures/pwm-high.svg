<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" viewBox="0 0 760 900" role="img"><title>PWM 高电平：LED 导通</title><desc>六只实际实例的像素局部原理图。LED位于片外；上游参考源、隔离级、保护逻辑与缓冲器省略。电流箭头采用传统电流方向，栅极无稳态直流。</desc><style>text{font-family:"PingFang SC","Noto Sans CJK SC","Arial",sans-serif}path,polyline{stroke-linecap:round;stroke-linejoin:round}</style><defs><marker id="ref" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#188b7d"/></marker><marker id="led" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d77a1d"/></marker><marker id="sig" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a5ab3"/></marker><marker id="ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#294551"/></marker></defs><rect width="760" height="900" fill="white"/><text x="28" y="43" font-size="27" fill="#294551" text-anchor="start" font-weight="600">PWM 高电平：LED 导通</text><text x="28" y="76" font-size="17" fill="#64777f" text-anchor="start" font-weight="400">像素局部 · FAULT = 0、PERMIT = 1、参考源已稳定</text><text x="28" y="103" font-size="16" fill="#64777f" text-anchor="start" font-weight="400">PWM_DRIVE 是保护逻辑与输出缓冲之后的信号。</text><text x="130" y="144" font-size="17" fill="#294551" text-anchor="middle" font-weight="600">VREF</text><polyline points="130,154 130,181" fill="none" stroke="#188b7d" stroke-width="2.3"/><circle cx="130" cy="205" r="24" fill="white" stroke="#188b7d" stroke-width="2.3"/><path d="M130,191 L130,219" fill="none" stroke="#188b7d" stroke-width="2.8" marker-end="url(#ref)"/><polyline points="130,229 130,350" fill="none" stroke="#188b7d" stroke-width="3"/><text x="171" y="193" font-size="18" fill="#188b7d" text-anchor="start" font-weight="600">等效 IREF</text><text x="171" y="217" font-size="15" fill="#64777f" text-anchor="start" font-weight="400">上游参考输出</text><text x="171" y="240" font-size="15" fill="#64777f" text-anchor="start" font-weight="400">隔离级已导通</text><text x="160" y="283" font-size="18" fill="#188b7d" text-anchor="start" font-weight="600">BIAS</text><polyline points="130,300 305,300" fill="none" stroke="#8a5ab3" stroke-width="2.3"/><circle cx="130" cy="300" r="3.8" fill="#188b7d"/><g data-device="XP_REF" data-nets="BIAS BIAS VSS VSS" data-terminal-order="D G S B" data-channel-on="true" transform="translate(130 395)"><polyline points="-10,-22 -10,-12" fill="none" stroke="#188b7d" stroke-width="3.3"/><polyline points="-10,-5 -10,5" fill="none" stroke="#188b7d" stroke-width="3.3"/><polyline points="-10,12 -10,22" fill="none" stroke="#188b7d" stroke-width="3.3"/><polyline points="-28,-24 -28,24" fill="none" stroke="#8a5ab3" stroke-width="2.3"/><polyline points="0,-45 0,-20 -10,-20" fill="none" stroke="#188b7d" stroke-width="2.3"/><polyline points="-10,20 0,20 0,45" fill="none" stroke="#188b7d" stroke-width="2.3"/><polyline points="-55,0 -28,0" fill="none" stroke="#8a5ab3" stroke-width="2.3"/></g><text x="140" y="364" font-size="13" fill="#64777f" text-anchor="start" font-weight="400">D</text><text x="140" y="438" font-size="13" fill="#64777f" text-anchor="start" font-weight="400">S</text><text x="75" y="385" font-size="13" fill="#64777f" text-anchor="start" font-weight="400">G</text><polyline points="75,395 59,395 59,300 130,300" fill="none" stroke="#8a5ab3" stroke-width="2.3"/><text x="161" y="393" font-size="18" fill="#294551" text-anchor="start" font-weight="600">① XP_REF</text><text x="161" y="417" font-size="15" fill="#64777f" text-anchor="start" font-weight="400">参考管 · 二极管连接</text><text x="161" y="439" font-size="15" fill="#64777f" text-anchor="start" font-weight="400">W/L = 20/4 µm</text><path d="M104,327 L104,356" fill="none" stroke="#188b7d" stroke-width="2.8" marker-end="url(#ref)"/><text x="28" y="455" font-size="16" fill="#188b7d" text-anchor="start" font-weight="600">参考支路</text><text x="28" y="478" font-size="16" fill="#188b7d" text-anchor="start" font-weight="600">始终导通</text><g data-device="XP_PASS" data-nets="BIAS PWM_DRIVE GATE VSS" data-terminal-order="D G S B" data-channel-on="true" transform="matrix(0 1 1 0 350 300)"><polyline points="-10,-22 -10,-12" fill="none" stroke="#8a5ab3" stroke-width="3.3"/><polyline points="-10,-5 -10,5" fill="none" stroke="#8a5ab3" stroke-width="3.3"/><polyline points="-10,12 -10,22" fill="none" stroke="#8a5ab3" stroke-width="3.3"/><polyline points="-28,-24 -28,24" fill="none" stroke="#8a5ab3" stroke-width="2.3"/><polyline points="0,-45 0,-20 -10,-20" fill="none" stroke="#8a5ab3" stroke-width="2.3"/><polyline points="-10,20 0,20 0,45" fill="none" stroke="#8a5ab3" stroke-width="2.3"/><polyline points="-55,0 -28,0" fill="none" stroke="#8a5ab3" stroke-width="2.3"/></g><text x="309" y="321" font-size="13" fill="#64777f" text-anchor="start" font-weight="400">D</text><text x="381" y="321" font-size="13" fill="#64777f" text-anchor="start" font-weight="400">S</text><text x="360" y="262" font-size="13" fill="#64777f" text-anchor="start" font-weight="400">G</text><polyline points="350,230 350,245" fill="none" stroke="#8a5ab3" stroke-width="2.3"/><text x="350" y="223" font-size="16" fill="#8a5ab3" text-anchor="middle" font-weight="600">PWM_DRIVE</text><text x="292" y="345" font-size="18" fill="#294551" text-anchor="start" font-weight="600">③ XP_PASS</text><text x="292" y="369" font-size="15" fill="#8a5ab3" text-anchor="start" font-weight="400">偏置开关：导通</text><polyline points="395,300 510,300 510,395 535,395" fill="none" stroke="#8a5ab3" stroke-width="2.3"/><text x="466" y="282" font-size="18" fill="#8a5ab3" text-anchor="start" font-weight="600">GATE</text><text x="590" y="144" font-size="17" fill="#294551" text-anchor="middle" font-weight="600">VLED</text><polyline points="590,154 590,199" fill="none" stroke="#d77a1d" stroke-width="3"/><path d="M576,199 H604 L590,224 Z M574,228 H606" fill="none" stroke="#d77a1d" stroke-width="2.5"/><polyline points="590,228 590,350" fill="none" stroke="#d77a1d" stroke-width="3"/><path d="M611,209 L632,189" fill="none" stroke="#d77a1d" stroke-width="2.8" marker-end="url(#led)"/><path d="M618,221 L639,201" fill="none" stroke="#d77a1d" stroke-width="2.8" marker-end="url(#led)"/><text x="556" y="193" font-size="13" fill="#64777f" text-anchor="start" font-weight="400">A</text><text x="556" y="249" font-size="13" fill="#64777f" text-anchor="start" font-weight="400">K</text><text x="642" y="223" font-size="16" fill="#64777f" text-anchor="start" font-weight="400">片外</text><text x="642" y="246" font-size="16" fill="#64777f" text-anchor="start" font-weight="400">MicroLED</text><text x="607" y="291" font-size="18" fill="#294551" text-anchor="start" font-weight="600">LED_K</text><g data-device="XP_OUT" data-nets="LED_K GATE VSS VSS" data-terminal-order="D G S B" data-channel-on="true" transform="translate(590 395)"><polyline points="-10,-22 -10,-12" fill="none" stroke="#d77a1d" stroke-width="3.3"/><polyline points="-10,-5 -10,5" fill="none" stroke="#d77a1d" stroke-width="3.3"/><polyline points="-10,12 -10,22" fill="none" stroke="#d77a1d" stroke-width="3.3"/><polyline points="-28,-24 -28,24" fill="none" stroke="#8a5ab3" stroke-width="2.3"/><polyline points="0,-45 0,-20 -10,-20" fill="none" stroke="#d77a1d" stroke-width="2.3"/><polyline points="-10,20 0,20 0,45" fill="none" stroke="#d77a1d" stroke-width="2.3"/><polyline points="-55,0 -28,0" fill="none" stroke="#8a5ab3" stroke-width="2.3"/></g><text x="600" y="364" font-size="13" fill="#64777f" text-anchor="start" font-weight="400">D</text><text x="600" y="438" font-size="13" fill="#64777f" text-anchor="start" font-weight="400">S</text><text x="535" y="385" font-size="13" fill="#64777f" text-anchor="start" font-weight="400">G</text><text x="622" y="378" font-size="17" fill="#294551" text-anchor="start" font-weight="600">② XP_OUT</text><text x="622" y="404" font-size="15" fill="#64777f" text-anchor="start" font-weight="400">恒流下拉</text><text x="622" y="428" font-size="15" fill="#64777f" text-anchor="start" font-weight="400">20/4 µm</text><path d="M675,308 L675,347" fill="none" stroke="#d77a1d" stroke-width="2.8" marker-end="url(#led)"/><text x="640" y="474" font-size="17" fill="#d77a1d" text-anchor="start" font-weight="600">ILED</text><text x="609" y="499" font-size="17" fill="#d77a1d" text-anchor="start" font-weight="600">约 100 µA</text><polyline points="510,395 410,395 410,410" fill="none" stroke="#8a5ab3" stroke-width="2.3"/><circle cx="510" cy="395" r="3.8" fill="#8a5ab3"/><g data-device="XP_CLAMP" data-nets="GATE PWM_B VSS VSS" data-terminal-order="D G S B" data-channel-on="false" transform="translate(410 455)"><polyline points="-10,-22 -10,-12" fill="none" stroke="#a0abb1" stroke-width="3.3"/><polyline points="-10,-5 -10,5" fill="none" stroke="#a0abb1" stroke-width="3.3"/><polyline points="-10,12 -10,22" fill="none" stroke="#a0abb1" stroke-width="3.3"/><polyline points="-28,-24 -28,24" fill="none" stroke="#8a5ab3" stroke-width="2.3"/><polyline points="0,-45 0,-20 -10,-20" fill="none" stroke="#a0abb1" stroke-width="2.3"/><polyline points="-10,20 0,20 0,45" fill="none" stroke="#a0abb1" stroke-width="2.3"/><polyline points="-55,0 -28,0" fill="none" stroke="#8a5ab3" stroke-width="2.3"/></g><text x="420" y="424" font-size="13" fill="#64777f" text-anchor="start" font-weight="400">D</text><text x="420" y="498" font-size="13" fill="#64777f" text-anchor="start" font-weight="400">S</text><text x="355" y="445" font-size="13" fill="#64777f" text-anchor="start" font-weight="400">G</text><polyline points="300,455 355,455" fill="none" stroke="#8a5ab3" stroke-width="2.3"/><text x="296" y="485" font-size="16" fill="#8a5ab3" text-anchor="start" font-weight="600">PWM_B</text><text x="439" y="461" font-size="17" fill="#294551" text-anchor="start" font-weight="600">④ XP_CLAMP</text><text x="439" y="486" font-size="15" fill="#64777f" text-anchor="start" font-