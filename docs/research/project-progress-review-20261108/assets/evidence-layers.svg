<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="545" viewBox="0 0 1200 545"><rect width="100%" height="100%" fill="white"/><text x="32" y="43" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="27" font-weight="600" fill="#233f4b">每个证据层分别回答一个问题</text><rect x="32" y="76" width="1136" height="66" rx="8" fill="#eef4f3" stroke="#bfd1d0" stroke-width="2"/><text x="49" y="104" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="22" font-weight="600" fill="#233f4b">文献与模型</text><text x="292" y="104" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="21" font-weight="400" fill="#233f4b">器件参数/测量条件有哪些？</text><text x="292" y="130" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="19" font-weight="400" fill="#657a84">资料已整理；动态物理识别仍有缺口</text><rect x="32" y="156" width="1136" height="66" rx="8" fill="#eef4f3" stroke="#bfd1d0" stroke-width="2"/><text x="49" y="184" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="22" font-weight="600" fill="#233f4b">RTL与晶体管</text><text x="292" y="184" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="21" font-weight="400" fill="#233f4b">数字时序、电流和接收是否符合模型？</text><text x="292" y="210" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="19" font-weight="400" fill="#657a84">已有指定范围实验，保留通过与失败</text><rect x="32" y="236" width="1136" height="66" rx="8" fill="#eef4f3" stroke="#bfd1d0" stroke-width="2"/><text x="49" y="264" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="22" font-weight="600" fill="#233f4b">布局与寄生</text><text x="292" y="264" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="21" font-weight="400" fill="#233f4b">实际几何连接及寄生怎样改变电路？</text><text x="292" y="290" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="19" font-weight="400" fill="#657a84">照明宏/共同顶层和旧高速核心有结果</text><rect x="32" y="316" width="1136" height="66" rx="8" fill="#f8f2e8" stroke="#bfd1d0" stroke-width="2"/><text x="49" y="344" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="22" font-weight="600" fill="#233f4b">完整芯片/封装</text><text x="292" y="344" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="21" font-weight="400" fill="#233f4b">全部电路、接口、电源与可靠性是否闭合？</text><text x="292" y="370" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="19" font-weight="400" fill="#657a84">未完成完整签核</text><rect x="32" y="396" width="1136" height="66" rx="8" fill="#f8f2e8" stroke="#bfd1d0" stroke-width="2"/><text x="49" y="424" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="22" font-weight="600" fill="#233f4b">硅片与光学链路</text><text x="292" y="424" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="21" font-weight="400" fill="#233f4b">真实光功率、误码、温度与寿命如何？</text><text x="292" y="450" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="19" font-weight="400" fill="#657a84">尚未实物验证</text><text x="32" y="514" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="21" font-weight="400" fill="#233f4b">通过某一层，不会自动使下一层通过；教学三维几何也不是TCAD/热/电磁场求解。</text></svg>
