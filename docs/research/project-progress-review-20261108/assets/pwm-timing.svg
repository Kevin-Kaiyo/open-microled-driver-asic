<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="495" viewBox="0 0 1200 495"><rect width="100%" height="100%" fill="white"/><text x="32" y="42" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="27" font-weight="600" fill="#233f4b">同样写“1MHz”，对应的PWM能力不同</text><text x="34" y="94" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="23" font-weight="600" fill="#233f4b">现有已验证</text><text x="238" y="94" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="23" font-weight="400" fill="#233f4b">clock = 1MHz；slot = 1<tspan font-family="Arial">µ</tspan>s；256 slots/frame</text><path d="M238 145 L238 115 L278 115 L278 145 L318 145 L318 115 L358 115 L358 145 L398 145 L398 115 L438 115 L438 145 L478 145 L478 115 L518 115 L518 145 L558 145 L558 115 L598 115 L598 145" fill="none" stroke="#437b80" stroke-width="3"/><text x="644" y="136" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="21" font-weight="400" fill="#233f4b">…… 共256个时隙</text><path d="M238 212 L238 175 L278 175 L278 212 L1030 212" fill="none" stroke="#437b80" stroke-width="3"/><text x="238" y="248" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="23" font-weight="400" fill="#233f4b">最低码：导通1<tspan font-family="Arial">µ</tspan>s；完整PWM周期256<tspan font-family="Arial">µ</tspan>s；载波3.90625kHz</text><path d="M34 281 L1156 281" fill="none" stroke="#d5e0df" stroke-width="2"/><text x="34" y="329" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="23" font-weight="600" fill="#233f4b">新条件推导</text><text x="238" y="329" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="23" font-weight="400" fill="#233f4b">若要求1MHz载波 + 8bit等时隙计数PWM</text><rect x="238" y="353" width="800" height="65" rx="8" fill="#f8f2e8" stroke="#bfd1d0" stroke-width="2"/><text x="258" y="394" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="24" font-weight="600" fill="#233f4b">周期1<tspan font-family="Arial">µ</tspan>s / 256 = 3.90625ns；计数clock = 256MHz</text><text x="34" y="466" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="21" font-weight="400" fill="#697b83">示意图不按同一时间比例绘制。新条件尚未在当前RTL/输出级/负载上完成验证。</text></svg>
