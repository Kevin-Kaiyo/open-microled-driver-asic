<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530.00" viewBox="0 0 960 530.00" role="img" aria-labelledby="title desc" data-evidence="electrical body-contact explanation for LVS failure; not a process cross-section">
<title id="title">版图失效实例：PMOS体端必须有真实井接触</title><desc id="desc">electrical body-contact explanation for LVS failure; not a process cross-section; independent drawing; no new EDA</desc>
