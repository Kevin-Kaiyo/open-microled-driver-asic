<polyline points="615,200 622,200" fill="none" stroke="#304b57" stroke-width="2.2"/>
<text x="718" y="185" font-size="19.0000" fill="#304b57" text-anchor="start" font-weight="600"><tspan x="718.0" y="185.0">PMOS</tspan></text>
</g>
<text x="718" y="156" font-size="16.0000" fill="#304b57" text-anchor="start"><tspan x="718.0" y="156.0">buf_2 + filltie</tspan></text>
<text x="520" y="90" font-size="23.0000" fill="#176e73" text-anchor="start" font-weight="600"><tspan x="520.0" y="90.0">修复：加入官方井接触单元</tspan></text>
<polyline points="650,155 650,120 820,120 820,200 695,200" fill="none" stroke="#304b57" stroke-width="2.2"/>
<circle cx="650" cy="120" r="3.5" fill="#304b57"/>
<text x="650" y="110" font-size="18.0000" fill="#304b57" text-anchor="middle"><tspan x="650.0" y="110.0">VBUF</tspan></text>
<text x="760" y="245" font-size="18.0000" fill="#304b57" text-anchor="start"><tspan x="760.0" y="245.0">N-well → VBUF</tspan></text>
<polyline points="650,245 650,300" fill="none" stroke="#304b57" stroke-width="2.2"/>
<text x="650" y="330" font-size="18.0000" fill="#304b57" text-anchor="middle"><tspan x="650.0" y="330.0">输出</tspan></text>
<polyline points="595,200 540,200" fill="none" stroke="#304b57" stroke-width="2.2"/>
<text x="520" y="193" font-size="18.0000" fill="#304b57" text-anchor="end"><tspan x="520.0" y="193.0">输入</tspan></text>
<text x="35" y="395" font-size="22.0000" fill="#176e73" text-anchor="start" font-weight="600"><tspan x="35.0" y="395.0">门极、源极、漏极连通，不代表体端已经接好。</tspan></text>
<text x="35" y="440" font-size="19.0000" fill="#304b57" text-anchor="start"><tspan x="35.0" y="440.0">LVS比较的是实际抽取连接；井接触缺失时，原理图与版图并不等价。</tspan></text>
<text x="35" y="482" font-size="19.0000" fill="#304b57" text-anchor="start"><tspan x="35.0" y="482.0">增加filltie后重新抽取和LVS；原失败网表、日志保留以便复现。</tspan></text>
</g></svg>
