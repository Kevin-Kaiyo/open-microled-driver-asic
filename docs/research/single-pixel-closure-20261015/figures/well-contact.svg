</g>
<text x="288" y="156" font-size="16.0000" fill="#304b57" text-anchor="start"><tspan x="288.0" y="156.0">独立buf_2单元</tspan></text>
<text x="70" y="90" font-size="23.0000" fill="#b56336" text-anchor="start" font-weight="600"><tspan x="70.0" y="90.0">首轮：缺少井接触</tspan></text>
<polyline points="220,155 220,120" fill="none" stroke="#304b57" stroke-width="2.2"/>
<text x="220" y="110" font-size="18.0000" fill="#304b57" text-anchor="middle"><tspan x="220.0" y="110.0">VBUF</tspan></text>
<polyline points="220,245 220,300" fill="none" stroke="#304b57" stroke-width="2.2"/>
<text x="220" y="330" font-size="18.0000" fill="#304b57" text-anchor="middle"><tspan x="220.0" y="330.0">输出</tspan></text>
<polyline points="165,200 110,200" fill="none" stroke="#304b57" stroke-width="2.2"/>
<text x="90" y="193" font-size="18.0000" fill="#304b57" text-anchor="end"><tspan x="90.0" y="193.0">输入</tspan></text>
<polyline points="265,200 340,200" fill="none" stroke="#304b57" stroke-width="2.2"/>
<text x="300" y="244" font-size="18.0000" fill="#b56336" text-anchor="start"><tspan x="300.0" y="244.0">井区无电源接触</tspan></text>
<circle cx="340" cy="200" r="5" fill="white" stroke="#b56336" stroke-width="2"/>
<g data-device="PMOS" data-type="P">
<polyline points="640,178 640,188" fill="none" stroke="#304b57" stroke-width="2.2"/>
<polyline points="640,195 640,205" fill="none" stroke="#304b57" stroke-width="2.2"/>
