<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>单像素 r5 真实版图</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f5f4;color:#29434c;font:16px/1.65 'Avenir Next','PingFang SC',sans-serif}header{padding:24px 32px;background:white;border-bottom:1px solid #ccd9d8}h1{font-size:27px;margin:0;color:#176e73}p{margin:8px 0}main{padding:20px 32px}button,select{font:inherit;border:1px solid #bccfce;border-radius:4px;padding:5px 12px;background:white;color:#29434c;cursor:pointer}a{color:#176e73}aside{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;margin:12px 0}label{white-space:nowrap}canvas{width:100%;height:65vh;min-height:360px;background:white;border:1px solid #bdcdcc;touch-action:none;cursor:grab}#info{font-size:14px}footer{font-size:14px;color:#587179;padding:14px 0}input{accent-color:#176e73}</style><header><h1>单像素 r5 · 真实二维版图</h1><p>参考源、传输门、故障保护、LED钳位、像素电流镜与 buf_2，共39只MOS。滚轮缩放，拖动平移。</p><a href="../report.html">返回研究报告</a></header><main><button id="reset">全图</button> <button id="plus">放大</button> <button id="minus">缩小</button> <select id="port"><option value="">定位端口</option></select> <label><input id="labels" type="checkbox"> 显示所有端口</label><aside id="layers"></aside><canvas id="layout"></canvas><div id="info"></div><footer>按实际 GDS 多边形绘制；单位 µm。该测试宏未包括 pad/ESD/封装。隐藏层只改变显示，不改变电路或验证结果。二维图不表示三维电磁、热或工艺仿真。</footer></main><script>
(async()=>{const d=await(await fetch('geometry.json')).json(),canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),enabled=new Set(Object.keys(d.layers));let scale=1,ox=0,oy=0,drag=null,selected='';const bbox=d.bbox_um;function fit(){scale=Math.min((canvas.clientWidth-70)/(bbox[2]-bbox[0]),(canvas.clientHeight-100)/(bbox[3]-bbox[1]));ox=canvas.clientWidth/2-(bbox[0]+bbox[2])/2*scale;oy=canvas.clientHeight/2+(bbox[1]+bbox[3])/2*scale;draw()}function size(){let r=devicePixelRatio||1;canvas.width=canvas.clientWidth*r;canvas.height=canvas.clientHeight*r;ctx.setTransform(r,0,0,r,0,0);fit()}function point(x,y){return [ox+x*scale,oy-y*scale]}function draw(){ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);for(const p of d.polygons){if(!enabled.has(String(p.layer)))continue;ctx.fillStyle=d.layers[p.layer].color;ctx.beginPath();p.points.forEach(([x,y],i)=>{let [a,b]=point(x,y);i?ctx.lineTo(a,b):ctx.moveTo(a,b)});ctx.closePath();ctx.fill()}for(const [name,p]of Object.entries(d.ports)){if(name!==selected&&!document.querySelector('#labels').checked)continue;let [x,y]=point(...p.xy_um);ctx.strokeStyle='#b56336';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,7,0,2*Math.PI);ctx.stroke();ctx.font='14px "Avenir Next","PingFang SC"';ctx.fillStyle='#29434c';ctx.fillText(name,x+9,y-9)}let length=10**Math.floor(Math.log10(120/scale));ctx.strokeStyle='#29434c';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(25,canvas.clientHeight-25);ctx.lineTo(25+length*scale,canvas.clientHeight-25);ctx.stroke();ctx.fillStyle='#29434c';ctx.font='14px sans-serif';ctx.fillText(length+' µm',25,canvas.clientHeight-34)}for(const [id,l]of Object.entries(d.layers)){let lab=document.createElement('label'),cb=document.createElement('input');cb.type='checkbox';cb.checked=true;cb.onchange=()=>{cb.checked?enabled.add(id):enabled.delete(id);draw()};lab.append(cb,document.createTextNode(l.name));lab.style.color='#29434c';lab.style.borderBottom='3px solid '+l.color;document.querySelector('#layers').append(lab)}let port=document.querySelector('#port');for(const n of Object.keys(d.ports))port.add(new Option(n,n));port.onchange=()=>{selected=port.value;draw()};document.querySelector('#labels').onchange=draw;document.querySelector('#reset').onclick=fit;function zoom(f,x=canvas.clientWidth/2,y=canvas.clientHeight/2){scale*=f;ox=x+(ox-x)*f;oy=y+(oy-y)*f;draw()}document.querySelector('#plus').onclick=()=>zoom(1.5);document.querySelector('#minus').onclick=()=>zoom(1/1.5);canvas.onwheel=e=>{e.preventDefault();zoom(e.deltaY<0?1.15:1/1.15,e.offsetX,e.offsetY)};canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY,ox,oy];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;ox=drag[2]+e.clientX-drag[0];oy=drag[3]+e.clientY-drag[1];draw()};canvas.onpointerup=()=>drag=null;document.querySelector('#info').textContent=`GDS ${d.top} | ${(bbox[2]-bbox[0]).toFixed(2)} × ${(bbox[3]-bbox[1]).toFixed(2)} µm | ${d.polygons.length}个多边形 | SHA-256 ${d.gds_sha256}`;window.addEventListener('resize',size);size();window.viewerData={top:d.top,polygons:d.polygons.length,layers:Object.keys(d.layers).length,ports:Object.keys(d.ports).length,gds_sha256:d.gds_sha256};})();
</script></html>
