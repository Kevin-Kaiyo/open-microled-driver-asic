<text x="35" y="658" font-size="18" fill="#203b50">XCLAMP / XCLAMPRST 均为 GF180 6 V NMOS，体端接 0；RC 是开环控制，并非 power-good。</text>
<text x="35" y="687" font-size="17" fill="#203b50">同名网络标签直接电连接；没有用理想延迟元件替代这些 MOS。</text>
