<text x="760" y="385" font-size="18" fill="#233e4e" text-anchor="start">2.5 kΩ</text>
<rect x="820" y="260" width="230" height="80" rx="4" fill="#edf3f5" stroke="#345264" stroke-width="2"/>
<text x="935" y="292" font-size="18" fill="#233e4e" text-anchor="middle">原内部 CMOS 预驱动</text>
<text x="935" y="320" font-size="18" fill="#233e4e" text-anchor="middle">DI → GN</text>
<text x="35" y="490" font-size="19" fill="#233e4e" text-anchor="start">原理：栅极下降通过 MOS 的寄生 Cgd 向输出耦合负向电荷。</text>
<text x="35" y="521" font-size="19" fill="#233e4e" text-anchor="start">串联电阻使实际栅 dV/dt 减小；负峰可能降低，但延迟与短路电流会改变。</text>
<text x="35" y="552" font-size="17" fill="#233e4e" text-anchor="start">Cgd 属于 PDK MOS 模型，并非人为新增电容；本图不宣称提取到独立 Cgd 数值。</text>
<text x="35" y="591" font-size="18" fill="#233e4e" text-anchor="start">另一支路：D_CMD → 同值RCMD → XPHYDBP/N → db_src → DBI → GP。</text>
<text x="35" y="622" font-size="18" fill="#233e4e" text-anchor="start">P管体接 VPHY，N管体接 VSS；W/L单位 µm。实际候选以各网表为准。</text>
<text x="35" y="653" font-size="17" fill="#233e4e" text-anchor="start">8源计能包含 VPHY 与两路理想命令端；不代表实物 FPGA / LVDS / CML / Pad / ESD。</text>
<text x="35" y="684" font-size="17" fill="#233e4e" text-anchor="start">顺序：先只改RCMD；再在330Ω条件只改内部150→75Ω，分开检验应力与速率。</text>
</svg>