<text x="35" y="646" font-size="19" fill="#203b50">代价：增加输入电容、静态/交越及翻转功耗和传播延迟；须重新测实际接收余量。</text>
<text x="35" y="684" font-size="18" fill="#203b50">保留缺口：TT 高电压短窗 ib1 达 3.639 V，仍超过 3.63 V 研究筛选；此图不是全角通过声明。</text>
