<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 390" role="img" aria-labelledby="title">
<title id="title">前置驱动 SPICE 接法，级间取反与对称双路</title>
<style>text{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#172d3a}.h{font-size:23px;font-weight:bold}.s{font-size:16px}.q{font-size:14px;fill:#526773}.wire{stroke:#253f50;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.part{stroke:#27666a;stroke-width:2;fill:#e9f4f3}</style>
<defs><g id="inv"><path class="part" d="M0 -18V18L31 0Z"/><circle cx="36" r="4.5" class="part"/></g><g id="c"><path class="wire" d="M0 0V31M-9 31H9M-9 38H9M0 38V56M-9 56H9M-6 60H6M-3 64H3"/></g><g id="r"><path class="wire" d="M0 0H12L16 -6L22 6L28 -6L34 6L40 -6L44 0H56"/></g></defs>
<rect width="1120" height="390" rx="15" fill="#f7fafb"/>
<rect x="20" y="20" width="524" height="313" rx="10" fill="#fff" stroke="#ccdce1"/>
<rect x="576" y="20" width="524" height="313" rx="10" fill="#fff" stroke="#ccdce1"/>
<text x="46" y="61" class="h">B 的前置驱动接法</text><text x="602" y="61" class="h">对称双路对照</text>
<text x="46" y="92" class="q">GB 取自第一级，GP 取自第二级</text><text x="602" y="92" class="q">各用两级反相器，D̅ 由独立的理想源提供</text>
<path class="wire" d="M84 161H98M154 161H191M232 161H327M368 161H484"/>
<use href="#r" x="98" y="161"/><use href="#inv" x="191" y="161"/><use href="#inv" x="327" y="161"/>
<circle cx="278" cy="161" r="3" fill="#253f50"/><circle cx="462" cy="161" r="3" fill="#253f50"/>
<use href="#c" x="278" y="161"/><use href="#c" x="462" y="161"/>
<text x="65" y="166" class="s">D</text><text x="105" y="141" class="q">50 Ω</text><text x="255" y="140" class="s">GB</text><text x="436" y="140" class="s">GP</text>
<text x="292" y="199" class="q">Cgate</text><text x="477" y="199" class="q">Cgate</text>
<path class="wire" d="M637 145H651M707 145H747M788 145H842M883 145H1032M637 239H651M707 239H747M788 239H842M883 239H1032"/>
<use href="#r" x="651" y="145"/><use href="#r" x="651" y="239"/>
<use href="#inv" x="747" y="145"/><use href="#inv" x="842" y="145"/>
<use href="#inv" x="747" y="239"/><use href="#inv" x="842" y="239"/>
<circle cx="999" cy="145" r="3" fill="#253f50"/><circle cx="999" cy="239" r="3" fill="#253f50"/>
<use href="#c" x="999" y="145"/><use href="#c" x="999" y="239"/>
<text x="617" y="150" class="s">D</text><text x="617" y="244" class="s">D̅</text>
<text x="661" y="126" class="q">50 Ω</text><text x="661" y="222" class="q">50 Ω</text>
<text x="977" y="124" class="s">GP</text><text x="977" y="222" class="s">GB</text>
<text x="1012" y="183" class="q">Cgate</text><text x="1012" y="277" class="q">Cgate</text>
<text x="39" y="365" class="q">反相器均由同尺寸 PMOS / NMOS 构成，VDD = 3.3 V。两门极以相同线性电容隔离模拟，不接发光器件或实际电流转向管。</text>
</svg>
