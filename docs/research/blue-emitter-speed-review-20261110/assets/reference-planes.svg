<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580"><rect width="1200" height="580" fill="white"/><text x="28" y="39" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="27" fill="#243f49">先区分三条响应，再决定改电路还是改器件</text><text x="30" y="90" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="22" fill="#243f49">电气参考面</text><text x="432" y="90" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="22" fill="#243f49">发光参考面</text><text x="833" y="90" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="22" fill="#243f49">接收参考面</text><rect x="28" y="109" width="335" height="115" rx="7" fill="#edf4f3" stroke="#b7cecd" stroke-width="2"/><text x="45" y="145" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="23" fill="#243f49">输入 → 门驱 → 输出 MOS</text><text x="45" y="181" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="20" fill="#243f49">端口电流 = 导电 + 充放电</text><text x="45" y="209" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="18" fill="#243f49">观察门极摆幅 / 电荷 / 端压</text><rect x="430" y="109" width="335" height="115" rx="7" fill="#edf4f3" stroke="#b7cecd" stroke-width="2"/><text x="446" y="145" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="23" fill="#243f49">MicroLED 或 VCSEL</text><text x="446" y="181" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="20" fill="#243f49">复合寿命或激光弛豫 / 阻尼</text><text x="446" y="209" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="18" fill="#243f49">观察 P(t)、OMA 和频响</text><rect x="832" y="109" width="335" height="115" rx="7" fill="#edf4f3" stroke="#b7cecd" stroke-width="2"/><text x="848" y="145" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="23" fill="#243f49">光路 → PD/TIA → 判决</text><text x="848" y="181" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="20" fill="#243f49">光损耗、带宽、噪声、时钟</text><text x="848" y="209" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="18" fill="#243f49">独立训练后验证错误与余量</text><path d="M365 161 L423 161 M413 153 L423 161 L413 169" fill="none" stroke="#527b82" stroke-width="3"/><path d="M767 161 L825 161 M815 153 L825 161 L815 169" fill="none" stroke="#527b82" stroke-width="3"/><path d="M28 252 L1166 252" fill="none" stroke="#d3dfdf" stroke-width="2"/><text x="30" y="291" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="23" fill="#243f49">LED 电气负载分解（教学示意，参数扫描不能当作尺寸换算）</text><path d="M144 330 L330 330 M144 330 L144 358 M330 330 L330 365" fill="none" stroke="#527b82" stroke-width="3"/><text x="30" y="335" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="20" fill="#243f49">阳极 VA</text><path d="M120 358 L168 358 L144 402 Z M120 407 L168 407 M144 407 L144 449" fill="none" stroke="#527b82" stroke-width="3"/><text x="38" y="390" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="20" fill="#243f49">I–V</text><path d="M305 365 L355 365 M305 386 L355 386 M330 386 L330 449 M144 449 L330 449 M240 449 L240 470 L230 470 L230 503 L250 503 L250 470 M240 503 L240 524" fill="none" stroke="#527b82" stroke-width="3"/><text x="363" y="379" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="20" fill="#243f49">Cj + pad + ESD</text><text x="267" y="497" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="20" fill="#243f49">R / L 封装和回流</text><text x="30" y="546" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="20" fill="#243f49">阴极 VK → Driver 输出端</text><rect x="566" y="310" width="600" height="244" rx="7" fill="#edf4f3" stroke="#b7cecd" stroke-width="2"/><text x="585" y="347" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="24" fill="#243f49">每个频率点都运行实际晶体管网表</text><text x="585" y="388" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="21" fill="#243f49">1. 保持 I0/I1、负载、光响应和 RX</text><text x="585" y="428" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="21" fill="#243f49">2. 改变真实输入码流的位周期</text><text x="585" y="468" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="21" fill="#243f49">3. 同时检查零错、幅度、时间和应力</text><text x="585" y="508" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="21" fill="#243f49">4. 找到通过点与失效点，再细扫</text></svg>
