0 L608 530" fill="none" stroke="#286f76" stroke-width="3"/><text x="25" y="548" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="22" fill="#213e49">低位目标 25 µA：XBASE 保持导通；调制电流流过 RDUMMY / XDUMMY。</text><text x="25" y="581" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="22" fill="#213e49">高位目标 100 µA：调制支路另提供约 75 µA，经 MicroLED / XLED。</text><text x="25" y="618" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="21" fill="#213e49">限制来自门驱摆幅和时差、输出储能、尾管合规电压、dummy 匹配及回流寄生。</text><circle cx="380" cy="108" r="4" fill="#286f76"/><circle cx="380" cy="215" r="4" fill="#286f76"/><circle cx="603" cy="376" r="4" fill="#286f76"/></svg>
