825" font-size="19" fill="#233d4b" font-weight="400" text-anchor="start">XRIN：PDK 高阻 poly，1 µm × RINL。</text><text x="500" y="860" font-size="19" fill="#233d4b" font-weight="400" text-anchor="start">XTAIL 的 W = WUNIT，L = 1 µm；</text><text x="500" y="895" font-size="19" fill="#233d4b" font-weight="400" text-anchor="start">三只 WUNIT 均用同一校准值 2.02 µm。</text><text x="500" y="930" font-size="19" fill="#233d4b" font-weight="400" text-anchor="start">OUT / BIAS 为三个单元共有网络。</text><text x="1070" y="1050" font-size="17" fill="#188578" font-weight="400" text-anchor="start">VIN → RDUMMY1 → DUMMY1 → XDUMMY1 → VX1</text><text x="1070" y="1080" font-size="17" fill="#188578" font-weight="400" text-anchor="start">OUT → XLED1 → VX1 → XTAIL1 → VSS</text><polyline points="48,1118 1752,1118" fill="none" stroke="#e0e8ec" stroke-width="1.5"/><text x="48" y="1146" font-size="16" fill="#667c87" font-weight="400" text-anchor="start">共 7 MOS：4 缓冲 + 2 转向 + 1 尾管；另外的公共 XREF / XBASE 在 c-overview。</text><text x="48" y="1173" font-size="16" fill="#667c87" font-weight="400" text-anchor="start">RDUMMY1/2/3 各为 150 kΩ；单元 2 输入 D1，单元 3 输入 T3；不能把本图误作仅 7 MOS 的 C。</text><text x="48" y="1226" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">源 SHA-256 前缀：route_c: 096ecd179ead；完整哈希及逐器件覆盖见 manifest。</text></svg>
