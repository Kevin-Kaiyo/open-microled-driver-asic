34" font-size="18" fill="#188578" font-weight="600" text-anchor="start">OUT</text><polyline points="1320,617 1320,642" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="1320" y="667" font-size="18" fill="#188578" font-weight="600" text-anchor="middle">VL</text><polyline points="1258,330 1215,330 1215,565 1258,565" fill="none" stroke="#8164a8" stroke-width="2.7"/><text x="1207" y="450" font-size="18" fill="#8164a8" font-weight="600" text-anchor="end">CTRL</text><circle cx="1215" cy="445" r="4.5" fill="#8164a8"/><text x="60" y="170" font-size="18" fill="#667c87" font-weight="400" text-anchor="start">同名网络相连；PMOS 上端为 S、下端为 D，NMOS 相反；每只体端 B 单独标明。</text><polyline points="180,746 180,760" fill="none" stroke="#233d4b" stroke-width="2.7"/><rect x="168" y="760" width="24" height="60" fill="white" stroke="#233d4b" stroke-width="2.7"/><polyline points="180,820 180,834" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="204" y="797" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">XRIN：D0 ↔ DI，PDK 高阻 poly 8 × 1 µm</text><text x="180" y="730" font-size="18" fill="#8164a8" font-weight="600" text-anchor="middle">D0</text><text x="180" y="865" font-size="18" fill="#8164a8" font-weight="600" text-anchor="middle">DI</text><rect x="780" y="735" width="930" height="150" rx="12" fill="#f4f7f9" stroke="#3d729e" stroke-width="1.5"/><text x="800" y="769" font-size="21" fill="#3d729e" font-weight="600" text-anchor="start">与辅助轨及负载的连接</text><text x="800" y="802" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">独立 VLED → 片外 LED / CLED / Rpkg / Lpkg → OUT。</text><text x="800" y="831" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">OUT 经 XPOUT / XNOUT 向 VH / VL 注入电流；由实际 shunt 耗散。</text><text x="800" y="860" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">D1 未使用；DISABLE 尚未实现，不能据接口名称声称启动保护。</text><polyline points="48,918 1752,918" fill="none" stroke="#e0e8ec" stroke-width="1.5"/><text x="48" y="946" font-size="16" fill="#667c87" font-weight="400" text-anchor="start">同名网络是电气连接标签；XRIN 的第三端接 VSS。此图只展开 6 MOS，另外 14 MOS 在 a-rails。</text><text x="48" y="973" font-size="16" fill="#667c87" font-weight="400" text-anchor="start">结面积/周长为共同原理级估计，不是实际布局提取；正常通信与启动诊断分别报告。</text><text x="48" y="1026" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">源 SHA-256 前缀：route_a: 02ba88d9b765；完整哈希及逐器件覆盖见 manifest。</text></svg>
