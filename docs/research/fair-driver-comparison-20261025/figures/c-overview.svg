+ 14 + 3 × 7 = 49 MOS</text><text x="1000" y="247" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">12：common-reference（真实 V-to-I + 2 MOS 禁止/keeper）</text><text x="1000" y="276" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">2：本图 XREF、XBASE（基础电流）</text><text x="1000" y="305" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">14：c-decoder（真实静态 CMOS，非理想逻辑源）</text><text x="1000" y="334" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">21：c-unit 的 7 MOS 单元重复三次（下表逐项对应）</text><text x="1000" y="363" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">另有 3 个 PDK RIN；不计作 MOS。</text><text x="70" y="490" font-size="21" fill="#3d729e" font-weight="600" text-anchor="start">实际输入与内部网络映射（同名 OUT / BIAS / VIN / VDD / VSS 为公共网络）</text><text x="70" y="540" font-size="17" fill="#3d729e" font-weight="600" text-anchor="start">单元</text><text x="190" y="540" font-size="17" fill="#3d729e" font-weight="600" text-anchor="start">输入 → RIN → DI</text><text x="580" y="540" font-size="17" fill="#3d729e" font-weight="600" text-anchor="start">缓冲管实例</text><text x="1020" y="540" font-size="17" fill="#3d729e" font-weight="600" text-anchor="start">转向/尾管</text><text x="1430" y="540" font-size="17" fill="#3d729e" font-weight="600" text-anchor="start">内部节点</text><text x="70" y="583" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">1</text><text x="190" y="583" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">T1 → XRIN1 → DI1</text><text x="580" y="583" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">XBUF1N/P；XBUF2N/P</text><text x="1020" y="583" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">XLED1 / XDUMMY1 / XTAIL1</text><text x="1430" y="583" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">GB1 GP1 VX1 DUMMY1</text><text x="70" y="626" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">2</text><text x=