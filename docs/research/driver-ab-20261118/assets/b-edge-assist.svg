<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 570" role="img" aria-labelledby="title desc"><title id="title">B 电流转向与下降沿补偿</title><desc id="desc">GB 上升时 NMOS 拉低 GP，LED 支路关闭，尾电流转入假负载。CFF 把 GB 边沿耦合到 OUT。</desc><rect width="1120" height="570" fill="#fbfcfa"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="28" y="42" fill="#1b3443" font-size="28" font-weight="650" text-anchor="start">B 电流转向级如何缩短接收端下降沿</text><text x="28" y="72" fill="#1b3443" font-size="16" font-weight="400" text-anchor="start">以 DATA 由 1 变 0 为例。图中同名节点直接相连，器件尺寸与支路名称可在 SPICE 网表中查阅。</text><polyline points="28,87 1092,87" stroke="#d3e3e0" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="34" y="120" fill="#076f70" font-size="22" font-weight="650" text-anchor="start">栅极预驱动</text><text x="34" y="154" fill="#1b3443" font-size="15" font-weight="400" text-anchor="start">第一级反相器输出 GB，以互补控制转向支路。</text><text x="175" y="198" fill="#1b3443" font-size="16" font-weight="400" text-anchor="middle">VDD</text><polyline points="175,204 175,220" stroke="#1b3443" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><polyline points="175,220 175,231 162,231 162,265 175,265 175,276" stroke="#1b3443" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><polyline points="156,233 156,263" stroke="#1b3443" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="151" cy="248" r="4.2" fill="#fbfcfa" stroke="#1b3443" stroke-width="2"/><polyline points="139,248 147,248" stroke="#1b3443" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><polyline points="175,276 175,301 175,326" stroke="#1b3443" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><polyline points="175,326 175,337 162,337 162,371 175,371 175,382" stroke="#1b3443" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><polyline points="156,339 156,369" stroke="#1b3443" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><polyline points="139,354 156,354" stroke="#1b3443" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><polyline points="175,382 175,390" stroke="#1b3443" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><polyline points="164,390 186,390" stroke="#1b3443" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><polyline points="168,395 182,395" stroke="#1b3443" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><polyline points="172,400 178,400" stroke="#1b3443" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><polyline points="83,248 139,248" stroke="#1b3443" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><polyline points="83,248 83,354 139,354" stroke="#1b3443" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><polyline points="43,301 83,301" stroke="#1b3443" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="83" cy="301" r="3.6" fill="#1b3443"/><text x="35" y="290" fill="#076f70" font-size="17" font-weight="650" text-anchor="start">GB ↑</text><polyline points="175,301 268,301" stroke="#076f70" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="175" cy="301" r="3.6" fill="#1b3443"/><text x="276" y="308" fill="#076f70" font-size="18" font-weight="650" text-anchor="start">GP ↓</text><text x="209" y="248" fill="#1b3443" font-size="16" font-weight="400" text-anchor="start">XINV2P</text><text x="208" y="355" fill="#1b3443" font-size="16" font-weight="400" text-anchor="start">XINV2N</text><text x="208" y="378" fill="#1b3443" font-size="14" font-weight="400" text-anchor="start">W  2.5 → 4 µm（试验）</text><text x="33" y="439" fill="#1b3443" font-size="15" font-weight="400" text-anchor="start">GB 上升后，XINV2N 将 GP 的栅电荷放到 VSS。</text><text x="33" y="465" fill="#1b3443" font-size="15" font-weight="400" text-anchor="start">GP 下降使 XLED 关断。该管加宽只改变预驱动。</text><polyline points="448,108 448,480" stroke="#d3e3e0" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="474" y="120" fill="#076f70" font-size="22" font-weight="650" text-anchor="start">LED 与假负载之间的电流转向</text><text x="474" y="154" fill="#1b3443" font-size="15" font-weight="400" text-anchor="start">OUT 接封装串联支路，通往 LED 阴极。</text><text x="976" y="170" fill="#1b3443" font-size="15" font-weight="400" text-anchor="middle">VIN</text><polyline points="976,177 976,186" stroke="#1b3443" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><polyline points="976,186 969,192 983,198 969,204 983,210 976,216 976,233" stroke="#1b3443" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="994" y="204" fill="#1b3443" font-size="14" font-weight="400" text-anchor="start">27.6 kΩ</text><text x="981" y="248" fill="#1b3443" font-size="13" font-weight="400" text-anchor="start">DUMMY</text><text x="731" y="188" fill="#076f70" font-size="16" font-weight="650" text-anchor="start">OUT（LED 阴极侧）</text><polyline points="735,200 760,200 760,267" stroke="#1b3443" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><polyline points="976,233 976,267" stroke="#1b3443" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="760" cy="211" r="3.6" fill="#1b3443"/><polyline points="760,267 760,278 747,278 747,312 760,312 760,323" stroke="#1b3443" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><polyline points="741,280 741,310" stroke="#1b3443" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><polyline points="724,295 741,295" stroke="#1b3443" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><polyline points="976,267 976,278 963,278 963,312 976,312 976,323" stroke="#1b3443" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><polyline points="957,280 957,310" stroke="#1b3443" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><polyline points="940,295 957,295" stroke="#1b3443" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><polyline points="700,295 724,295" stroke="#1b3443" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="666" y="300" fill="#076f70" font-size="16" font-weight="650" text-anchor="start">GP</text><polyline points="916,295 940,295" stroke="#1b3443" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="882" y="300" fill="#076f70" font-size="16" font-weight="650" text-anchor="start">GB</text><text x="779" y="301" fill="#1b3443" font-size="15" font-weight="400" text-anchor="start">XLED</text><text x="994" y="300" fill="#1b3443" font-size="15" font-weight="400" text-anchor="start">XDUMMY</text><polyline points="760,323 760,345 976,345 976,323" stroke="#1b3443" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><polyline points="868,345 868,370" stroke="#1b3443" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="868" cy="345" r="3.6" fill="#1b3443"/><text x="880" y="368" fill="#1b3443" font-size="14" font-weight="400" text-anchor="start">VX</text><polyline points="868,370 868,381 855,381 855,415 868,415 868,426" stroke="#1b3443" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><polyline points="849,383 849,413" stroke="#1b3443" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><polyline points="832,398 849,398" stroke="#1b3443" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><polyline points="800,398 832,398" stroke="#1b3443" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="754" y="403" fill="#076f70" font-size="15" font-weight="650" text-anchor="start">BIAS</text><polyline points="868,426 868,434" stroke="#1b3443" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><polyline points="857,434 879,434" stroke="#1b3443" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><polyline points="861,439 875,439" stroke="#1b3443" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><polyline points="865,444 871,444" stroke="#1b3443" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="888" y="403" fill="#1b3443" font-size="15" font-weight="400" text-anchor="start">XTAIL ×3</text><polyline points="570,211 602,211" stroke="#1b3443" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><polyline points="602,199 602,223" stroke="#076f70" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><polyline points="610,199 610,223" stroke="#076f70" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><polyline points="610,211 760,211" stroke="#076f70" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="531" y="216" fill="#076f70" font-size="16" font-weight="650" text-anchor="start">GB</text><text x="547" y="249" fill="#076f70" font-size="15" font-weight="400" text-anchor="start">CFF  31.275 → 36 fF</text><text x="474" y="466" fill="#1b3443" font-size="15" font-weight="400" text-anchor="start">XBASE 接 OUT / BIAS / VSS / VSS，提供约 25 µA 基流。</text><polyline points="28,487 1092,487" stroke="#d3e3e0" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="519" fill="#076f70" font-size="17" font-weight="650" text-anchor="start">GB 上升还通过 CFF 向 OUT 注入瞬态电荷，降低 LED 正向电压，加快 LED 导通电流下降。</text><text x="30" y="549" fill="#1b3443" font-size="15" font-weight="400" text-anchor="start">NMOS 体接 VSS，PMOS 体接 VDD。CFF 由预驱动供能，数字输入、供电与参考端口均计入每比特能耗。</text></g></svg>
