9" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><text x="634" y="502" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="20" fill="#213e49">XTAIL</text><text x="32" y="324" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="20" fill="#213e49">BCTRL</text><path d="M32 335 H100" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><text x="267" y="324" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="20" fill="#213e49">GP</text><path d="M270 335 H320" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><text x="715" y="324" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="20" fill="#213e49">GN</text><path d="M720 335 H770" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><text x="470" y="484" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="20" fill="#213e49">TCTRL</text><path d="M470 495 H540" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><path d="M180 385 V400 M170 400 H190 V430 H170 Z M180 430 V445" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><path d="M180 445 v12 m-20 0 h40 m-33 9 h26 m-19 9 h12" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><text x="25" y="392" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="18" fill="#213e49">SBASE</text><text x="210" y="423" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="20" fill="#213e49">RBASE 50 Ω</text><path d="M620 545 V550 M610 550 H630 V580 H610 Z M620 580 V600" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><path d="M620 600 v12 m-20 0 h40 m-33 9 h26 m-19 9 h12" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><text x="470" y="555" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="18" fill="#213e49">STAIL</text><text x="650" y="575" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="20" fill="#213e49">RTAIL 37.5 Ω</text><text x="25" y="675" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="22" fill="#213e49">输入对照：ATTEN 200 → 50 Ω；两条差分输入通路保持对称。</text><text x="25" y="715" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="22" fill="#213e49">换流对照：仅 XSTEER / XDUMP 的 W 40 → 20 µm，L 保持 0.28 µm。</text><text x="25" y="755" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="21" fill="#213e49">基准约 3 mA + 调制约 4 mA；减小寄生电容的同时必须复查导通压降与电流。</text><text x="25" y="805" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="19" fill="#213e49">NMOS 体端接 VSS；XBASE/XTAIL 各表示两只并联管；省略 0 V 电流采样源。</text></svg>
