<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="700" viewBox="0 0 1260 700"><rect width="1260" height="700" fill="white"/><text x="25" y="40" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="29" fill="#213e49">A：把输入 RC、缓冲延迟和输出阻抗分开改</text><text x="25" y="80" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="22" fill="#213e49">核心连接关系；两套真实 VH/VL 分流调节器保留，未在此展开。</text><path d="M300 135 v15 M300 250 v50 M300 400 v40" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><path d="M300 150 v25 h-18 M282 172 v15 m0 6 v14 m0 6 v15 M282 228 h18 v22 M269 172 v56" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><circle cx="260" cy="200" r="8" fill="white" stroke="#246e76" stroke-width="3"/><path d="M220 200 h32" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><text x="314" y="207" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="20" fill="#213e49">XP1</text><path d="M300 300 v25 h-18 M282 322 v15 m0 6 v14 m0 6 v15 M282 378 h18 v22 M269 322 v56" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><path d="M220 350 h49" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><text x="314" y="357" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="20" fill="#213e49">XN1</text><text x="276" y="123" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="21" fill="#213e49">VDD</text><path d="M220 200 H190 V350 H220" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><path d="M300 440 v12 m-20 0 h40 m-33 9 h26 m-19 9 h12" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><path d="M660 135 v15 M660 250 v50 M660 400 v40" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><path d="M660 150 v25 h-18 M642 172 v15 m0 6 v14 m0 6 v15 M642 228 h18 v22 M629 172 v56" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><circle cx="620" cy="200" r="8" fill="white" stroke="#246e76" stroke-width="3"/><path d="M580 200 h32" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><text x="674" y="207" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="20" fill="#213e49">XP2</text><path d="M660 300 v25 h-18 M642 322 v15 m0 6 v14 m0 6 v15 M642 378 h18 v22 M629 322 v56" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><path d="M580 350 h49" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><text x="674" y="357" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="20" fill="#213e49">XN2</text><text x="636" y="123" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="21" fill="#213e49">VDD</text><path d="M580 200 H550 V350 H580" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><path d="M660 440 v12 m-20 0 h40 m-33 9 h26 m-19 9 h12" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><path d="M1030 135 v15 M1030 250 v50 M1030 400 v40" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><path d="M1030 150 v25 h-18 M1012 172 v15 m0 6 v14 m0 6 v15 M1012 228 h18 v22 M999 172 v56" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><circle cx="990" cy="200" r="8" fill="white" stroke="#246e76" stroke-width="3"/><path d="M950 200 h32" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><text x="1044" y="207" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="20" fill="#213e49">XPOUT</text><path d="M1030 300 v25 h-18 M1012 322 v15 m0 6 v14 m0 6 v15 M1012 378 h18 v22 M999 322 v56" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><path d="M950 350 h49" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><text x="1044" y="357" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="20" fill="#213e49">XNOUT</text><text x="1006" y="123" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="21" fill="#213e49">VH</text><path d="M950 200 H920 V350 H950" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><text x="1012" y="470" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="21" fill="#213e49">VL</text><path d="M25 275 H65 M65 262 H130 V288 H65 Z M130 275 H190" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><text x="30" y="245" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="20" fill="#213e49">D0</text><text x="69" y="313" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="21" fill="#213e49">RIN</text><circle cx="190" cy="275" r="4" fill="#246e76"/><text x="152" y="330" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="20" fill="#213e49">DI</text><path d="M300 275 H550" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><circle cx="300" cy="275" r="4" fill="#246e76"/><circle cx="550" cy="275" r="4" fill="#246e76"/><text x="428" y="260" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="21" fill="#213e49">N1</text><path d="M660 275 H920" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><circle cx="660" cy="275" r="4" fill="#246e76"/><circle cx="920" cy="275" r="4" fill="#246e76"/><text x="780" y="260" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="21" fill="#213e49">CTRL</text><path d="M1030 275 H1220" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><circle cx="1030" cy="275" r="4" fill="#246e76"/><text x="1138" y="257" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="21" fill="#213e49">OUT</text><text x="1100" y="312" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="20" fill="#213e49">接 LED 阴极</text><text x="25" y="525" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="22" fill="#213e49">单项对照 1：8 方块输入电阻 → 1 方块；检查 DI 的边沿与瞬态应力。</text><text x="25" y="568" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="22" fill="#213e49">单项对照 2：仅改缓冲 MOS；观察 N1 / CTRL，输出 MOS 与供电轨保持原状。</text><text x="25" y="611" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="22" fill="#213e49">后续输出尺寸调整须重新校准 VH / VL，使直流电流仍为 25 / 100 µA。</text><text x="25" y="658" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="20" fill="#213e49">体端：所有 NMOS → VSS；XP1/XP2 → VDD；XPOUT → VH。尺寸以各候选网表为准。</text></svg>
