ly="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="22" fill="#213e49">GB 下降：从 OUT 抽走电荷，阴极电压降低，LED 导电电流上升。</text><text x="25" y="703" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="21" fill="#213e49">CFF 直流开路；瞬态峰值、平均电流和驱动能耗会改变，必须另行验证。</text><text x="25" y="750" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="19" fill="#213e49">四只 NMOS 体端均接 VSS。省略支路详见可复现网表；本图不是新版图或流片数据。</text></svg>
