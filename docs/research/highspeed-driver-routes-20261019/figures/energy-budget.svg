<text x="68" y="854" font-size="17" fill="#183b4e">边界：右图不含共享逻辑与接收端；两路都另设 0.20 mW / 通道的外围功耗占位。</text>
<text x="68" y="879" font-size="16" fill="#183b4e">实际电流转向可减小部分节点摆幅，但也增加互补控制等开销；须由具体电路求和，不能据此给技术路线排名。</text>
<text x="68" y="903" font-size="15" fill="#5c7080">简单电容模型要求从 0 到 ΔV 充分充放电、无能量回收；有直流偏置的 LED 结电容应积分实际供电波形。</text>
