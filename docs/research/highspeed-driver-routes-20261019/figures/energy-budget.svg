<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="950" viewBox="0 0 1360 950" role="img"><title>高速驱动能耗：开关电容与连续偏置的不同代价</title><desc>所有参数均为教学假设。左图为简单电容供电能量计算；右图为相同LED电流条件下的TX单通道预算，不能证明速率、光输出或BER。</desc>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif} .sub{fill:#5c7080} .small{font-size:15px}</style>
<rect width="1360" height="950" fill="#fafcfb"/>
<text x="48" y="43" font-size="15" fill="#5c7080">独立教学计算 · 不是器件实测 / SPICE / BER 结果</text>
<text x="48" y="85" font-size="29" fill="#183b4e" font-weight="600">先分清电容切换能量，再计算连续偏置功耗</text>
<text x="48" y="119" font-size="20" fill="#183b4e">随机独立 NRZ：p(1) = 0.5，p(0→1) = 0.25；Ecap = 0.25 Ceff ΔV²</text>
<line x1="48" y1="142" x2="1312" y2="142" stroke="#d5dfe4" stroke-width="1"/>
<text x="70" y="183" font-size="22" fill="#183b4e" font-weight="600">A  电压摆幅的平方关系</text>
<text x="70" y="211" font-size="16" fill="#5c7080">Ceff 为额外计入的等效开关电容；ΔV 为其驱动电源摆幅。</text>
