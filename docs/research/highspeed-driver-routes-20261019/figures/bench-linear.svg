<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img"><title>研究平台｜DC 偏置＋AC 线性调制与 Bias-T</title><desc>原创教学示意。候选架构，未经高速晶体管或版图仿真。器件端子和电流方向有明确标注。</desc><style>text{font-family:"PingFang SC","Noto Sans CJK SC",Arial,sans-serif}path,polyline{stroke-linecap:round;stroke-linejoin:round}</style><defs><marker id="a233d4b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#233d4b"/></marker><marker id="ac97925" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c97925"/></marker><marker id="a188578" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#188578"/></marker><marker id="a8164a8" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8164a8"/></marker><marker id="a3d729e" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3d729e"/></marker></defs><rect width="1600" height="1080" fill="#fff"/><text x="48" y="62" font-size="32" fill="#233d4b" font-weight="600" text-anchor="start">研究平台｜DC 偏置＋AC 线性调制与 Bias-T</text><text x="48" y="103" font-size="19" fill="#667c87" font-weight="400" text-anchor="start">用于 LED 电光响应、均衡与多载波波形研究；是台架架构，不是另一颗已实现的集成 ASIC</text><polyline points="48,128 1552,128" fill="none" stroke="#e0e8ec" stroke-width="1.5"/><rect x="48" y="354" width="228" height="152" rx="12" fill="#f4f7f9" stroke="#8164a8" stroke-width="1.5"/><text x="68" y="388" font-size="21" fill="#8164a8" font-weight="600" text-anchor="start">数据与 DSP</text><text x="68" y="421" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">PRBS／PAM／DMT</text><text x="68" y="450" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">波形与预加重</text><text x="68" y="479" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">记录采样率及码率</text><rect x="331" y="354" width="222" height="152" rx="12" fill="#f4f7f9" stroke="#8164a8" stroke-width="1.5"/><text x="351" y="388" font-size="21" fill="#8164a8" font-weight="600" text-anchor="start">AWG／高速 DAC</text><text x="351" y="421" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">数字样本 → 电压</text><text x="351" y="450" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">记录量化及摆幅</text><text x="351" y="479" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">电气带宽与失真</text><rect x="610" y="354" width="226" height="152" rx="12" fill="#f4f7f9" stroke="#3d729e" stroke-width="1.5"/><text x="630" y="388" font-size="21" fill="#3d729e" font-weight="600" text-anchor="start">RF 线性放大器</text><text x="630" y="421" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">偏置在放大工作区</text><text x="630" y="450" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">检查压缩与噪声</text><text x="630" y="479" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">计入直流供电功耗</text><path d="M276,430 L331,430" fill="none" stroke="#8164a8" stroke-width="3" marker-end="url(#a8164a8)"/><path d="M553,430 L610,430" fill="none" stroke="#8164a8" stroke-width="3" marker-end="url(#a8164a8)"/><polyline points="836,430 939,430" fill="none" stroke="#3d729e" stroke-width="2.7"/><polyline points="939,401 939,459" fill="none" stroke="#3d729e" stroke-width="4"/><polyline points="953,401 953,459" fill="none" stroke="#3d729e" stroke-width="4"/><polyline points="953,430 1120,430" fill="none" stroke="#3d729e" stroke-width="2.7"/><text x="897" y="382" font-size="22" fill="#3d729e" font-weight="600" text-anchor="start">C_AC</text><text x="875" y="491" font-size="18" fill="#3d729e" font-weight="400" text-anchor="start">隔直、耦合交流</text><rect x="998" y="159" width="317" height="110" rx="12" fill="#f4f7f9" stroke="#188578" stroke-width="1.5"/><text x="1018" y="193" font-size="21" fill="#188578" font-weight="600" text-anchor="start">DC 偏置／限流电源</text><text x="1018" y="226" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">设置 I₀；电流与电压均有上限</text><polyline points="1120,269 1120,282" fill="none" stroke="#188578" stroke-width="2.7"/><path d="M1120,282 c26,0 26,20 0,20 c26,0 26,20 0,20 c26,0 26,20 0,20 c26,0 26,20 0,20" fill="none" stroke="#188578" stroke-width="3"/><polyline points="1120,362 1120,508" fill="none" stroke="#188578" stroke-width="2.7"/><text x="1160" y="328" font-size="22" fill="#188578" font-weight="600" text-anchor="start">L_DC</text><text x="1160" y="360" font-size="18" fill="#188578" font-weight="400" text-anchor="start">通 DC、隔离 RF</text><circle cx="1120" cy="430" r="4.5" fill="#233d4b"/><text x="1142" y="455" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">偏置与 AC 在此叠加</text><path d="M1075,352 L1075,397" fill="none" stroke="#188578" stroke-width="3" marker-end="url(#a188578)"/><path d="M985,403 L1048,403" fill="none" stroke="#3d729e" stroke-width="3" marker-end="url(#a3d729e)"/><polyline points="1120,508 1120,530" fill="none" stroke="#c97925" stroke-width="2.7"/><path d="M1101,530 H1139 L1120,562 Z M1098,568 H1142" fill="none" stroke="#c97925" stroke-width="2.7"/><polyline points="1120,568 1120,592" fill="none" stroke="#c97925" stroke-width="2.7"/><path d="M1148,542 L1168,522" fill="none" stroke="#c97925" stroke-width="3" marker-end="url(#ac97925)"/><path d="M1154,557 L1174,537" fill="none" stroke="#c97925" stroke-width="3" marker-end="url(#ac97925)"/><text x="1085" y="528" font-size="16" fill="#667c87" font-weight="400" text-anchor="start">A</text><text x="1085" y="584" font-size="16" fill="#667c87" font-weight="400" text-anchor="start">K</text><text x="1170" y="619" font-size="21" fill="#c97925" font-weight="600" text-anchor="start">MicroLED</text><polyline points="1120,592 1120,698" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="1100,698 1140,698" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="1107,705 1133,705" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="1114,712 1126,712" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="1160" y="716" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">DC 与 RF 回流</text><rect x="1305" y="510" width="246" height="153" rx="12" fill="#f4f7f9" stroke="#c97925" stroke-width="1.5"/><text x="1325" y="544" font-size="21" fill="#c97925" font-weight="600" text-anchor="start">光接收／分析</text><text x="1325" y="577" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">PD／TIA／采样仪</text><text x="1325" y="606" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">眼图、E/O S21、BER</text><text x="1325" y="635" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">校准与去嵌</text><path d="M1188,551 L1290,551" fill="none" stroke="#c97925" stroke-width="3" marker-end="url(#ac97925)" stroke-dasharray="8 5"/><text x="1234" y="535" font-size="18" fill="#c97925" font-weight="400" text-anchor="start">光</text><rect x="48" y="575" width="788" height="155" rx="12" fill="#f4f7f9" stroke="#3d729e" stroke-width="1.5"/><text x="68" y="609" font-size="21" fill="#3d729e" font-weight="600" text-anchor="start">C 与 L 必须在实际频带内工作</text><text x="68" y="642" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">C_AC、L_DC 与源／负载阻抗共同决定频响、低频下垂与谐振。</text><text x="68" y="671" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">检查电感自谐振、电流额定值及 LED 非线性；不默认全链路 50 Ω。</text><text x="68" y="700" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">RF 增益不等于 LED 光学带宽，也不等于接收后的可用数据速率。</text><rect x="48" y="784" width="1504" height="156" rx="12" fill="#f4f7f9" stroke="#8164a8" stroke-width="1.5"/><text x="68" y="818" font-size="21" fill="#8164a8" font-weight="600" text-anchor="start">与三类 ASIC 路线比较时保持同一测量边界</text><text x="68" y="851" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">PAM／DMT／OFDM 属于调制与波形选择；不能仅凭平台名称确定电路能耗。平台总功耗应分别记录 AWG、RF 放大器、偏置及接收端。</text><text x="68" y="880" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">V_LED(t) 与 I_LED(t) 必须在允许范围内；负向交流摆幅不能任意使 LED 反偏。必要时增加限幅、保护和经过验证的放电支路。</text><text x="68" y="909" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">FFE／预加重能用于 A、B、C 或本平台；它改变瞬态峰值与平均能耗，需对相同数据、光接收条件及 BER 重新比较。</text><polyline points="48,966 1552,966" fill="none" stroke="#e0e8ec" stroke-width="1.5"/><text x="48" y="992" font-size="17" fill="#667c87" font-weight="400" text-anchor="start">本图的 L/C 为真实电路元件类别，其数值和模型尚未确定；简化图省略阻抗匹配、仪器电源与保护网络。</text><text x="48" y="1020" font-size="17" fill="#667c87" font-weight="400" text-anchor="start">台架能力、集成 ASIC 能力和完整链路能耗分别报告；不得把不同平台的最佳速率与最低能耗拼成一个产品指标。</text></svg>
