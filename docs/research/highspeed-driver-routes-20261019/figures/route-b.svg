<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img"><title>路线 B｜差分电流转向 OOK</title><desc>原创教学示意。候选架构，未经高速晶体管或版图仿真。器件端子和电流方向有明确标注。</desc><style>text{font-family:"PingFang SC","Noto Sans CJK SC",Arial,sans-serif}path,polyline{stroke-linecap:round;stroke-linejoin:round}</style><defs><marker id="a233d4b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#233d4b"/></marker><marker id="ac97925" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c97925"/></marker><marker id="a188578" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#188578"/></marker><marker id="a8164a8" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8164a8"/></marker><marker id="a3d729e" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3d729e"/></marker></defs><rect width="1600" height="1200" fill="#fff"/><text x="48" y="62" font-size="32" fill="#233d4b" font-weight="600" text-anchor="start">路线 B｜差分电流转向 OOK</text><text x="48" y="103" font-size="19" fill="#667c87" font-weight="400" text-anchor="start">单 LED · 尾电流连续建立 · 数据只改变电流去向；0 态的替代支路仍然耗电</text><polyline points="48,128 1552,128" fill="none" stroke="#e0e8ec" stroke-width="1.5"/><text x="180" y="186" font-size="21" fill="#188578" font-weight="600" text-anchor="middle">VREF</text><polyline points="180,200 180,224" fill="none" stroke="#188578" stroke-width="2.7"/><circle cx="180" cy="249" r="25" fill="white" stroke="#188578" stroke-width="2.6"/><path d="M180,235 L180,263" fill="none" stroke="#188578" stroke-width="3" marker-end="url(#a188578)"/><text x="220" y="254" font-size="18" fill="#188578" font-weight="400" text-anchor="start">等效 IREF</text><polyline points="180,274 180,648" fill="none" stroke="#188578" stroke-width="2.7"/><text x="42" y="332" font-size="17" fill="#667c87" font-weight="400" text-anchor="start">上游基准源</text><text x="42" y="359" font-size="17" fill="#667c87" font-weight="400" text-anchor="start">与环路省略</text><g data-device="MREF" data-terminal-order="D G S B" data-nets="BIAS BIAS VSS VSS" transform="translate(180 700)"><polyline points="-10,-23 -10,-13" fill="none" stroke="#188578" stroke-width="3"/><polyline points="-10,-5 -10,5" fill="none" stroke="#188578" stroke-width="3"/><polyline points="-10,13 -10,23" fill="none" stroke="#188578" stroke-width="3"/><polyline points="-28,-26 -28,26" fill="none" stroke="#8164a8" stroke-width="2.7"/><polyline points="0,-52 0,-21 -10,-21" fill="none" stroke="#188578" stroke-width="2.7"/><polyline points="-10,21 0,21 0,52" fill="none" stroke="#188578" stroke-width="2.7"/><polyline points="-62,0 -28,0" fill="none" stroke="#8164a8" stroke-width="2.7"/></g><text x="189" y="666" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">D</text><text x="189" y="749" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">S</text><text x="119" y="687" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">G</text><text x="216" y="696" font-size="21" fill="#188578" font-weight="600" text-anchor="start">MREF</text><polyline points="118,700 95,700 95,590 180,590" fill="none" stroke="#8164a8" stroke-width="2.7"/><circle cx="180" cy="590" r="4.5" fill="#188578"/><polyline points="180,590 490,590 490,700 813,700" fill="none" stroke="#8164a8" stroke-width="2.7"/><text x="292" y="572" font-size="19" fill="#188578" font-weight="400" text-anchor="start">BIAS：低噪声偏置</text><text x="700" y="186" font-size="21" fill="#c97925" font-weight="600" text-anchor="middle">VLED</text><polyline points="700,200 700,208" fill="none" stroke="#c97925" stroke-width="2.7"/><polyline points="700,208 700,230" fill="none" stroke="#c97925" stroke-width="2.7"/><path d="M681,230 H719 L700,262 Z M678,268 H722" fill="none" stroke="#c97925" stroke-width="2.7"/><polyline points="700,268 700,292" fill="none" stroke="#c97925" stroke-width="2.7"/><path d="M728,242 L748,222" fill="none" stroke="#c97925" stroke-width="3" marker-end="url(#ac97925)"/><path d="M734,257 L754,237" fill="none" stroke="#c97925" stroke-width="3" marker-end="url(#ac97925)"/><text x="665" y="228" font-size="16" fill="#667c87" font-weight="400" text-anchor="start">A</text><text x="665" y="284" font-size="16" fill="#667c87" font-weight="400" text-anchor="start">K</text><polyline points="700,292 700,398" fill="none" stroke="#c97925" stroke-width="2.7"/><text x="768" y="255" font-size="20" fill="#c97925" font-weight="600" text-anchor="start">片外 MicroLED</text><g data-device="ML" data-terminal-order="D G S B" data-nets="LED_K G+ VX VSS" transform="translate(700 450)"><polyline points="-10,-23 -10,-13" fill="none" stroke="#c97925" stroke-width="3"/><polyline points="-10,-5 -10,5" fill="none" stroke="#c97925" stroke-width="3"/><polyline points="-10,13 -10,23" fill="none" stroke="#c97925" stroke-width="3"/><polyline points="-28,-26 -28,26" fill="none" stroke="#8164a8" stroke-width="2.7"/><polyline points="0,-52 0,-21 -10,-21" fill="none" stroke="#c97925" stroke-width="2.7"/><polyline points="-10,21 0,21 0,52" fill="none" stroke="#c97925" stroke-width="2.7"/><polyline points="-62,0 -28,0" fill="none" stroke="#8164a8" stroke-width="2.7"/></g><text x="709" y="416" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">D</text><text x="709" y="499" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">S</text><text x="639" y="437" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">G</text><text x="736" y="446" font-size="21" fill="#c97925" font-weight="600" text-anchor="start">ML</text><polyline points="560,450 638,450" fill="none" stroke="#8164a8" stroke-width="2.7"/><text x="551" y="431" font-size="20" fill="#8164a8" font-weight="400" text-anchor="start">G+</text><text x="1050" y="186" font-size="21" fill="#3d729e" font-weight="600" text-anchor="middle">VDUMMY</text><polyline points="1050,200 1050,228" fill="none" stroke="#3d729e" stroke-width="2.7"/><polyline points="1050,228 1050,242" fill="none" stroke="#3d729e" stroke-width="2.7"/><rect x="1038" y="242" width="24" height="60" fill="white" stroke="#3d729e" stroke-width="2.7"/><polyline points="1050,302 1050,316" fill="none" stroke="#3d729e" stroke-width="2.7"/><text x="1074" y="279" font-size="18" fill="#3d729e" font-weight="400" text-anchor="start">R_DUMMY</text><polyline points="1050,316 1050,398" fill="none" stroke="#3d729e" stroke-width="2.7"/><g data-device="MD" data-terminal-order="D G S B" data-nets="DUMMY G− VX VSS" transform="translate(1050 450)"><polyline points="-10,-23 -10,-13" fill="none" stroke="#3d729e" stroke-width="3"/><polyline points="-10,-5 -10,5" fill="none" stroke="#3d729e" stroke-width="3"/><polyline points="-10,13 -10,23" fill="none" stroke="#3d729e" stroke-width="3"/><polyline points="-28,-26 -28,26" fill="none" stroke="#8164a8" stroke-width="2.7"/><polyline points="0,-52 0,-21 -10,-21" fill="none" stroke="#3d729e" stroke-width="2.7"/><polyline points="-10,21 0,21 0,52" fill="none" stroke="#3d729e" stroke-width="2.7"/><polyline points="-62,0 -28,0" fill="none" stroke="#8164a8" stroke-width="2.7"/></g><text x="1059" y="416" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">D</text><text x="1059" y="499" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">S</text><text x="989" y="437" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">G</text><text x="1086" y="446" font-size="21" fill="#3d729e" font-weight="600" text-anchor="start">MD</text><polyline points="930,450 988,450" fill="none" stroke="#8164a8" stroke-width="2.7"/><text x="920" y="431" font-size="20" fill="#8164a8" font-weight="400" text-anchor="start">G−</text><polyline points="700,502 700,565 1050,565 1050,502" fill="none" stroke="#233d4b" stroke-width="2.7"/><circle cx="875" cy="565" r="4.5" fill="#233d4b"/><polyline points="875,565 875,648" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="889" y="604" font-size="21" fill="#233d4b" font-weight="600" text-anchor="start">VX</text><g data-device="MI" data-terminal-order="D G S B" data-nets="VX BIAS VSS VSS" transform="translate(875 700)"><polyline points="-10,-23 -10,-13" fill="none" stroke="#188578" stroke-width="3"/><polyline points="-10,-5 -10,5" fill="none" stroke="#188578" stroke-width="3"/><polyline points="-10,13 -10,23" fill="none" stroke="#188578" stroke-width="3"/><polyline points="-28,-26 -28,26" fill="none" stroke="#8164a8" stroke-width="2.7"/><polyline points="0,-52 0,-21 -10,-21" fill="none" stroke="#188578" stroke-width="2.7"/><polyline points="-10,21 0,21 0,52" fill="none" stroke="#188578" stroke-width="2.7"/><polyline points="-62,0 -28,0" fill="none" stroke="#8164a8" stroke-width="2.7"/></g><text x="884" y="666" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">D</text><text x="884" y="749" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">S</text><text x="814" y="687" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">G</text><text x="911" y="696" font-size="21" fill="#188578" font-weight="600" text-anchor="start">MI</text><text x="912" y="734" font-size="18" fill="#188578" font-weight="400" text-anchor="start">尾电流管</text><polyline points="180,752 180,815 875,815 875,752" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="505,815 545,815" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="512,822 538,822" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="519,829 531,829" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="566" y="836" font-size="19" fill="#233d4b" font-weight="400" text-anchor="start">VSS（共同回流）</text><path d="M652,319 L652,384" fill="none" stroke="#c97925" stroke-width="3" marker-end="url(#ac97925)"/><path d="M1003,326 L1003,384" fill="none" stroke="#3d729e" stroke-width="3" marker-end="url(#a3d729e)"/><path d="M834,607 L834,638" fill="none" stroke="#188578" stroke-width="3" marker-end="url(#a188578)"/><rect x="350" y="185" width="262" height="152" rx="12" fill="#f4f7f9" stroke="#8164a8" stroke-width="1.5"/><text x="370" y="219" font-size="21" fill="#8164a8" font-weight="600" text-anchor="start">前置驱动器</text><text x="370" y="252" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">DATA → G+ 与 G−</text><text x="370" y="281" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">设置共模与差分摆幅</text><text x="370" y="310" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">验证两路延迟及负载</text><rect x="1220" y="170" width="330" height="265" rx="12" fill="#f4f7f9" stroke="#8164a8" stroke-width="1.5"/><text x="1240" y="204" font-size="21" fill="#8164a8" font-weight="600" text-anchor="start">转向方式</text><text x="1240" y="237" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">数据 1：ML 多导通，MD 少导通；</text><text x="1240" y="266" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">LED 支路承担主要尾电流。</text><text x="1240" y="295" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">数据 0：MD 多导通，ML 少导通；</text><text x="1240" y="324" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">替代负载承担主要尾电流。</text><text x="1240" y="353" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">切换期间允许两支路分流；</text><text x="1240" y="382" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">内部电容也会吸收／释放电流。</text><rect x="1220" y="465" width="330" height="292" rx="12" fill="#f4f7f9" stroke="#3d729e" stroke-width="1.5"/><text x="1240" y="499" font-size="21" fill="#3d729e" font-weight="600" text-anchor="start">功耗边界</text><text x="1240" y="532" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">理想稳态：</text><text x="1240" y="561" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">I_LED + I_DUMMY ≈ I_TAIL</text><text x="1240" y="590" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">尾电流连续，不代表各电源恒流。</text><text x="1240" y="619" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">P 包含 VLED、VDUMMY、偏置、</text><text x="1240" y="648" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">前置驱动及其电源损耗。</text><text x="1240" y="677" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">R_DUMMY 是可替换等效负载；</text><text x="1240" y="706" font-size="17" fill="#233d4b" font-weight="400" text-anchor="start">应匹配压降及动态，不能随意短路。</text><rect x="48" y="885" width="1502" height="178" rx="12" fill="#f4f7f9" stroke="#188578" stroke-width="1.5"/><text x="68" y="919" font-size="21" fill="#188578" font-weight="600" text-anchor="start">电压余量、保护与速度必须一起校核</text><text x="68" y="952" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">LED 支路：VLED ≥ VF + VDS(ML) + VDS(MI) + 互连压降 + 余量；dummy 支路也要满足自己的电压预算。</text><text x="68" y="981" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">MI 与 MREF 的 W/L 比只给出近似电流比例；输出阻抗、失配、温度及各管工作区会改变实际电流。</text><text x="68" y="1010" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">可选 Cascode 能降低尾电流对节点扰动的敏感度，但会增加余量、偏置与寄生；不能直接当成更高速的保证。</text><text x="68" y="1039" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">两开关栅极不是直接套用 PWM 的 0／3.3 V：需重新选择共模、摆幅、体端接法及可靠性限制。</text><polyline points="48,1086 1552,1086" fill="none" stroke="#e0e8ec" stroke-width="1.5"/><text x="48" y="1112" font-size="17" fill="#667c87" font-weight="400" text-anchor="start">所有 NMOS 的 B = VSS；D/G/S 已标。LED 与替代负载的电源负端接共同回流。IREF 圆符号仅代表待实现的上游基准。</text><text x="48" y="1140" font-size="17" fill="#667c87" font-weight="400" text-anchor="start">原理图未包含保护器件、ESD、封装 RLC 和实际前置驱动晶体管；本图不构成已验证的高速设计。</text></svg>
