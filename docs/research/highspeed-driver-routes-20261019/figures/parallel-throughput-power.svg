<text x="48" y="883" font-size="18" fill="#183b4e">共享功耗被更多比特分摊，Etotal,net = Plane / (η Rg) + Pshared / (N η Rg)；单通道本身并未变得更省电。</text>
<text x="48" y="914" font-size="16" fill="#5c7080">未计入接收端、稳压损耗、散热和光耦合要求。实际阵列还需验证热耦合、串扰、同时切换噪声与每通道 BER。</text>
