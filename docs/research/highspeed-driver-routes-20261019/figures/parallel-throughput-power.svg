<text x="70" y="182" font-size="22" fill="#183b4e" font-weight="600">A  净吞吐：Rnet,total = N × η × Rg</text>
<text x="743" y="182" font-size="22" fill="#183b4e" font-weight="600">B  总发射功耗：Ptotal = N × Plane + Pshared</text>
