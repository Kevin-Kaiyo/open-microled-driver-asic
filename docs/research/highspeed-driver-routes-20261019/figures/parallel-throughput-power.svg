<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="950" viewBox="0 0 1360 950" role="img"><title>并行通道：吞吐与功耗一起增长</title><desc>教学预算：每通道毛速率固定4Gb/s，净毛效率0.9，增加通道数不提高单个LED的速度。两幅图分别表示总净吞吐和总TX供电功耗。</desc>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif} .sub{fill:#5c7080} .small{font-size:15px}</style>
<rect width="1360" height="950" fill="#fafcfb"/>
<text x="48" y="43" font-size="15" fill="#5c7080">独立教学计算 · 每通道速率是输入条件，不是已验证性能</text>
<text x="48" y="85" font-size="29" fill="#183b4e" font-weight="600">并行能提高总吞吐，共享电路影响每比特能耗</text>
<text x="48" y="119" font-size="20" fill="#183b4e">Rg = 4 Gb/s / 通道；η = Rnet / Rgross = 0.90；Pshared = 1.00 mW（假设）</text>
