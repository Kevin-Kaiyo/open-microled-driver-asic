<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img"><title>路线 A｜受限摆幅推挽的概念芯片分区</title><desc>原创教学示意。候选架构，未经高速晶体管或版图仿真。器件端子和电流方向有明确标注。</desc><style>text{font-family:"PingFang SC","Noto Sans CJK SC",Arial,sans-serif}path,polyline{stroke-linecap:round;stroke-linejoin:round}</style><defs><marker id="a233d4b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#233d4b"/></marker><marker id="ac97925" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c97925"/></marker><marker id="a188578" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#188578"/></marker><marker id="a8164a8" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8164a8"/></marker><marker id="a3d729e" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3d729e"/></marker></defs><rect width="1600" height="1080" fill="#fff"/><text x="48" y="62" font-size="32" fill="#233d4b" font-weight="600" text-anchor="start">路线 A｜受限摆幅推挽的概念芯片分区</text><text x="48" y="103" font-size="19" fill="#667c87" font-weight="400" text-anchor="start">用于讨论功能相邻关系与高频电流回路；不是 GDS、布线结果或可制造版图，面积与比例均未确定</text><polyline points="48,128 1552,128" fill="none" stroke="#e0e8ec" stroke-width="1.5"/><rect x="48" y="170" width="1290" height="734" rx="18" fill="#fbfcfd" stroke="#233d4b" stroke-width="2.5"/><text x="72" y="204" font-size="23" fill="#233d4b" font-weight="600" text-anchor="start">候选发送端 ASIC</text><rect x="80" y="230" width="1200" height="64" rx="12" fill="#f4f7f9" stroke="#3d729e" stroke-width="1.5"/><text x="100" y="264" font-size="21" fill="#3d729e" font-weight="600" text-anchor="start">电源入口与局部去耦：数字电源、输出电源、偏置电源分别预算</text><rect x="82" y="351" width="245" height="175" rx="12" fill="#f4f7f9" stroke="#8164a8" stroke-width="1.5"/><text x="102" y="385" font-size="21" fill="#8164a8" font-weight="600" text-anchor="start">数字输入／测试</text><text x="102" y="418" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">外部数据与时钟接口</text><text x="102" y="447" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">PRBS／测试模式</text><text x="102" y="476" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">必要时加 Serializer</text><rect x="375" y="351" width="236" height="175" rx="12" fill="#f4f7f9" stroke="#8164a8" stroke-width="1.5"/><text x="395" y="385" font-size="21" fill="#8164a8" font-weight="600" text-anchor="start">重定时与控制</text><text x="395" y="418" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">时钟与数据对齐</text><text x="395" y="447" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">电平／幅度配置</text><text x="395" y="476" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">保护状态与校准</text><rect x="659" y="351" width="235" height="175" rx="12" fill="#f4f7f9" stroke="#8164a8" stroke-width="1.5"/><text x="679" y="385" font-size="21" fill="#8164a8" font-weight="600" text-anchor="start">前置驱动</text><text x="679" y="418" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">共模与摆幅设定</text><text x="679" y="447" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">匹配延迟与负载</text><text x="679" y="476" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">局部快速栅极回流</text><rect x="940" y="330" width="337" height="235" rx="12" fill="#f4f7f9" stroke="#c97925" stroke-width="1.5"/><text x="960" y="364" font-size="21" fill="#c97925" font-weight="600" text-anchor="start">输出区：推挽单元</text><text x="960" y="397" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">PMOS 上拉 ＋ NMOS 下拉</text><text x="960" y="426" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">可分段调整驱动强度</text><text x="960" y="455" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">摆幅电源轨与限流元件</text><text x="960" y="484" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">输出监测／幅度校准</text><path d="M327,435 L375,435" fill="none" stroke="#8164a8" stroke-width="3" marker-end="url(#a8164a8)"/><path d="M611,435 L659,435" fill="none" stroke="#8164a8" stroke-width="3" marker-end="url(#a8164a8)"/><path d="M894,435 L940,435" fill="none" stroke="#8164a8" stroke-width="3" marker-end="url(#a8164a8)"/><rect x="82" y="618" width="529" height="170" rx="12" fill="#f4f7f9" stroke="#188578" stroke-width="1.5"/><text x="102" y="652" font-size="21" fill="#188578" font-weight="600" text-anchor="start">慢速模拟区：参考、偏置、监测</text><text x="102" y="685" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">参考源／偏置缓冲与温度或电流检测</text><text x="102" y="714" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">保护关断与上电时序；偏置稳定性单独验证</text><text x="102" y="743" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">与高摆幅数据和大电流共享阻抗保持可控</text><rect x="659" y="618" width="618" height="170" rx="12" fill="#f4f7f9" stroke="#3d729e" stroke-width="1.5"/><text x="679" y="652" font-size="21" fill="#3d729e" font-weight="600" text-anchor="start">该路线需要优先提取并检查</text><text x="679" y="685" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">上下管交越、输出节点 C</text><text x="679" y="714" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">多电源端压、局部供电扰动</text><text x="679" y="743" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">所有路线：pad／ESD／封装／LED 接点及共同回流</text><polyline points="611,700 635,700 635,582 1120,582 1120,565" fill="none" stroke="#188578" stroke-width="2.8" stroke-dasharray="8 5"/><text x="681" y="602" font-size="17" fill="#188578" font-weight="400" text-anchor="start">低噪声偏置／慢速设置</text><rect x="82" y="825" width="1195" height="54" rx="12" fill="#f4f7f9" stroke="#3d729e" stroke-width="1.5"/><text x="102" y="859" font-size="21" fill="#3d729e" font-weight="600" text-anchor="start">供电回流与测试可达：实际金属宽度、过孔、屏蔽、去耦必须由 PEX／PI／EM 决定</text><rect x="1306" y="406" width="32" height="59" rx="3" fill="#f8ead9" stroke="#c97925" stroke-width="2"/><text x="1261" y="390" font-size="16" fill="#c97925" font-weight="400" text-anchor="start">输出焊盘／凸点</text><polyline points="1277,435 1306,435" fill="none" stroke="#c97925" stroke-width="4"/><path d="M1404,435 L1338,435" fill="none" stroke="#c97925" stroke-width="3" marker-end="url(#ac97925)"/><rect x="1409" y="365" width="143" height="140" rx="12" fill="#f4f7f9" stroke="#c97925" stroke-width="1.5"/><text x="1429" y="399" font-size="21" fill="#c97925" font-weight="600" text-anchor="start">MicroLED</text><text x="1429" y="432" font-size="16" fill="#233d4b" font-weight="400" text-anchor="start">独立裸片</text><text x="1429" y="461" font-size="16" fill="#233d4b" font-weight="400" text-anchor="start">或外接器件</text><polyline points="1280,262 1478,262 1478,365" fill="none" stroke="#3d729e" stroke-width="3"/><path d="M1478,300 L1478,347" fill="none" stroke="#3d729e" stroke-width="3" marker-end="url(#a3d729e)"/><text x="1381" y="242" font-size="18" fill="#3d729e" font-weight="400" text-anchor="start">VLED 供电</text><text x="1500" y="344" font-size="16" fill="#667c87" font-weight="400" text-anchor="start">A</text><text x="1384" y="421" font-size="16" fill="#667c87" font-weight="400" text-anchor="start">K</text><polyline points="1338,850 1478,850" fill="none" stroke="#3d729e" stroke-width="3"/><path d="M1355,850 L1422,850" fill="none" stroke="#3d729e" stroke-width="3" marker-end="url(#a3d729e)"/><polyline points="1458,850 1498,850" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="1465,857 1491,857" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="1472,864 1484,864" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="1365" y="568" font-size="18" fill="#3d729e" font-weight="400" text-anchor="start">亮态电流：</text><text x="1365" y="598" font-size="18" fill="#3d729e" font-weight="400" text-anchor="start">LED → 输出管</text><text x="1365" y="628" font-size="18" fill="#3d729e" font-weight="400" text-anchor="start">→ 芯片回流</text><text x="1365" y="658" font-size="18" fill="#3d729e" font-weight="400" text-anchor="start">→ 供电负端</text><text x="1365" y="688" font-size="18" fill="#3d729e" font-weight="400" text-anchor="start">关键回路需</text><text x="1365" y="718" font-size="18" fill="#3d729e" font-weight="400" text-anchor="start">整体建模</text><polyline points="48,966 1552,966" fill="none" stroke="#e0e8ec" stroke-width="1.5"/><text x="48" y="992" font-size="17" fill="#667c87" font-weight="400" text-anchor="start">紫色箭头为数据信号；芯片外橙／蓝箭头为亮态传统电流及回流。方框大小不代表面积，电源线不代表已完成电源网络。</text><text x="48" y="1020" font-size="17" fill="#667c87" font-weight="400" text-anchor="start">仍需选 PDK／器件／封装并完成晶体管设计、时序、电气与光学模型、DRC／LVS／PEX、可靠性与实物验证。</text></svg>
