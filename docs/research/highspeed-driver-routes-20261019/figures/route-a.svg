<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img"><title>路线 A｜受限摆幅 CMOS 电压驱动</title><desc>原创教学示意。候选架构，未经高速晶体管或版图仿真。器件端子和电流方向有明确标注。</desc><style>text{font-family:"PingFang SC","Noto Sans CJK SC",Arial,sans-serif}path,polyline{stroke-linecap:round;stroke-linejoin:round}</style><defs><marker id="a233d4b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#233d4b"/></marker><marker id="ac97925" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c97925"/></marker><marker id="a188578" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#188578"/></marker><marker id="a8164a8" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8164a8"/></marker><marker id="a3d729e" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3d729e"/></marker></defs><rect width="1600" height="1120" fill="#fff"/><text x="48" y="62" font-size="32" fill="#233d4b" font-weight="600" text-anchor="start">路线 A｜受限摆幅 CMOS 电压驱动</text><text x="48" y="103" font-size="19" fill="#667c87" font-weight="400" text-anchor="start">单 LED · OOK 两电平 · 独立候选原理图；电流与电压范围尚待器件模型校准</text><polyline points="48,128 1552,128" fill="none" stroke="#e0e8ec" stroke-width="1.5"/><rect x="48" y="170" width="262" height="142" rx="12" fill="#f4f7f9" stroke="#8164a8" stroke-width="1.5"/><text x="68" y="204" font-size="21" fill="#8164a8" font-weight="600" text-anchor="start">数据与前置驱动</text><text x="68" y="237" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">DATA = 1：下拉导通</text><text x="68" y="266" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">DATA = 0：上拉导通</text><text x="68" y="295" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">含电平转换及交越控制</text><rect x="48" y="360" width="262" height="140" rx="12" fill="#f4f7f9" stroke="#3d729e" stroke-width="1.5"/><text x="68" y="394" font-size="21" fill="#3d729e" font-weight="600" text-anchor="start">输出摆幅设定</text><text x="68" y="427" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">V_L ≤ V_OUT ≤ V_H</text><text x="68" y="456" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">V_H、V_L 为可设电源轨</text><text x="68" y="485" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">不是任意施加反向电压</text><text x="595" y="188" font-size="22" fill="#3d729e" font-weight="600" text-anchor="middle">V_H</text><polyline points="595,200 595,278" fill="none" stroke="#3d729e" stroke-width="2.7"/><g data-device="MP" data-terminal-order="D G S B" data-nets="OUT CTRL V_H V_H" transform="translate(595 330)"><polyline points="-10,-23 -10,-13" fill="none" stroke="#3d729e" stroke-width="3"/><polyline points="-10,-5 -10,5" fill="none" stroke="#3d729e" stroke-width="3"/><polyline points="-10,13 -10,23" fill="none" stroke="#3d729e" stroke-width="3"/><polyline points="-28,-26 -28,26" fill="none" stroke="#8164a8" stroke-width="2.7"/><polyline points="0,-52 0,-21 -10,-21" fill="none" stroke="#3d729e" stroke-width="2.7"/><polyline points="-10,21 0,21 0,52" fill="none" stroke="#3d729e" stroke-width="2.7"/><polyline points="-62,0 -43,0" fill="none" stroke="#8164a8" stroke-width="2.7"/><circle cx="-38" cy="0" r="5" fill="white" stroke="#8164a8" stroke-width="2.6"/><polyline points="-33,0 -28,0" fill="none" stroke="#8164a8" stroke-width="2.7"/></g><text x="604" y="296" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">S</text><text x="604" y="379" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">D</text><text x="534" y="317" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">G</text><text x="631" y="326" font-size="21" fill="#3d729e" font-weight="600" text-anchor="start">MP</text><polyline points="595,382 595,538" fill="none" stroke="#3d729e" stroke-width="2.7"/><g data-device="MN" data-terminal-order="D G S B" data-nets="OUT CTRL V_L V_L" transform="translate(595 590)"><polyline points="-10,-23 -10,-13" fill="none" stroke="#c97925" stroke-width="3"/><polyline points="-10,-5 -10,5" fill="none" stroke="#c97925" stroke-width="3"/><polyline points="-10,13 -10,23" fill="none" stroke="#c97925" stroke-width="3"/><polyline points="-28,-26 -28,26" fill="none" stroke="#8164a8" stroke-width="2.7"/><polyline points="0,-52 0,-21 -10,-21" fill="none" stroke="#c97925" stroke-width="2.7"/><polyline points="-10,21 0,21 0,52" fill="none" stroke="#c97925" stroke-width="2.7"/><polyline points="-62,0 -28,0" fill="none" stroke="#8164a8" stroke-width="2.7"/></g><text x="604" y="556" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">D</text><text x="604" y="639" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">S</text><text x="534" y="577" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">G</text><text x="631" y="586" font-size="21" fill="#c97925" font-weight="600" text-anchor="start">MN</text><polyline points="595,642 595,720" fill="none" stroke="#c97925" stroke-width="2.7"/><text x="595" y="754" font-size="22" fill="#3d729e" font-weight="600" text-anchor="middle">V_L</text><polyline points="310,248 385,248 385,330 533,330" fill="none" stroke="#8164a8" stroke-width="2.7"/><polyline points="385,330 385,590 533,590" fill="none" stroke="#8164a8" stroke-width="2.7"/><circle cx="385" cy="330" r="4.5" fill="#8164a8"/><text x="395" y="564" font-size="18" fill="#8164a8" font-weight="400" text-anchor="start">CTRL：V_L ↔ V_H</text><text x="810" y="188" font-size="22" fill="#c97925" font-weight="600" text-anchor="middle">VLED</text><polyline points="810,200 810,203" fill="none" stroke="#c97925" stroke-width="2.7"/><polyline points="810,203 810,225" fill="none" stroke="#c97925" stroke-width="2.7"/><path d="M791,225 H829 L810,257 Z M788,263 H832" fill="none" stroke="#c97925" stroke-width="2.7"/><polyline points="810,263 810,287" fill="none" stroke="#c97925" stroke-width="2.7"/><path d="M838,237 L858,217" fill="none" stroke="#c97925" stroke-width="3" marker-end="url(#ac97925)"/><path d="M844,252 L864,232" fill="none" stroke="#c97925" stroke-width="3" marker-end="url(#ac97925)"/><text x="775" y="223" font-size="16" fill="#667c87" font-weight="400" text-anchor="start">A</text><text x="775" y="279" font-size="16" fill="#667c87" font-weight="400" text-anchor="start">K</text><text x="882" y="241" font-size="20" fill="#c97925" font-weight="600" text-anchor="start">片外 MicroLED</text><polyline points="810,287 810,311" fill="none" stroke="#c97925" stroke-width="2.7"/><polyline points="810,311 810,325" fill="none" stroke="#c97925" stroke-width="2.7"/><rect x="798" y="325" width="24" height="60" fill="white" stroke="#c97925" stroke-width="2.7"/><polyline points="810,385 810,399" fill="none" stroke="#c97925" stroke-width="2.7"/><text x="834" y="362" font-size="18" fill="#c97925" font-weight="400" text-anchor="start">R_LIM</text><polyline points="810,399 810,460 595,460" fill="none" stroke="#c97925" stroke-width="2.7"/><circle cx="595" cy="460" r="4.5" fill="#c97925"/><text x="639" y="441" font-size="21" fill="#c97925" font-weight="600" text-anchor="start">OUT</text><text x="835" y="423" font-size="18" fill="#667c87" font-weight="400" text-anchor="start">限流／阻尼</text><path d="M755,306 L755,386" fill="none" stroke="#c97925" stroke-width="3" marker-end="url(#ac97925)"/><path d="M680,514 L680,628" fill="none" stroke="#c97925" stroke-width="3" marker-end="url(#ac97925)"/><text x="695" y="581" font-size="18" fill="#c97925" font-weight="400" text-anchor="start">数据 1</text><path d="M565,398 L565,441" fill="none" stroke="#3d729e" stroke-width="3" marker-end="url(#a3d729e)"/><text x="395" y="424" font-size="16" fill="#3d729e" font-weight="400" text-anchor="start">数据 0：OUT 上升</text><rect x="1060" y="170" width="490" height="232" rx="12" fill="#f4f7f9" stroke="#c97925" stroke-width="1.5"/><text x="1080" y="204" font-size="21" fill="#c97925" font-weight="600" text-anchor="start">两种稳态的闭合回路</text><text x="1080" y="237" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">1：VLED → LED → R_LIM → MN → V_L</text><text x="1080" y="266" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">0：MP 将 OUT 拉近 V_H，LED 电流降至 I₀。</text><text x="1080" y="295" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">V_L 回流与各电源负端共同闭合电流回路。</text><text x="1080" y="324" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">若 V_H = VLED，理想暗态可接近零电流。</text><text x="1080" y="353" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">I₀ 非零时，上轨须能吸收回灌或另设偏置。</text><text x="1080" y="382" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">MP 的充电电流主要出现在切换边沿。</text><rect x="1060" y="418" width="490" height="193" rx="12" fill="#f4f7f9" stroke="#188578" stroke-width="1.5"/><text x="1080" y="452" font-size="21" fill="#188578" font-weight="600" text-anchor="start">电流不是天然恒定</text><text x="1080" y="485" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">VLED − V_OUT = VF(I,T) + I·R_LIM</text><text x="1080" y="514" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">I₀、I₁ 随 LED、温度、电源及导通压降变化。</text><text x="1080" y="543" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">要精确控流：增加检测、慢速反馈或数字校准；</text><text x="1080" y="572" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">高速数据通路与慢速幅度设定分开验证。</text><rect x="1060" y="640" width="490" height="160" rx="12" fill="#f4f7f9" stroke="#3d729e" stroke-width="1.5"/><text x="1080" y="674" font-size="21" fill="#3d729e" font-weight="600" text-anchor="start">速度与能耗的取舍</text><text x="1080" y="707" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">较小电压摆幅可减少输出节点充放电能量。</text><text x="1080" y="736" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">电源轨、R_LIM、驱动强度共同决定边沿。</text><text x="1080" y="765" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">必须计入 LED、前置驱动和电源转换损耗。</text><rect x="48" y="830" width="1502" height="142" rx="12" fill="#f4f7f9" stroke="#8164a8" stroke-width="1.5"/><text x="68" y="864" font-size="21" fill="#8164a8" font-weight="600" text-anchor="start">设计条件：先检查电压，再讨论速率</text><text x="68" y="897" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">NMOS：B = V_L；PMOS：B = V_H。若 V_L 不等于公共衬底电位，需要工艺支持的隔离阱／隔离器件及相应规则。</text><text x="68" y="926" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">检查每只 MOS 的 VGS、VGD、VDS、体结偏压，以及启动／掉电／LED 开路／封装振铃；上下管交越会产生直通电流。</text><text x="68" y="955" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">可叠加分段驱动、FFE／边沿预加重；限制峰值电流与 LED 反向电压，并重新核算完整数据序列的能量。</text><polyline points="48,1006 1552,1006" fill="none" stroke="#e0e8ec" stroke-width="1.5"/><text x="48" y="1032" font-size="17" fill="#667c87" font-weight="400" text-anchor="start">MOS 采用增强型三端符号；D/G/S 已标，体端 B 按上面的公共连接说明处理。实心点相连；同名网络相连。</text><text x="48" y="1060" font-size="17" fill="#667c87" font-weight="400" text-anchor="start">本图为独立教学电路，不对应特定论文的晶体管复刻；未选工艺、尺寸、电流或目标速率。</text></svg>
