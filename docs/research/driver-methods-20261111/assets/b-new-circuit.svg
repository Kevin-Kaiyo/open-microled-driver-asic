<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="805" viewBox="0 0 1260 805"><rect width="1260" height="805" fill="white"/><text x="25" y="40" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="28" fill="#213e49">B：降低VIN，重新分配虚支路的电压余量</text><text x="25" y="80" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="21" fill="#213e49">VLED与VDD保持不变；参考电流与LED两态目标保持25 / 100 µA。</text><text x="320" y="119" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="21" fill="#213e49">VLED = 5 V</text><path d="M400 130 V155 M380 155 H420 L400 190 Z M378 197 H422 M400 197 V220" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><text x="450" y="176" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="20" fill="#213e49">MicroLED</text><path d="M426 162 l20 -20 m-8 1 h8 v8 M431 178 l20 -20 m-8 1 h8 v8" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><path d="M400 220 V232 M390 232 H410 V252 H390 Z M400 252 V260 C418 260 418 270 400 270 C418 270 418 280 400 280 V300" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><text x="445" y="264" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="18" fill="#213e49">Rpkg / Lpkg</text><text x="319" y="287" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="20" fill="#213e49">OUT</text><path d="M400 300 H180" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><circle cx="400" cy="300" r="4" fill="#246e76"/><path d="M180 300 v25 h-18 M162 322 v15 m0 6 v14 m0 6 v15 M162 378 h18 v22 M149 322 v56" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><path d="M100 350 h49" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><text x="194" y="357" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="20" fill="#213e49">XBASE</text><path d="M400 300 v25 h-18 M382 322 v15 m0 6 v14 m0 6 v15 M382 378 h18 v22 M369 322 v56" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><path d="M320 350 h49" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><text x="414" y="357" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="20" fill="#213e49">XLED</text><path d="M180 400 V440" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><path d="M180 440 v12 m-20 0 h40 m-33 9 h26 m-19 9 h12" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><text x="785" y="119" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="22" fill="#bc6836">VIN = 3.3 V</text><path d="M850 130 V170 M838 170 H862 V230 H838 Z M850 230 V300" fill="none" stroke="#bc6836" stroke-width="3" stroke-linejoin="round"/><text x="890" y="194" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="20" fill="#bc6836">RDUMMY</text><text x="890" y="224" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="20" fill="#bc6836">27.6 kΩ</text><text x="880" y="278" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="19" fill="#213e49">DUMMY</text><path d="M850 300 v25 h-18 M832 322 v15 m0 6 v14 m0 6 v15 M832 378 h18 v22 M819 322 v56" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><path d="M770 350 h49" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><text x="864" y="357" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="20" fill="#213e49">XDUMMY</text><path d="M400 400 V450 H850 V400 M620 450 V480" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><circle cx="620" cy="450" r="4" fill="#246e76"/><text x="650" y="438" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="20" fill="#213e49">VX</text><path d="M620 480 v25 h-18 M602 502 v15 m0 6 v14 m0 6 v15 M602 558 h18 v22 M589 502 v56" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><path d="M540 530 h49" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><text x="634" y="537" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="20" fill="#213e49">XTAIL</text><path d="M620 580 v12 m-20 0 h40 m-33 9 h26 m-19 9 h12" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><text x="30" y="339" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="20" fill="#213e49">BIAS</text><path d="M30 350 H100" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><text x="270" y="339" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="20" fill="#213e49">GP</text><path d="M270 350 H320" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><text x="715" y="339" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="20" fill="#213e49">GB</text><path d="M715 350 H770" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><text x="470" y="519" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="20" fill="#213e49">BIAS</text><path d="M470 530 H540" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><path d="M400 300 H620 V270 H650 M650 250 V290 M672 250 V290 M672 270 H735 V350" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><circle cx="735" cy="350" r="4" fill="#246e76"/><text x="590" y="240" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="19" fill="#213e49">CFF 31.275 fF</text><text x="25" y="645" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="22" fill="#213e49">VIN同时供给晶体管参考源和虚支路；外部VREF=2.5 V仍保留。</text><text x="25" y="687" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="21" fill="#213e49">低电流态：基准支路约25 µA持续流过LED；约75 µA调制电流流过RDUMMY。</text><text x="25" y="729" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="21" fill="#213e49">高电流态：调制电流转向LED，总电流约100 µA。NMOS体端均接VSS。</text><text x="25" y="771" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="20" fill="#213e49">200 fF跨LED的A/K、位于封装R/L前；参考源与缓冲器未展开，均已纳入仿真。</text></svg>
