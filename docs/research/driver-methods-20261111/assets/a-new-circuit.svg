d"/><text x="974" y="427" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="20" fill="#213e49">XNOUT</text><path d="M880 270 H850 V420 H880" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><text x="943" y="527" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="21" fill="#213e49">VL</text><path d="M24 345 H55 M55 333 H115 V357 H55 Z M115 345 H160" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><text x="24" y="315" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="19" fill="#213e49">D0</text><text x="55" y="393" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="19" fill="#213e49">RIN</text><circle cx="160" cy="345" r="4" fill="#246e76"/><text x="120" y="445" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="19" fill="#213e49">DI</text><path d="M270 345 H500" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><circle cx="270" cy="345" r="4" fill="#246e76"/><circle cx="500" cy="345" r="4" fill="#246e76"/><text x="370" y="327" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="20" fill="#213e49">N1</text><path d="M610 345 H850" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><circle cx="610" cy="345" r="4" fill="#246e76"/><circle cx="850" cy="345" r="4" fill="#246e76"/><text x="735" y="327" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="20" fill="#213e49">CTRL</text><path d="M960 345 H1180 V260" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><circle cx="960" cy="345" r="4" fill="#246e76"/><circle cx="1100" cy="345" r="4" fill="#246e76"/><text x="1080" y="376" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="20" fill="#213e49">OUT</text><path d="M1180 110 V140 M1160 140 H1200 L1180 175 Z M1158 182 H1202 M1180 182 V200 M1170 200 H1190 V220 H1170 Z M1180 220 V230 C1198 230 1198 240 1180 240 C1198 240 1198 250 1180 250 V260" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><text x="1084" y="101" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="19" fill="#213e49">VLED = 5 V</text><text x="995" y="175" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="18" fill="#213e49">MicroLED</text><text x="985" y="225" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="17" fill="#213e49">Rpkg / Lpkg</text><path d="M1205 145 l20 -20 m-8 1 h8 v8 M1210 162 l20 -20 m-8 1 h8 v8" fill="none" stroke="#246e76" stroke-width="3" stroke-linejoin="round"/><path d="M420 345 V130 H540 M540 118 H620 V142 H540 Z M620 130 H750 M750 109 V151 M772 109 V151 M772 130 H1100 V345" fill="none" stroke="#bc6836" stroke-width="3" stroke-linejoin="round"/><circle cx="420" cy="345" r="4" fill="#246e76"/><text x="516" y="105" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="19" fill="#bc6836">RFF ≈ 1 kΩ</text><text x="710" y="177" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="19" fill="#bc6836">CFF 31.275 fF</text><text x="24" y="600" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="22" fill="#213e49">D0=1：N1先下降 → CFF拉低OUT → LED电流增加；CTRL随后接通VL。</text><text x="24" y="642" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="22" fill="#213e49">D0=0：N1先上升 → CFF抬高OUT → LED电流减小；CTRL随后接通VH。</text><text x="24" y="686" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="20" fill="#213e49">200 fF跨LED的A/K，位于串联封装R/L之前（未画）；Rpkg=1 Ω，Lpkg=0.5 nH。</text><text x="24" y="727" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="20" fill="#213e49">体端：NMOS→VSS，XP1/XP2→VDD，XPOUT→VH；交叉无圆点表示不连接。</text><text x="24" y="769" font-family="PingFang SC,Hiragino Sans GB,Arial,sans-serif" font-size="20" fill="#213e49">RFF为4 µm×4 µm的PDK电阻；CFF为理想集总值。本图是原理连接，不是PEX。</text></svg>
