<svg xmlns="http://www.w3.org/2000/svg" width="900" height="235" viewBox="0 0 900 235" role="img"><style>text{font-family:"PingFang SC","Avenir Next",sans-serif;fill:#263c43} .head{font-size:22px;font-weight:600}.body{font-size:18px}.note{font-size:17px}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#386f7b"/></marker></defs><rect width="900" height="235" fill="white"/><text x="18" y="31" class="head">多级通信：每个数字样本对应一个电流幅度</text><rect x="18" y="69" width="153" height="83" rx="3" fill="#f3f7f6" stroke="#95b1b7"/><text x="94.5" y="96" text-anchor="middle" class="body">PAM／OFDM</text><text x="94.5" y="121" text-anchor="middle" class="body">数字幅度样本</text><path d="M171 110H187" fill="none" stroke="#386f7b" stroke-width="2" marker-end="url(#arrow)"/><rect x="193" y="69" width="153" height="83" rx="3" fill="#f3f7f6" stroke="#95b1b7"/><text x="269.5" y="96" text-anchor="middle" class="body">编码＋锁存</text><text x="269.5" y="121" text-anchor="middle" class="body">binary／分段</text><path d="M346 110H362" fill="none" stroke="#386f7b" stroke-width="2" marker-end="url(#arrow)"/><rect x="368" y="69" width="153" height="83" rx="3" fill="#f3f7f6" stroke="#95b1b7"/><text x="444.5" y="96" text-anchor="middle" class="body">单元pre-driver</text><text x="444.5" y="121" text-anchor="middle" class="body">同步／时差</text><path d="M521 110H537" fill="none" stroke="#386f7b" stroke-width="2" marker-end="url(#arrow)"/><rect x="543" y="69" width="153" height="83" rx="3" fill="#f3f7f6" stroke="#95b1b7"/><text x="619.5" y="96" text-anchor="middle" class="body">电流DAC</text><text x="619.5" y="121" text-anchor="middle" class="body">单位电流相加</text><path d="M696 110H712" fill="none" stroke="#386f7b" stroke-width="2" marker-end="url(#arrow)"/><rect x="718" y="69" width="153" height="83" rx="3" fill="#f3f7f6" stroke="#95b1b7"/><text x="794.5" y="96" text-anchor="middle" class="body">MicroLED</text><text x="794.5" y="121" text-anchor="middle" class="body">偏置＋调制</text><text x="18" y="185" class="note">I[n] ≈ IBIAS + Σ bj[n] · Ij；需先定义有效电流范围和调制线性区。</text><text x="18" y="211" class="note">独立功能方案；DAC采样率、光学带宽与链路比特率分别报告。</text></svg>
