<svg xmlns="http://www.w3.org/2000/svg" width="900" height="235" viewBox="0 0 900 235" role="img"><style>text{font-family:"PingFang SC","Avenir Next",sans-serif;fill:#263c43} .head{font-size:22px;font-weight:600}.body{font-size:18px}.note{font-size:17px}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#386f7b"/></marker></defs><rect width="900" height="235" fill="white"/><text x="18" y="31" class="head">高速 OOK：比特决定两档电流／光输出</text><rect x="18" y="69" width="153" height="83" rx="3" fill="#f3f7f6" stroke="#95b1b7"/><text x="94.5" y="96" text-anchor="middle" class="body">PRBS／数据</text><text x="94.5" y="121" text-anchor="middle" class="body">比特流</text><path d="M171 110H187" fill="none" stroke="#386f7b" stroke-width="2" marker-end="url(#arrow)"/><rect x="193" y="69" width="153" height="83" rx="3" fill="#f3f7f6" stroke="#95b1b7"/><text x="269.5" y="96" text-anchor="middle" class="body">输入接收</text><text x="269.5" y="121" text-anchor="middle" class="body">时钟＋锁存</text><path d="M346 110H362" fill="none" stroke="#386f7b" stroke-width="2" marker-end="url(#arrow)"/><rect x="368" y="69" width="153" height="83" rx="3" fill="#f3f7f6" stroke="#95b1b7"/><text x="444.5" y="96" text-anchor="middle" class="body">pre-driver</text><text x="444.5" y="121" text-anchor="middle" class="body">共模／摆幅</text><path d="M521 110H537" fill="none" stroke="#386f7b" stroke-width="2" marker-end="url(#arrow)"/><rect x="543" y="69" width="153" height="83" rx="3" fill="#f3f7f6" stroke="#95b1b7"/><text x="619.5" y="96" text-anchor="middle" class="body">开关输出级</text><text x="619.5" y="121" text-anchor="middle" class="body">偏置＋选择</text><path d="M696 110H712" fill="none" stroke="#386f7b" stroke-width="2" marker-end="url(#arrow)"/><rect x="718" y="69" width="153" height="83" rx="3" fill="#f3f7f6" stroke="#95b1b7"/><text x="794.5" y="96" text-anchor="middle" class="body">MicroLED</text><text x="794.5" y="121" text-anchor="middle" class="body">电流→光</text><text x="18" y="185" class="note">另需光接收器＋判决／BER测量；电气快边沿不等于链路验证。</text><text x="18" y="211" class="note">独立功能方案，未实现高速ASIC；关断保护作为独立优先路径。</text></svg>
