<text x="26" y="660" font-size="18.6667" fill="#304b57" text-anchor="start"><tspan x="26.0" y="660.0">新 gate 10 MOS + 本图 2 MOS 均为 pre-layout；体端按图连接。A/P 为落点假设，未提取。</tspan></text>
<text x="26" y="690" font-size="18.6667" fill="#304b57" text-anchor="start"><tspan x="26.0" y="690.0">fault 解除不自动恢复 PWM；RTL inhibit 保持，需 recover_request + clock + pre-edge raw=0。</tspan></text>
