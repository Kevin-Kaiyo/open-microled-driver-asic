<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="760" viewBox="0 0 1300 760" role="img" aria-label="显示PWM与通信NRZ两条数据和参考路径的架构比较"><style>text{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#183f49}.h{font-size:25px;font-weight:600}.t{font-size:20px}.s{font-size:17px;fill:#50656c}.box{fill:#fff;stroke:#65908e;stroke-width:2}.a{fill:none;stroke:#235e64;stroke-width:3;marker-end:url(#arrow)}.b{fill:none;stroke:#7f9298;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#235e64"/></marker></defs><rect width="1300" height="760" fill="#f7faf9"/><text x="40" y="45" class="h">显示：把稳定的导通电流，按帧分配给亮灯时间</text><rect x="40" y="85" width="205" height="105" rx="8" class="box"/><text x="56" y="119" class="t">帧数据 / 本地存储</text><text x="56" y="147" class="t">下一帧统一更新</text><rect x="290" y="85" width="225" height="105" rx="8" class="box"/><text x="306" y="119" class="t">计数器＋码值比较</text><text x="306" y="147" class="t">1 μs 时隙 / 256 槽</text><rect x="560" y="85" width="220" height="105" rx="8" class="box"/><text x="576" y="119" class="t">缓冲＋独立保护</text><text x="576" y="147" class="t">PWM 控制栅极</text><rect x="825" y="85" width="195" height="105" rx="8" class="box"/><text x="841" y="119" class="t">恒流像素输出</text><text x="841" y="147" class="t">约 100 μA 导通</text><rect x="1065" y="85" width="195" height="105" rx="8" class="box"/><text x="1081" y="119" class="t">MicroLED</text><text x="1081" y="147" class="t">平均电流∝占空比</text><path d="M245 137 L290 137" class="a"/><path d="M515 137 L560 137" class="a"/><path d="M780 137 L825 137" class="a"/><path d="M1020 137 L1065 137" class="a"/><rect x="580" y="230" width="420" height="80" rx="8" class="box"/><text x="596" y="264" class="t">参考电压 → 反馈参考 → 电流镜</text><path d="M920 230 L920 190" class="b"/><text x="40" y="260" class="s">当前：单像素＋39 MOS 模拟宏</text><text x="40" y="288" class="s">3.90625 kHz PWM；外部 FAULT/PERMIT</text><text x="40" y="316" class="s">新补偿和板侧滤波已完成限定回归</text><text x="40" y="390" class="h">通信：逐位形成可判决的两个光功率状态</text><rect x="40" y="430" width="205" height="105" rx="8" class="box"/><text x="56" y="464" class="t">并行数据 / 测试码型</text><text x="56" y="492" class="t">当前 .5 Gb/s NRZ</text><rect x="290" y="430" width="225" height="105" rx="8" class="box"/><text x="306" y="464" class="t">数字预驱动 / 缓冲</text><text x="306" y="492" class="t">不逐位调节参考环路</text><rect x="560" y="430" width="220" height="105" rx="8" class="box"/><text x="576" y="464" class="t">电流转向 LED/dummy</text><text x="576" y="492" class="t">低 / 高约 25/100 μA</text><rect x="825" y="430" width="195" height="105" rx="8" class="box"/><text x="841" y="464" class="t">MicroLED＋光路</text><text x="841" y="492" class="t">当前为动态代理</text><rect x="1065" y="430" width="195" height="105" rx="8" class="box"/><text x="1081" y="464" class="t">PD / TIA / 判决</text><text x="1081" y="492" class="t">当前为接收算法</text><path d="M245 482 L290 482" class="a"/><path d="M515 482 L560 482" class="a"/><path d="M780 482 L825 482" class="a"/><path d="M1020 482 L1065 482" class="a"/><rect x="290" y="590" width="490" height="80" rx="8" class="box"/><text x="306" y="624" class="t">2.5 V 外部基准 → 10 MOS 反馈 → BIAS</text><path d="M670 590 L670 535" class="b"/><text x="825" y="602" class="s">实际已布局：参考＋保护＋B核心</text><text x="825" y="630" class="s">接收器、光学与完整协议尚为边界</text><text x="825" y="658" class="s">偏置是慢环路；转向是快数据路径</text><text x="40" y="725" class="s">实线：数据 / 驱动功能路径　虚线：参考偏置　图为功能架构，非实际布线或电流密度图。</text></svg>