<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img"><title>快冷过冲：输入边沿通过寄生电容推高内部节点</title><desc>前级 CMOS 反相器栅漏寄生电容引起内部节点过冲的原理示意。非物理版图。</desc><style>text{font-family:"PingFang SC","Noto Sans CJK SC",Arial,sans-serif}path,polyline{stroke-linecap:round;stroke-linejoin:round}</style><defs><marker id="a233d4b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#233d4b"/></marker><marker id="ac97925" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c97925"/></marker><marker id="a188578" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#188578"/></marker><marker id="a8164a8" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8164a8"/></marker><marker id="a3d729e" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3d729e"/></marker></defs><rect width="1600" height="1040" fill="#fff"/><text x="48" y="62" font-size="32" fill="#233d4b" font-weight="600" text-anchor="start">快冷过冲：输入边沿通过寄生电容推高内部节点</text><text x="48" y="103" font-size="19" fill="#667c87" font-weight="400" text-anchor="start">原理解释图｜用 Cgd 表示器件耦合路径；布线耦合也在 RC 仿真中，尚未独立分解各电容贡献</text><polyline points="48,128 1552,128" fill="none" stroke="#e0e8ec" stroke-width="1.5"/><text x="500" y="185" font-size="22" fill="#3d729e" font-weight="600" text-anchor="middle">VDD = 3.6 V</text><polyline points="500,200 500,258" fill="none" stroke="#3d729e" stroke-width="2.7"/><g data-device="P1" data-terminal-order="D G S B" data-nets="N1 / GB DATA VDD VDD" transform="translate(500 310)"><polyline points="-10,-23 -10,-13" fill="none" stroke="#3d729e" stroke-width="3"/><polyline points="-10,-5 -10,5" fill="none" stroke="#3d729e" stroke-width="3"/><polyline points="-10,13 -10,23" fill="none" stroke="#3d729e" stroke-width="3"/><polyline points="-28,-26 -28,26" fill="none" stroke="#8164a8" stroke-width="2.7"/><polyline points="0,-52 0,-21 -10,-21" fill="none" stroke="#3d729e" stroke-width="2.7"/><polyline points="-10,21 0,21 0,52" fill="none" stroke="#3d729e" stroke-width="2.7"/><polyline points="-62,0 -43,0" fill="none" stroke="#8164a8" stroke-width="2.7"/><circle cx="-38" cy="0" r="5" fill="white" stroke="#8164a8" stroke-width="2.6"/><polyline points="-33,0 -28,0" fill="none" stroke="#8164a8" stroke-width="2.7"/></g><text x="509" y="276" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">S</text><text x="509" y="359" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">D</text><text x="439" y="297" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">G</text><text x="536" y="306" font-size="21" fill="#3d729e" font-weight="600" text-anchor="start">P1</text><g data-device="N1" data-terminal-order="D G S B" data-nets="N1 / GB DATA VSS VSS" transform="translate(500 550)"><polyline points="-10,-23 -10,-13" fill="none" stroke="#188578" stroke-width="3"/><polyline points="-10,-5 -10,5" fill="none" stroke="#188578" stroke-width="3"/><polyline points="-10,13 -10,23" fill="none" stroke="#188578" stroke-width="3"/><polyline points="-28,-26 -28,26" fill="none" stroke="#8164a8" stroke-width="2.7"/><polyline points="0,-52 0,-21 -10,-21" fill="none" stroke="#188578" stroke-width="2.7"/><polyline points="-10,21 0,21 0,52" fill="none" stroke="#188578" stroke-width="2.7"/><polyline points="-62,0 -28,0" fill="none" stroke="#8164a8" stroke-width="2.7"/></g><text x="509" y="516" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">D</text><text x="509" y="599" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">S</text><text x="439" y="537" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">G</text><text x="536" y="546" font-size="21" fill="#188578" font-weight="600" text-anchor="start">N1</text><polyline points="500,362 500,498" fill="none" stroke="#188578" stroke-width="2.7"/><circle cx="500" cy="430" r="4.5" fill="#188578"/><polyline points="500,602 500,635" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="480,635 520,635" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="487,642 513,642" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="494,649 506,649" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="170,430 330,430 330,310 438,310" fill="none" stroke="#8164a8" stroke-width="2.7"/><polyline points="330,430 330,550 438,550" fill="none" stroke="#8164a8" stroke-width="2.7"/><circle cx="330" cy="430" r="4.5" fill="#8164a8"/><text x="65" y="405" font-size="23" fill="#8164a8" font-weight="600" text-anchor="start">DATA</text><text x="65" y="462" font-size="19" fill="#8164a8" font-weight="400" text-anchor="start">0 → 3.6 V</text><text x="65" y="492" font-size="18" fill="#667c87" font-weight="400" text-anchor="start">外部边沿 20 ps</text><polyline points="500,430 920,430 920,550 1018,550" fill="none" stroke="#188578" stroke-width="2.7"/><circle cx="760" cy="430" r="4.5" fill="#188578"/><g data-device="N2" data-terminal-order="D G S B" data-nets="CTRL / GP N1 / GB VSS VSS" transform="translate(1080 550)"><polyline points="-10,-23 -10,-13" fill="none" stroke="#c97925" stroke-width="3"/><polyline points="-10,-5 -10,5" fill="none" stroke="#c97925" stroke-width="3"/><polyline points="-10,13 -10,23" fill="none" stroke="#c97925" stroke-width="3"/><polyline points="-28,-26 -28,26" fill="none" stroke="#8164a8" stroke-width="2.7"/><polyline points="0,-52 0,-21 -10,-21" fill="none" stroke="#c97925" stroke-width="2.7"/><polyline points="-10,21 0,21 0,52" fill="none" stroke="#c97925" stroke-width="2.7"/><polyline points="-62,0 -28,0" fill="none" stroke="#8164a8" stroke-width="2.7"/></g><text x="1089" y="516" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">D</text><text x="1089" y="599" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">S</text><text x="1019" y="537" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">G</text><text x="1116" y="546" font-size="21" fill="#c97925" font-weight="600" text-anchor="start">N2</text><polyline points="1080,602 1080,635" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="1060,635 1100,635" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="1067,642 1093,642" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="1074,649 1086,649" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="1080,498 1080,465" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="1115" y="470" font-size="18" fill="#667c87" font-weight="400" text-anchor="start">后级输出</text><text x="1108" y="623" font-size="18" fill="#667c87" font-weight="400" text-anchor="start">B = VSS</text><text x="550" y="280" font-size="18" fill="#667c87" font-weight="400" text-anchor="start">B = VDD</text><text x="550" y="606" font-size="18" fill="#667c87" font-weight="400" text-anchor="start">B = VSS</text><text x="760" y="473" font-size="20" fill="#188578" font-weight="600" text-anchor="middle">A：N1；B：GB</text><polyline points="330,310 330,225 630,225" fill="none" stroke="#8164a8" stroke-width="2" stroke-dasharray="7 5"/><polyline points="630,205 630,245" fill="none" stroke="#8164a8" stroke-width="2.7"/><polyline points="646,205 646,245" fill="none" stroke="#8164a8" stroke-width="2.7"/><polyline points="646,225 760,225 760,430" fill="none" stroke="#8164a8" stroke-width="2" stroke-dasharray="7 5"/><text x="650" y="180" font-size="20" fill="#8164a8" font-weight="600" text-anchor="start">等效 Cgd</text><path d="M380,250 L590,250" fill="none" stroke="#8164a8" stroke-width="3" marker-end="url(#a8164a8)"/><text x="800" y="270" font-size="21" fill="#8164a8" font-weight="400" text-anchor="start">位移电流：i ≈ Cgd · dVDATA/dt</text><text x="800" y="315" font-size="21" fill="#233d4b" font-weight="400" text-anchor="start">电荷先注入 N1 / GB；</text><text x="800" y="350" font-size="21" fill="#233d4b" font-weight="400" text-anchor="start">下拉导通后，节点才转向下降。</text><text x="970" y="700" font-size="23" fill="#c97925" font-weight="600" text-anchor="start">检查 VGB = VG − VB</text><text x="64" y="737" font-size="21" fill="#233d4b" font-weight="400" text-anchor="start">① 切换前：DATA = 0，P1 导通，内部节点接近 VDD。</text><text x="64" y="775" font-size="21" fill="#233d4b" font-weight="400" text-anchor="start">② 输入快速上升：电容耦合产生向上的短暂电压尖峰；后一级栅极承受此尖峰。</text><text x="64" y="813" font-size="21" fill="#233d4b" font-weight="400" text-anchor="start">③ N1 导通后：内部节点放电，完成正常逻辑翻转。实际峰值还取决于驱动强度和节点负载。</text><polyline points="48,926 1552,926" fill="none" stroke="#e0e8ec" stroke-width="1.5"/><text x="48" y="952" font-size="17" fill="#667c87" font-weight="400" text-anchor="start">示意省略后级 PMOS，其完整连接在电路网表中；端子 B 的连接已逐管标注。</text><text x="48" y="980" font-size="17" fill="#667c87" font-weight="400" text-anchor="start">Cgd 已在 MOS 模型中，没有额外重复添加。3.63 V 为项目筛查线，不是晶圆厂可靠性批准。</text></svg>
