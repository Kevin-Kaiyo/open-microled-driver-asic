<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1350" viewBox="0 0 1600 1350" role="img"><title>修改点：输入端工艺电阻与独立偏置供电</title><desc>实际候选电路修改处：两路线加入三端工艺电阻，B的参考电阻改接已有固定3.3V电源。其余电路未展开。</desc><style>text{font-family:"PingFang SC","Noto Sans CJK SC",Arial,sans-serif}path,polyline{stroke-linecap:round;stroke-linejoin:round}</style><defs><marker id="a233d4b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#233d4b"/></marker><marker id="ac97925" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c97925"/></marker><marker id="a188578" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#188578"/></marker><marker id="a8164a8" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8164a8"/></marker><marker id="a3d729e" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3d729e"/></marker></defs><rect width="1600" height="1350" fill="#fff"/><text x="48" y="62" font-size="32" fill="#233d4b" font-weight="600" text-anchor="start">修改点：输入端工艺电阻与独立偏置供电</text><text x="48" y="103" font-size="19" fill="#667c87" font-weight="400" text-anchor="start">电路修改示意｜高速路径中的其余 MOS 连接和尺寸保持旧版；完整连接由网表与 LVS 核对</text><polyline points="48,128 1552,128" fill="none" stroke="#e0e8ec" stroke-width="1.5"/><text x="55" y="180" font-size="25" fill="#188578" font-weight="600" text-anchor="start">两条路线共同修改：DATA → RIN → DI → 原前置驱动器</text><text x="70" y="370" font-size="22" fill="#8164a8" font-weight="600" text-anchor="start">DATA</text><polyline points="70,400 225,400" fill="none" stroke="#8164a8" stroke-width="2.7"/><rect x="225" y="385" width="100" height="30" fill="white" stroke="#188578" stroke-width="2.7"/><polyline points="325,400 490,400 490,300 578,300" fill="none" stroke="#8164a8" stroke-width="2.7"/><polyline points="490,400 490,540 578,540" fill="none" stroke="#8164a8" stroke-width="2.7"/><circle cx="490" cy="400" r="4.5" fill="#8164a8"/><text x="272" y="350" font-size="23" fill="#188578" font-weight="600" text-anchor="middle">RIN</text><text x="70" y="478" font-size="19" fill="#188578" font-weight="400" text-anchor="start">ppolyf_u_1k_6p0</text><text x="70" y="509" font-size="19" fill="#188578" font-weight="400" text-anchor="start">W = 1 µm；A: L = 48 µm</text><text x="70" y="540" font-size="19" fill="#188578" font-weight="400" text-anchor="start">B: L = 58 µm；SUB = VSS</text><text x="440" y="370" font-size="22" fill="#8164a8" font-weight="600" text-anchor="start">DI</text><g data-device="P1" data-terminal-order="D G S B" data-nets="N1 / GB DI VDD VDD" transform="translate(640 300)"><polyline points="-10,-23 -10,-13" fill="none" stroke="#3d729e" stroke-width="3"/><polyline points="-10,-5 -10,5" fill="none" stroke="#3d729e" stroke-width="3"/><polyline points="-10,13 -10,23" fill="none" stroke="#3d729e" stroke-width="3"/><polyline points="-28,-26 -28,26" fill="none" stroke="#8164a8" stroke-width="2.7"/><polyline points="0,-52 0,-21 -10,-21" fill="none" stroke="#3d729e" stroke-width="2.7"/><polyline points="-10,21 0,21 0,52" fill="none" stroke="#3d729e" stroke-width="2.7"/><polyline points="-62,0 -43,0" fill="none" stroke="#8164a8" stroke-width="2.7"/><circle cx="-38" cy="0" r="5" fill="white" stroke="#8164a8" stroke-width="2.6"/><polyline points="-33,0 -28,0" fill="none" stroke="#8164a8" stroke-width="2.7"/></g><text x="649" y="266" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">S</text><text x="649" y="349" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">D</text><text x="579" y="287" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">G</text><text x="676" y="296" font-size="21" fill="#3d729e" font-weight="600" text-anchor="start">P1</text><g data-device="N1" data-terminal-order="D G S B" data-nets="N1 / GB DI VSS VSS" transform="translate(640 540)"><polyline points="-10,-23 -10,-13" fill="none" stroke="#c97925" stroke-width="3"/><polyline points="-10,-5 -10,5" fill="none" stroke="#c97925" stroke-width="3"/><polyline points="-10,13 -10,23" fill="none" stroke="#c97925" stroke-width="3"/><polyline points="-28,-26 -28,26" fill="none" stroke="#8164a8" stroke-width="2.7"/><polyline points="0,-52 0,-21 -10,-21" fill="none" stroke="#c97925" stroke-width="2.7"/><polyline points="-10,21 0,21 0,52" fill="none" stroke="#c97925" stroke-width="2.7"/><polyline points="-62,0 -28,0" fill="none" stroke="#8164a8" stroke-width="2.7"/></g><text x="649" y="506" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">D</text><text x="649" y="589" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">S</text><text x="579" y="527" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">G</text><text x="676" y="536" font-size="21" fill="#c97925" font-weight="600" text-anchor="start">N1</text><polyline points="640,248 640,222" fill="none" stroke="#3d729e" stroke-width="2.7"/><text x="640" y="210" font-size="21" fill="#3d729e" font-weight="600" text-anchor="middle">VDD</text><polyline points="640,352 640,488" fill="none" stroke="#233d4b" stroke-width="2.7"/><circle cx="640" cy="420" r="4.5" fill="#233d4b"/><polyline points="640,592 640,620" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="620,620 660,620" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="627,627 653,627" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="634,634 646,634" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="680" y="330" font-size="17" fill="#667c87" font-weight="400" text-anchor="start">W/L = 2/0.28 µm</text><text x="680" y="356" font-size="17" fill="#667c87" font-weight="400" text-anchor="start">B = VDD</text><text x="680" y="570" font-size="17" fill="#667c87" font-weight="400" text-anchor="start">W/L = 1/0.28 µm</text><text x="680" y="596" font-size="17" fill="#667c87" font-weight="400" text-anchor="start">B = VSS</text><polyline points="640,420 950,420" fill="none" stroke="#8164a8" stroke-width="2.7"/><rect x="950" y="365" width="290" height="110" rx="12" fill="#f4f7f9" stroke="#8164a8" stroke-width="1.5"/><text x="970" y="399" font-size="21" fill="#8164a8" font-weight="600" text-anchor="start">原 INV2</text><text x="970" y="432" font-size="19" fill="#233d4b" font-weight="400" text-anchor="start">输出 CTRL / GP</text><text x="770" y="399" font-size="21" fill="#8164a8" font-weight="600" text-anchor="start">N1 / GB</text><text x="55" y="650" font-size="21" fill="#233d4b" font-weight="400" text-anchor="start">RIN 的实际模型还含分段电阻、温度系数和对衬底电容；这些均计入仿真。</text><rect x="1020" y="190" width="520" height="130" rx="12" fill="#f4f7f9" stroke="#188578" stroke-width="1.5"/><text x="1040" y="224" font-size="21" fill="#188578" font-weight="600" text-anchor="start">阻尼的收益与代价</text><text x="1040" y="257" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">降低 DI 的变化率，减小电容耦合尖峰；</text><text x="1040" y="286" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">增加延迟和边沿时间，必须重测速率余量。</text><text x="1290" y="418" font-size="20" fill="#c97925" font-weight="600" text-anchor="start">→ 输出级</text><polyline points="1240,420 1280,420" fill="none" stroke="#c97925" stroke-width="2.7"/><polyline points="48,695 1552,695" fill="none" stroke="#e0e8ec" stroke-width="1.5"/><text x="55" y="750" font-size="25" fill="#188578" font-weight="600" text-anchor="start">仅路线 B：RREF 从逻辑 VDD 改接已有 VDUMMY = 3.3 V</text><text x="320" y="813" font-size="22" fill="#188578" font-weight="600" text-anchor="middle">VDUMMY = 3.3 V</text><polyline points="320,828 320,850" fill="none" stroke="#188578" stroke-width="2.7"/><polyline points="320,850 320,864" fill="none" stroke="#188578" stroke-width="2.7"/><rect x="308" y="864" width="24" height="60" fill="white" stroke="#188578" stroke-width="2.7"/><polyline points="320,924 320,938" fill="none" stroke="#188578" stroke-width="2.7"/><text x="344" y="901" font-size="18" fill="#188578" font-weight="400" text-anchor="start">RREF = 88.386106 kΩ</text><polyline points="320,938 320,1028" fill="none" stroke="#188578" stroke-width="2.7"/><circle cx="320" cy="980" r="4.5" fill="#188578"/><g data-device="REF" data-terminal-order="D G S B" data-nets="BIAS BIAS VSS VSS" transform="translate(320 1080)"><polyline points="-10,-23 -10,-13" fill="none" stroke="#188578" stroke-width="3"/><polyline points="-10,-5 -10,5" fill="none" stroke="#188578" stroke-width="3"/><polyline points="-10,13 -10,23" fill="none" stroke="#188578" stroke-width="3"/><polyline points="-28,-26 -28,26" fill="none" stroke="#8164a8" stroke-width="2.7"/><polyline points="0,-52 0,-21 -10,-21" fill="none" stroke="#188578" stroke-width="2.7"/><polyline points="-10,21 0,21 0,52" fill="none" stroke="#188578" stroke-width="2.7"/><polyline points="-62,0 -28,0" fill="none" stroke="#8164a8" stroke-width="2.7"/></g><text x="329" y="1046" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">D</text><text x="329" y="1129" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">S</text><text x="259" y="1067" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">G</text><text x="356" y="1076" font-size="21" fill="#188578" font-weight="600" text-anchor="start">REF</text><polyline points="258,1080 235,1080 235,980 320,980" fill="none" stroke="#8164a8" stroke-width="2.7"/><polyline points="320,1132 320,1155" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="300,1155 340,1155" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="307,1162 333,1162" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="314,1169 326,1169" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="320,980 750,980" fill="none" stroke="#8164a8" stroke-width="2.7"/><text x="640" y="955" font-size="22" fill="#8164a8" font-weight="600" text-anchor="start">BIAS</text><rect x="750" y="917" width="735" height="147" rx="12" fill="#f4f7f9" stroke="#188578" stroke-width="1.5"/><text x="770" y="951" font-size="21" fill="#188578" font-weight="600" text-anchor="start">连接不变的电流镜</text><text x="770" y="984" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">REF：D = G = BIAS，S = B = VSS，W/L = 2/1 µm。</text><text x="770" y="1013" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">BASE 与 TAIL 的 G 接 BIAS，分别建立基线与转向电流。</text><text x="770" y="1042" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">BASE W/L = 2/1 µm；TAIL W/L = 5.76/1 µm。</text><text x="750" y="1110" font-size="23" fill="#188578" font-weight="600" text-anchor="start">IREF ≈ (VDUMMY − VGS,REF) / RREF</text><text x="750" y="1150" font-size="20" fill="#233d4b" font-weight="400" text-anchor="start">减小逻辑电源变化的影响，仍保留器件温度／工艺依赖。</text><polyline points="48,1236 1552,1236" fill="none" stroke="#e0e8ec" stroke-width="1.5"/><text x="48" y="1262" font-size="17" fill="#667c87" font-weight="400" text-anchor="start">VDUMMY 供电与输入激励的全部取能均参与能耗统计；本修改没有实现片内稳压器或温补基准。</text><text x="48" y="1290" font-size="17" fill="#667c87" font-weight="400" text-anchor="start">此图只展开改动处；其余 MOS 的完整原理图、器件表、新 GDS 和提取网表在报告中分别链接。</text></svg>
