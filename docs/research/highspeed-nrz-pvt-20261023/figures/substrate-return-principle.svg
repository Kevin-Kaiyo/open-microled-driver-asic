<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img"><title>为什么加一个输入电阻，还必须设计它的衬底接地？</title><desc>工艺电阻衬底寄生电容和有限接地返回路径的等效电路，以及新增衬底接触的作用。</desc><style>text{font-family:"PingFang SC","Noto Sans CJK SC",Arial,sans-serif}path,polyline{stroke-linecap:round;stroke-linejoin:round}</style><defs><marker id="a233d4b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#233d4b"/></marker><marker id="ac97925" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c97925"/></marker><marker id="a188578" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#188578"/></marker><marker id="a8164a8" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8164a8"/></marker><marker id="a3d729e" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3d729e"/></marker></defs><rect width="1600" height="1100" fill="#fff"/><text x="48" y="62" font-size="32" fill="#233d4b" font-weight="600" text-anchor="start">为什么加一个输入电阻，还必须设计它的衬底接地？</text><text x="48" y="103" font-size="19" fill="#667c87" font-weight="400" text-anchor="start">局部等效电路｜工艺电阻有第 3 端 SUB；这里只展开寄生电容的返回路径，不能把 SUB 当作永远为零的理想节点</text><polyline points="48,128 1552,128" fill="none" stroke="#e0e8ec" stroke-width="1.5"/><text x="70" y="205" font-size="24" fill="#8164a8" font-weight="600" text-anchor="start">DATA 快速下降</text><polyline points="85,250 480,250" fill="none" stroke="#8164a8" stroke-width="2.7"/><rect x="480" y="235" width="105" height="30" fill="white" stroke="#188578" stroke-width="2.7"/><polyline points="585,250 1020,250" fill="none" stroke="#8164a8" stroke-width="2.7"/><text x="535" y="205" font-size="21" fill="#188578" font-weight="600" text-anchor="middle">RIN 的电阻路径</text><text x="1040" y="257" font-size="22" fill="#8164a8" font-weight="600" text-anchor="start">DI → 前置驱动器</text><circle cx="220" cy="250" r="4.5" fill="#8164a8"/><polyline points="220,250 220,350" fill="none" stroke="#8164a8" stroke-width="2.7"/><polyline points="188,350 252,350" fill="none" stroke="#8164a8" stroke-width="2.7"/><polyline points="188,368 252,368" fill="none" stroke="#8164a8" stroke-width="2.7"/><polyline points="220,368 220,490 570,490" fill="none" stroke="#8164a8" stroke-width="2.7"/><text x="280" y="352" font-size="21" fill="#8164a8" font-weight="400" text-anchor="start">Csub：工艺模型的对衬底电容</text><text x="280" y="390" font-size="18" fill="#667c87" font-weight="400" text-anchor="start">图示为合并说明，实际模型含多个 RC 分段。</text><circle cx="570" cy="490" r="4.5" fill="#c97925"/><text x="590" y="475" font-size="22" fill="#c97925" font-weight="600" text-anchor="start">电阻局部 SUB</text><polyline points="570,490 570,566" fill="none" stroke="#c97925" stroke-width="2.7"/><polyline points="570,566 570,580" fill="none" stroke="#c97925" stroke-width="2.7"/><rect x="558" y="580" width="24" height="60" fill="white" stroke="#c97925" stroke-width="2.7"/><polyline points="570,640 570,654" fill="none" stroke="#c97925" stroke-width="2.7"/><text x="594" y="617" font-size="18" fill="#c97925" font-weight="400" text-anchor="start">衬底／接触返回电阻</text><polyline points="570,654 570,760" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="550,760 590,760" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="557,767 583,767" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="564,774 576,774" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="600" y="755" font-size="20" fill="#667c87" font-weight="400" text-anchor="start">VSS 端口</text><path d="M180,450 L180,395" fill="none" stroke="#8164a8" stroke-width="3" marker-end="url(#a8164a8)"/><text x="65" y="560" font-size="21" fill="#c97925" font-weight="400" text-anchor="start">下降沿从衬底端抽取位移电流；</text><text x="65" y="594" font-size="21" fill="#c97925" font-weight="400" text-anchor="start">返回路径有阻抗，就会产生</text><text x="65" y="628" font-size="21" fill="#c97925" font-weight="400" text-anchor="start">ΔVB ≈ iC × Zreturn。</text><polyline points="570,490 1060,490 1060,566" fill="none" stroke="#188578" stroke-width="2.7"/><polyline points="1060,566 1060,580" fill="none" stroke="#188578" stroke-width="2.7"/><rect x="1048" y="580" width="24" height="60" fill="white" stroke="#188578" stroke-width="2.7"/><polyline points="1060,640 1060,654" fill="none" stroke="#188578" stroke-width="2.7"/><text x="1084" y="617" font-size="18" fill="#188578" font-weight="400" text-anchor="start">新增衬底接触与接地金属</text><polyline points="1060,654 1060,760" fill="none" stroke="#188578" stroke-width="2.7"/><polyline points="1040,760 1080,760" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="1047,767 1073,767" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="1054,774 1066,774" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="1090" y="755" font-size="20" fill="#188578" font-weight="600" text-anchor="start">低阻返回路径</text><text x="840" y="830" font-size="22" fill="#c97925" font-weight="400" text-anchor="start">首次版图的具体失效：</text><text x="840" y="866" font-size="22" fill="#c97925" font-weight="400" text-anchor="start">CTRL = 3.595125 V，MOS 体端 B = −0.111542 V；</text><text x="840" y="902" font-size="22" fill="#c97925" font-weight="400" text-anchor="start">|VCTRL − VB| = 3.706667 V。</text><text x="65" y="830" font-size="22" fill="#233d4b" font-weight="400" text-anchor="start">检查端子之间的电压，而非只看对地波形。</text><text x="65" y="866" font-size="22" fill="#233d4b" font-weight="400" text-anchor="start">C-only 把衬底网络视为等电位；</text><text x="65" y="902" font-size="22" fill="#233d4b" font-weight="400" text-anchor="start">完整 RC 才暴露这条返回路径的影响。</text><polyline points="48,986 1552,986" fill="none" stroke="#e0e8ec" stroke-width="1.5"/><text x="48" y="1012" font-size="17" fill="#667c87" font-weight="400" text-anchor="start">新增接触是版图中的实际 p+ 衬底接触与金属连接；不能用仿真里把体端短接理想地替代最终验证。</text><text x="48" y="1040" font-size="17" fill="#667c87" font-weight="400" text-anchor="start">数值来自当前公开 PDK 提取模型，不是实测硅片衬底阻抗；高频衬底模型的准确性仍待独立验证。</text></svg>
