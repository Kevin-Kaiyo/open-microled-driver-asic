,980 720,980 720,930 790,930" fill="none" stroke="#188578" stroke-width="2.7"/><text x="85" y="1040" font-size="21" fill="#233d4b" font-weight="400" text-anchor="start">VSET = 0.15 V（外部精密电压接口）</text><text x="85" y="1075" font-size="21" fill="#233d4b" font-weight="400" text-anchor="start">IBIAS ~ 0.15 / 50 = 3 mA</text><text x="85" y="1110" font-size="21" fill="#233d4b" font-weight="400" text-anchor="start">IMOD ~ 0.15 / 37.5 = 4 mA</text><polyline points="48,1206 1552,1206" fill="none" stroke="#e0e8ec" stroke-width="1.5"/><text x="48" y="1232" font-size="17" fill="#667c87" font-weight="400" text-anchor="start">D=1：IMOD 经 VCSEL  &gt;  XSTEER  &gt;  XTAIL；D=0：IMOD 经 RDUMMY  &gt;  XDUMP  &gt;  XTAIL。IBIAS 两态都存在。</text><text x="48" y="1260" font-size="17" fill="#667c87" font-weight="400" text-anchor="start">图中 xN 表示源网表中 N 只相同并联 MOS。体端依 B 标签；OTA 由 VREF 供电，三角形并非理想放大器。</text></svg>
