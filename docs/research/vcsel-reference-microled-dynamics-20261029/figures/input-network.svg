<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img"><title>输入电阻网络：降低门极摆幅，同时增加真实耗能</title><desc>源网表绑定原理图；同名网络电气相连。并联组不是版图指状结构或独立测量。</desc><defs><marker id="a233d4b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#233d4b"/></marker><marker id="ac97925" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c97925"/></marker><marker id="a188578" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#188578"/></marker><marker id="a8164a8" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8164a8"/></marker><marker id="a3d729e" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3d729e"/></marker></defs><style>text{font-family:"PingFang SC","Noto Sans CJK SC",Arial,sans-serif}polyline,path{stroke-linejoin:round;stroke-linecap:round}</style><rect width="1600" height="1060" fill="white"/><text x="48" y="62" font-size="32" fill="#233d4b" font-weight="600" text-anchor="start">输入电阻网络：降低门极摆幅，同时增加真实耗能</text><text x="48" y="103" font-size="19" fill="#667c87" font-weight="400" text-anchor="start">RD/RDB=50 ohm 来自冻结测试平台；RAD/RADB 与 RADI/RADBI 来自驱动源网表。</text><polyline points="48,128 1552,128" fill="none" stroke="#e0e8ec" stroke-width="1.5"/><circle cx="160" cy="330" r="38" fill="white" stroke="#3d729e" stroke-width="2.7"/><text x="160" y="337" font-size="24" fill="#3d729e" font-weight="600" text-anchor="middle">V</text><text x="160" y="263" font-size="22" fill="#3d729e" font-weight="600" text-anchor="middle">VD</text><polyline points="160,368 160,460" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="140,460 180,460" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="147,467 173,467" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="154,474 166,474" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="198,330 340,330" fill="none" stroke="#233d4b" stroke-width="2.7"/><rect x="340" y="318" width="60" height="24" fill="white" stroke="#233d4b" stroke-width="2.7"/><text x="370" y="295" font-size="21" fill="#667c87" font-weight="400" text-anchor="middle">50 ohm</text><rect x="670" y="318" width="60" height="24" fill="white" stroke="#233d4b" stroke-width="2.7"/><text x="700" y="295" font-size="21" fill="#667c87" font-weight="400" text-anchor="middle">200 ohm</text><polyline points="400,330 670,330" fill="none" stroke="#233d4b" stroke-width="2.7"/><circle cx="515" cy="330" r="4.5" fill="#233d4b"/><text x="515" y="305" font-size="21" fill="#188578" font-weight="600" text-anchor="middle">D</text><polyline points="730,330 1320,330" fill="none" stroke="#233d4b" stroke-width="2.7"/><circle cx="1010" cy="330" r="4.5" fill="#233d4b"/><text x="1010" y="305" font-size="21" fill="#188578" font-weight="600" text-anchor="middle">DI</text><polyline points="1010,330 1010,376" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="1010,376 1010,390" fill="none" stroke="#233d4b" stroke-width="2.7"/><rect x="998" y="390" width="24" height="60" fill="white" stroke="#233d4b" stroke-width="2.7"/><polyline points="1010,450 1010,464" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="1034" y="427" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">2.5 kohm</text><polyline points="1010,464 1010,505" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="990,505 1030,505" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="997,512 1023,512" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="1004,519 1016,519" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="1330" y="337" font-size="21" fill="#8164a8" font-weight="400" text-anchor="start">第一级 CMOS 栅极</text><circle cx="160" cy="720" r="38" fill="white" stroke="#3d729e" stroke-width="2.7"/><text x="160" y="727" font-size="24" fill="#3d729e" font-weight="600" text-anchor="middle">V</text><text x="160" y="653" font-size="22" fill="#3d729e" font-weight="600" text-anchor="middle">VDB</text><polyline points="160,758 160,850" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="140,850 180,850" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="147,857 173,857" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="154,864 166,864" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="198,720 340,720" fill="none" stroke="#233d4b" stroke-width="2.7"/><rect x="340" y="708" width="60" height="24" fill="white" stroke="#233d4b" stroke-width="2.7"/><text x="370" y="685" font-size="21" fill="#667c87" font-weight="400" text-anchor="middle">50 ohm</text><rect x="670" y="708" width="60" height="24" fill="white" stroke="#233d4b" stroke-width="2.7"/><text x="700" y="685" font-size="21" fill="#667c87" font-weight="400" text-anchor="middle">200 ohm</text><polyline points="400,720 670,720" fill="none" stroke="#233d4b" stroke-width="2.7"/><circle cx="515" cy="720" r="4.5" fill="#233d4b"/><text x="515" y="695" font-size="21" fill="#188578" font-weight="600" text-anchor="middle">DB</text><polyline points="730,720 1320,720" fill="none" stroke="#233d4b" stroke-width="2.7"/><circle cx="1010" cy="720" r="4.5" fill="#233d4b"/><text x="1010" y="695" font-size="21" fill="#188578" font-weight="600" text-anchor="middle">DBI</text><polyline points="1010,720 1010,766" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="1010,766 1010,780" fill="none" stroke="#233d4b" stroke-width="2.7"/><rect x="998" y="780" width="24" height="60" fill="white" stroke="#233d4b" stroke-width="2.7"/><polyline points="1010,840 1010,854" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="1034" y="817" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">2.5 kohm</text><polyline points="1010,854 1010,895" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="990,895 1030,895" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="997,902 1023,902" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="1004,909 1016,909" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="1330" y="727" font-size="21" fill="#8164a8" font-weight="400" text-anchor="start">第一级 CMOS 栅极</text><polyline points="48,946 1552,946" fill="none" stroke="#e0e8ec" stroke-width="1.5"/><text x="48" y="972" font-size="17" fill="#667c87" font-weight="400" text-anchor="start">TT 静态估算：两路互补输入任一时刻一路为高；P~3.3^2/(50+200+2500)=3.96 mW。</text><text x="48" y="1000" font-size="17" fill="#667c87" font-weight="400" text-anchor="start">折合净 3.2 Gb/s 约 1.24 pJ/bit；动态栅电流另由真实瞬态积分。此图不包含外部数据源芯片内部功耗。</text></svg>
