<text x="294" y="249" font-size="18" fill="#176e73">ID</text>
<text x="356" y="97" font-size="21" fill="#176e73" font-weight="600">VDS = VLED − VF(ID) − ID(RD+RS)</text>
<text x="356" y="145" font-size="18" fill="#304b57">RD：漏极与LED连接的等效走线电阻</text>
<text x="356" y="177" font-size="18" fill="#304b57">RS：源极至GND₀的等效走线电阻</text>
<text x="356" y="223" font-size="20" fill="#b56336" font-weight="600">VDS不足时，电流不能保持目标值。</text>
<text x="356" y="263" font-size="18" fill="#304b57">静态计算点：5 V − 3.76791 V = 1.23209 V</text>
<text x="356" y="294" font-size="18" fill="#304b57">这部分电压还未扣除走线压降。</text>
<text x="356" y="335" font-size="17" fill="#304b57">示意图的MPASS没有串入LED电流支路。</text>
<text x="356" y="372" font-size="17" fill="#304b57">VF随实际电流变化；需计算完整工作点。</text>
<text x="356" y="410" font-size="16" fill="#304b57">数值使用一条20 µm黄光LED静态曲线。</text></svg>
