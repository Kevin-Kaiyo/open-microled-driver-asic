<text x="693" y="139" font-size="20" fill="#304b57" font-weight="600">VG固定于GND₀</text>
<text x="693" y="188" font-size="22" fill="#b56336">VS = ID · RS</text>
<text x="693" y="227" font-size="22" fill="#176e73">VGS = VG − VS</text>
<text x="693" y="275" font-size="17" fill="#304b57">ID为加入RS后的实际电流</text>
<text x="693" y="309" font-size="17" fill="#304b57">若栅极偏置跟随VS，</text>
<text x="693" y="334" font-size="17" fill="#304b57">须重新计算VGS的变化。</text>
