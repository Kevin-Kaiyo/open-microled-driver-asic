<text x="676" y="104" font-size="20" fill="#b56336" font-weight="600">ΔVGNDL ≈ RGND·ΔIΣ</text>
<text x="692" y="137" font-size="20" fill="#b56336" font-weight="600">+ LGND·d(ΔIΣ)/dt</text>
<text x="676" y="193" font-size="18" fill="#304b57">本图VG1相对GND₀固定</text>
<text x="676" y="227" font-size="20" fill="#176e73">VGS1 = VG1 − VGNDL</text>
<text x="676" y="284" font-size="18" fill="#304b57">若栅极驱动跟随GNDL，</text>
<text x="676" y="313" font-size="18" fill="#304b57">地电位变化不等于VGS扰动。</text>
<text x="676" y="372" font-size="18" fill="#b56336">GNDL为本地地，不是理想零伏。</text>
<text x="20" y="530" font-size="16" fill="#304b57">简化回流电阻/电感模型；未计算完整电源网络、衬底、封装及振铃。</text></svg>
