roke-width="2.7"/><polyline points="0,-52 0,-21 -10,-21" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="-10,21 0,21 0,52" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="-62,0 -28,0" fill="none" stroke="#8164a8" stroke-width="2.7"/></g><text x="1209" y="346" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">D</text><text x="1209" y="429" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">S</text><text x="1139" y="367" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">G</text><polyline points="1190,380 1228,380" fill="none" stroke="#233d4b" stroke-width="2"/><polygon points="1192,380 1202,375 1202,385" fill="#233d4b"/><text x="1236" y="385" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">B=VSS</text><text x="1236" y="337" font-size="20" fill="#3d729e" font-weight="600" text-anchor="start">XTAIL</text><text x="1236" y="360" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">nmos_3p3</text><text x="1236" y="446" font-size="16" fill="#667c87" font-weight="400" text-anchor="start">W/L {WTAIL}/1u</text><polyline points="1200,328 1200,302" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="1200,432 1200,472" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="1200" y="286" font-size="19" fill="#188578" font-weight="600" text-anchor="middle">TS</text><text x="1200" y="499" font-size="19" fill="#188578" font-weight="600" text-anchor="middle">VSS</text><text x="1128" y="387" font-size="18" fill="#8164a8" font-weight="600" text-anchor="end">BIAS</text><g data-device="XSTEER" data-terminal-order="D G S B" data-nets="OUT GP VX VSS" transform="translate(620 795)"><polyline points="-10,-23 -10,-13" fill="none" stroke="#233d4b" stroke-width="3"/><polyline points="-10,-5 -10,5" fill="none" stroke="#233d4b" stroke-width="3"/><polyline points="-10,13 -10,23" fill="none" stroke="#233d4b" stroke-width="3"/><polyline points="-28,-26 -28,26" fill="none" stroke="#8164a8" stroke-width="2.7"/><polyline points="0,-52 0,-21 -10,-21" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="-10,21 0,21 0,52" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="-62,0 -28,0" fill="none" stroke="#8164a8" stroke-width="2.7"/></g><text x="629" y="761" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">D</text><text x="629" y="844" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">S</text><text x="559" y="782" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">G</text><polyline points="610,795 648,795" fill="none" stroke="#233d4b" stroke-width="2"/><polygon points="612,795 622,790 622,800" fill="#233d4b"/><text x="656" y="800" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">B=VSS</text><text x="656" y="752" font-size="20" fill="#3d729e" font-weight="600" text-anchor="start">XSTEER</text><text x="656" y="775" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">nmos_3p3</text><text x="656" y="861" font-size="16" fill="#667c87" font-weight="400" text-anchor="start">W/L 20u/.28u</text><polyline points="620,743 620,717" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="620,847 620,887" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="620" y="701" font-size="19" fill="#188578" font-weight="600" text-anchor="middle">OUT</text><text x="620" y="914" font-size="19" fill="#188578" font-weight="600" text-anchor="middle">VX</text><text x="548" y="802" font-size="18" fill="#8164a8" font-weight="600" text-anchor="end">GP</text><g data-device="XDUMP" data-terminal-order="D G S B" data-nets="DUMMY GN VX VSS" transform="translate(1190 795)"><polyline points="-10,-23 -10,-13" fill="none" stroke="#233d4b" stroke-width="3"/><polyline points="-10,-5 -10,5" fill="none" stroke="#233d4b" stroke-width="3"/><polyline points="-10,13 -10,23" fill="none" stroke="#233d4b" stroke-width="3"/><polyline points="-28,-26 -28,26" fill="none" stroke="#8164a8" stroke-width="2.7"/><polyline points="0,-52 0,-21 -10,-21" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="-10,21 0,21 0,52" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="-62,0 -28,0" fill="none" stroke="#8164a8" stroke-width="2.7"/></g><text x="1199" y="761" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">D</text><text x="1199" y="844" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">S</text><text x="1129" y="782" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">G</text><polyline points="1180,795 1218,795" fill="none" stroke="#233d4b" stroke-width="2"/><polygon points="1182,795 1192,790 1192,800" fill="#233d4b"/><text x="1226" y="800" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">B=VSS</text><text x="1226" y="752" font-size="20" fill="#3d729e" font-weight="600" text-anchor="start">XDUMP</text><text x="1226" y="775" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">nmos_3p3</text><text x="1226" y="861" font-size="16" fill="#667c87" font-weight="400" text-anchor="start">W/L 20u/.28u</text><polyline points="1190,743 1190,717" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="1190,847 1190,887" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="1190" y="701" font-size="19" fill="#188578" font-weight="600" text-anchor="middle">DUMMY</text><text x="1190" y="914" font-size="19" fill="#188578" font-weight="600" text-anchor="middle">VX</text><text x="1118" y="802" font-size="18" fill="#8164a8" font-weight="600" text-anchor="end">GN</text><polyline points="230,161 230,175" fill="none" stroke="#233d4b" stroke-width="2.7"/><rect x="218" y="175" width="24" height="60" fill="white" stroke="#233d4b" stroke-width="2.7"/><polyline points="230,235 230,249" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="254" y="212" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">RREF1 = RREF</text><text x="230" y="145" font-size="20" fill="#188578" font-weight="600" text-anchor="middle">VREF</text><polyline points="230,157 230,161" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="230,249 230,302" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="168,380 110,380 110,280 230,280" fill="none" stroke="#233d4b" stroke-width="2.7"/><circle cx="230" cy="280" r="4.5" fill="#233d4b"/><text x="420" y="180" font-size="23" fill="#3d729e" font-weight="600" text-anchor="start">RREF  &gt;  二极管连接 XREF  &gt;  BIAS</text><text x="420" y="210" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">BIAS 同时控制 XBASE、XTAIL 的栅极。</text><text x="420" y="234" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">XBASE 是 VCSEL 的基础吸流支路；XTAIL 是连续的调制尾源。</text><text x="420" y="258" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">这是电阻偏置电流镜，尚非精密基准；WBASE/WTAIL/RREF 为校准参数。</text><text x="52" y="620" font-size="20" fill="#188578" font-weight="600" text-anchor="start">输出连接：VLASER  &gt;  VCSEL 电学负载与封装 R/L  &gt;  OUT；VLASER  &gt;  RDUMMY1  &gt;  DUMMY。</text><text x="52" y="660" font-size="20" fill="#188578" font-weight="400" text-anchor="start">XSTEER 与 XDUMP 的源极同接 VX；VX 经 XTAIL 到 VSS。GP/GN 来自下一图。</text><polyline points="620,847 620,952 1190,952 1190,847" fill="none" stroke="#233d4b" stroke-width="2.7"/><circle cx="900" cy="952" r="4.5" fill="#233d4b"/><text x="900" y="986" font-size="20" fill="#188578" font-weight="600" text-anchor="middle">VX  &gt;  VITAIL (0 V)  &gt;  TS  &gt;  XTAIL.D</text><text x="52" y="1030" font-size="19" fill="#667c87" font-weight="400" text-anchor="start">支路测流探针：OUT  &gt;  VIBASE (0 V)  &gt;  BS  &gt;  XBASE.D；两个 0 V 电压源仅用于读取电流。</text><polyline points="48,1066 1552,1066" fill="none" stroke="#e0e8ec" stroke-width="1.5"/><text x="48" y="1092" font-size="17" fill="#667c87" font-weight="400" text-anchor="start">D=1：GP 高、GN 低，OUT 的调制电流流经 XSTEER &gt; XTAIL；D=0：调制电流经 RDUMMY1 &gt; XDUMP &gt; XTAIL。</text><text x="48" y="1120" font-size="17" fill="#667c87" font-weight="400" text-anchor="start">XBASE 两态都吸流。体端全部按 B 标签连接。实际校准值、源哈希及完整供电/负载见报告和 testbench。</text></svg>
