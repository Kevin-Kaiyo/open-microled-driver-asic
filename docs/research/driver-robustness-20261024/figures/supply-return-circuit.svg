<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img"><title>供电与回地必须构成完整回路</title><desc>实际仿真供电回路的原理解释；仅展开一个CMOS级，完整网表和局部波形另有证据。</desc><style>text{font-family:"PingFang SC","Noto Sans CJK SC",Arial,sans-serif}path,polyline{stroke-linecap:round;stroke-linejoin:round}</style><defs><marker id="a233d4b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#233d4b"/></marker><marker id="ac97925" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c97925"/></marker><marker id="a188578" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#188578"/></marker><marker id="a8164a8" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8164a8"/></marker><marker id="a3d729e" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3d729e"/></marker></defs><rect width="1600" height="1140" fill="#fff"/><text x="48" y="62" font-size="32" fill="#233d4b" font-weight="600" text-anchor="start">供电与回地必须构成完整回路</text><text x="48" y="103" font-size="19" fill="#667c87" font-weight="400" text-anchor="start">实际实验在VDD和VSS各串入1 ohm + 2 nH；下图仅展开一个CMOS级，便于读懂局部端电压</text><polyline points="48,128 1552,128" fill="none" stroke="#e0e8ec" stroke-width="1.5"/><circle cx="160" cy="470" r="40" fill="white" stroke="#233d4b" stroke-width="2.7"/><text x="160" y="458" font-size="25" fill="#233d4b" font-weight="400" text-anchor="middle">+</text><text x="160" y="495" font-size="25" fill="#233d4b" font-weight="400" text-anchor="middle">-</text><text x="35" y="391" font-size="22" fill="#3d729e" font-weight="600" text-anchor="start">理想电源</text><text x="25" y="425" font-size="20" fill="#3d729e" font-weight="400" text-anchor="start">固定3.600 V</text><polyline points="160,430 160,220 360,220" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="360,220 382,220" fill="none" stroke="#233d4b" stroke-width="2.7"/><rect x="382" y="208" width="76" height="24" fill="white" stroke="#233d4b" stroke-width="2.7"/><polyline points="458,220 480,220" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="420" y="190" font-size="20" fill="#233d4b" font-weight="600" text-anchor="middle">R_VDD = 1 ohm</text><polyline points="480,220 580,220" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="580,220 608,220" fill="none" stroke="#233d4b" stroke-width="2.7"/><path d="M608,220 c0,-22 16,-22 16,0 c0,-22 16,-22 16,0 c0,-22 16,-22 16,0 c0,-22 16,-22 16,0" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="672,220 700,220" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="640" y="190" font-size="20" fill="#233d4b" font-weight="600" text-anchor="middle">L_VDD = 2 nH</text><polyline points="700,220 970,220 970,298" fill="none" stroke="#233d4b" stroke-width="2.7"/><circle cx="970" cy="220" r="4.5" fill="#233d4b"/><text x="1020" y="225" font-size="22" fill="#3d729e" font-weight="600" text-anchor="start">VDD_die</text><g data-device="MP" data-terminal-order="D G S B" data-nets="out in vdd_die vdd_die" transform="translate(970 350)"><polyline points="-10,-23 -10,-13" fill="none" stroke="#3d729e" stroke-width="3"/><polyline points="-10,-5 -10,5" fill="none" stroke="#3d729e" stroke-width="3"/><polyline points="-10,13 -10,23" fill="none" stroke="#3d729e" stroke-width="3"/><polyline points="-28,-26 -28,26" fill="none" stroke="#8164a8" stroke-width="2.7"/><polyline points="0,-52 0,-21 -10,-21" fill="none" stroke="#3d729e" stroke-width="2.7"/><polyline points="-10,21 0,21 0,52" fill="none" stroke="#3d729e" stroke-width="2.7"/><polyline points="-62,0 -43,0" fill="none" stroke="#8164a8" stroke-width="2.7"/><circle cx="-38" cy="0" r="5" fill="white" stroke="#8164a8" stroke-width="2.6"/><polyline points="-33,0 -28,0" fill="none" stroke="#8164a8" stroke-width="2.7"/></g><text x="979" y="316" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">S</text><text x="979" y="399" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">D</text><text x="909" y="337" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">G</text><text x="1006" y="346" font-size="21" fill="#3d729e" font-weight="600" text-anchor="start">MP</text><g data-device="MN" data-terminal-order="D G S B" data-nets="out in vss_die vss_die" transform="translate(970 650)"><polyline points="-10,-23 -10,-13" fill="none" stroke="#c97925" stroke-width="3"/><polyline points="-10,-5 -10,5" fill="none" stroke="#c97925" stroke-width="3"/><polyline points="-10,13 -10,23" fill="none" stroke="#c97925" stroke-width="3"/><polyline points="-28,-26 -28,26" fill="none" stroke="#8164a8" stroke-width="2.7"/><polyline points="0,-52 0,-21 -10,-21" fill="none" stroke="#c97925" stroke-width="2.7"/><polyline points="-10,21 0,21 0,52" fill="none" stroke="#c97925" stroke-width="2.7"/><polyline points="-62,0 -28,0" fill="none" stroke="#8164a8" stroke-width="2.7"/></g><text x="979" y="616" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">D</text><text x="979" y="699" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">S</text><text x="909" y="637" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">G</text><text x="1006" y="646" font-size="21" fill="#c97925" font-weight="600" text-anchor="start">MN</text><polyline points="970,402 970,598" fill="none" stroke="#233d4b" stroke-width="2.7"/><circle cx="970" cy="500" r="4.5" fill="#233d4b"/><polyline points="970,500 1350,500 1350,570" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="1330,570 1370,570" fill="none" stroke="#188578" stroke-width="2.7"/><polyline points="1330,590 1370,590" fill="none" stroke="#188578" stroke-width="2.7"/><polyline points="1350,590 1350,810 970,810 970,702" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="1380" y="583" font-size="19" fill="#188578" font-weight="400" text-anchor="start">后级栅电容</text><text x="1380" y="611" font-size="19" fill="#188578" font-weight="400" text-anchor="start">与布线电容</text><text x="1010" y="381" font-size="18" fill="#667c87" font-weight="400" text-anchor="start">B 接 VDD_die</text><text x="1010" y="679" font-size="18" fill="#667c87" font-weight="400" text-anchor="start">B 接 VSS_die</text><polyline points="908,350 820,350 820,650 908,650" fill="none" stroke="#8164a8" stroke-width="2.7"/><circle cx="820" cy="500" r="4.5" fill="#8164a8"/><polyline points="520,500 820,500" fill="none" stroke="#8164a8" stroke-width="2.7"/><text x="530" y="475" font-size="21" fill="#8164a8" font-weight="600" text-anchor="start">DATA / 上一级输出</text><text x="530" y="539" font-size="18" fill="#8164a8" font-weight="400" text-anchor="start">外部DATA以板级地为参考</text><circle cx="970" cy="810" r="4.5" fill="#233d4b"/><text x="1010" y="849" font-size="22" fill="#c97925" font-weight="600" text-anchor="start">VSS_die 并非板级地</text><polyline points="970,810 970,930 700,930" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="580,930 608,930" fill="none" stroke="#233d4b" stroke-width="2.7"/><path d="M608,930 c0,-22 16,-22 16,0 c0,-22 16,-22 16,0 c0,-22 16,-22 16,0 c0,-22 16,-22 16,0" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="672,930 700,930" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="640" y="900" font-size="20" fill="#233d4b" font-weight="600" text-anchor="middle">L_VSS = 2 nH</text><polyline points="580,930 480,930" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="360,930 382,930" fill="none" stroke="#233d4b" stroke-width="2.7"/><rect x="382" y="918" width="76" height="24" fill="white" stroke="#233d4b" stroke-width="2.7"/><polyline points="458,930 480,930" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="420" y="900" font-size="20" fill="#233d4b" font-weight="600" text-anchor="middle">R_VSS = 1 ohm</text><polyline points="360,930 160,930 160,510" fill="none" stroke="#233d4b" stroke-width="2.7"/><circle cx="160" cy="930" r="4.5" fill="#233d4b"/><polyline points="140,950 180,950" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="147,957 173,957" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="154,964 166,964" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="215" y="987" font-size="21" fill="#233d4b" font-weight="600" text-anchor="start">板级地 = 0 V</text><path d="M745,195 L855,195" fill="none" stroke="#c97925" stroke-width="3" marker-end="url(#ac97925)"/><text x="760" y="170" font-size="18" fill="#c97925" font-weight="400" text-anchor="start">供电电流</text><path d="M1320,620 L1320,735" fill="none" stroke="#c97925" stroke-width="3" marker-end="url(#ac97925)"/><text x="1120" y="756" font-size="18" fill="#c97925" font-weight="400" text-anchor="start">给电容充电的回流</text><path d="M865,955 L755,955" fill="none" stroke="#c97925" stroke-width="3" marker-end="url(#ac97925)"/><text x="750" y="989" font-size="18" fill="#c97925" font-weight="400" text-anchor="start">回地电流</text><text x="210" y="627" font-size="22" fill="#188578" font-weight="400" text-anchor="start">VDD_die = V源 - R_VDD·I_VDD - L_VDD·dI_VDD/dt</text><text x="210" y="669" font-size="22" fill="#188578" font-weight="400" text-anchor="start">VSS_die = R_VSS·I_VSS + L_VSS·dI_VSS/dt</text><text x="210" y="711" font-size="22" fill="#188578" font-weight="400" text-anchor="start">器件应力由本地D/G/S/B相减决定；</text><text x="210" y="753" font-size="22" fill="#188578" font-weight="400" text-anchor="start">示波器只盯板端3.600 V，会漏掉芯片端扰动。</text><polyline points="48,1026 1552,1026" fill="none" stroke="#e0e8ec" stroke-width="1.5"/><text x="48" y="1052" font-size="17" fill="#667c87" font-weight="400" text-anchor="start">电容是后级与布线负载的等效画法，未在正式网表中重复添加；MOS内禀C与互连C来自PDK/PEX。</text><text x="48" y="1080" font-size="17" fill="#667c87" font-weight="400" text-anchor="start">其他LED/偏置电源未在此局部图展开，但正式仿真全部保留；R/L是集总敏感度假设，不是实测封装。</text></svg>
