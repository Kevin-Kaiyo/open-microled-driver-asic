<text x="1070" y="640" font-size="18" fill="#233e4e" text-anchor="start">GP</text>
<text x="980" y="689" font-size="14" fill="#233e4e" text-anchor="start">→ 换流管栅极</text>
<text x="837" y="815" font-size="14" fill="#233e4e" text-anchor="middle">原 69 MOS 核心的一部分</text>
<text x="837" y="837" font-size="13" fill="#233e4e" text-anchor="middle">P 体接 DR；N 体接 VSS</text>
<text x="35" y="897" font-size="16" fill="#233e4e" text-anchor="start">新增上游供电：VPHY 理想源 → 0.25 Ω → 0.2 nH → VPHY；去耦为 0.1 Ω + 1 nF 串联至地。</text>
<text x="35" y="929" font-size="15" fill="#233e4e" text-anchor="start">D_CMD=1：DI 高、DBI 低 → GP 高、GN 低 → 4 mA 调制电流进 VCSEL，加 3 mA 偏置，共约 7 mA。</text>
<text x="35" y="959" font-size="15" fill="#233e4e" text-anchor="start">D_CMD=0：DI 低、DBI 高 → GP 低、GN 高 → 4 mA 转向虚支路，VCSEL 保持约 3 mA。</text>
<text x="35" y="997" font-size="14" fill="#233e4e" text-anchor="start">计能：保留 VLASER / VDD / VREF / VSET / VREGSET，新增 VPHY，同时计入 D_CMD / DB_CMD 的栅充电。</text>
<text x="35" y="1026" font-size="14" fill="#233e4e" text-anchor="start">这是 GF180 3.3 V CMOS 有限驱动模型；未覆盖任何实物 FPGA、LVDS/CML 接收器、Pad、ESD、走线或实际 PHY 合规。</text>
<text x="35" y="1055" font-size="14" fill="#233e4e" text-anchor="start">2.5 kΩ 的历史用途是输入衰减，不是已确认的传输线终端；增加下拉阻值不等于实现激光保护关断。</text>
</svg>