<text x="800" y="1025" font-size="17" fill="#334e60" text-anchor="start">d0 仍由 VD0 经既有 100 Ω 提供；VD0 的原 PRBS 不变。</text>
<text x="800" y="1055" font-size="17" fill="#334e60" text-anchor="start">XDRV.DISABLE 接 0：参考源保持工作，额外功耗保留。</text>
<text x="800" y="1085" font-size="17" fill="#6b7e8a" text-anchor="start">慢 RC 直接进入 NAND；首次脉冲与接收恢复必须实测。</text>
<text x="35" y="1180" font-size="17" fill="#334e60" text-anchor="start">高边 11 MOS 与 A-v3r 的慢开/快关连接相同：RGATE=100 kΩ、XFASTOFF=20/0.7、PISO=3×100/0.7；B 不加命令源 100 Ω。</text>
<text x="35" y="1210" font-size="17" fill="#334e60" text-anchor="start">输入门控的 MOS、CREADY、命令栅充电计入既有 VDD / VD0 / VDISABLE；无理想 delay、理想 AND 或新增免费电源。</text>
<text x="35" y="1240" font-size="17" fill="#6b7e8a" text-anchor="start">此图对应 W20 的实际 v4 网表，不代表后续 W4 修改或验证通过；PVT、误码、保护与版图资格仍需分别闭合。</text>
