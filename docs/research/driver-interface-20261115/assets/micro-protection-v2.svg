<text x="875" y="740" font-size="20">OUT  至  冻结 A / B 驱动核心；DATA 始终翻转</text>
<text x="875" y="771" font-size="16">B 的原参考关断端接 0：参考持续工作，其静态功耗仍计入</text>
<text x="40" y="726" font-size="23">工作原理</text>
<text x="40" y="763" font-size="18">正常：VLED  至  并联 PMOS  至  LED  至  驱动核心。</text>
<text x="40" y="797" font-size="18">保护：切断 VLED；XCLAMP 导通，把 A、K 两端</text>
<text x="40" y="830" font-size="18">拉到接近同一电位，吸收 CFF 在输出端的注入。</text>
<text x="40" y="869" font-size="18">关断不等于断掉 DATA，也不等于仅把参考电流拉低。</text>
<path d="M40 905L1560 905" stroke="#c9d7df" stroke-width="1" fill="none"/>
<text x="40" y="941" font-size="22">器件类型与实现边界</text>
<text x="40" y="976" font-size="19">XEN 为 GF180MCU 3.3 V MOS，其余新增器件为 6 V MOS；PMOS 体端接各自高侧供电，NMOS 体端接地。</text>
<text x="40" y="1008" font-size="19">W = 300 um 单管超出当前模型 bin，现显式采用三只 W = 100 um；面积与端部寄生按三只分别计入。</text>
<text x="40" y="1040" font-size="18">这是原理图级候选，未经过新版图 DRC/LVS/PEX；低于 0.1 uA 的关断电流仍位于静态 I–V 校准域之外。</text>
</svg>