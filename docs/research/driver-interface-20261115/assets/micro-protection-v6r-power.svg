</g><text font-size="20" x="20" y="530.0" fill="#385568">iso_gb 低时快关上拉导通；高时上拉截止，iso_p 经 100 kΩ 慢放电。PMOS 体接 led_feed。</text><text font-size="20" x="20" y="560.0" fill="#385568">XCLAMP 的 D/G/S/B = LED_A / disable / LED_K / VSS，W/L = 10/0.7；CLED = 200 fF。</text><text font-size="20" x="20" y="590.0" fill="#385568">其余高边端接见 A-v3r 功率分图；此处 FASTOFF 为 W4，不是 A-v3r 的 W20。</text><text font-size="20" x="20" y="620.0" fill="#385568">实际网表：B-protected_v6r / fault-f2-net1.6-s40；本图不升级仿真、PVT 或版图证据等级。</text><text font-size="20" x="20" y="650.0" fill="#385568">Deck SHA-256：8e8473e2415079ed572a361e8922034696cfa757e0aed31cef0eb20e44697340</text></svg>
