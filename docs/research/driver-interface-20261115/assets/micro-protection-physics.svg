<text x="30" y="1171" font-size="18" fill="#334e60" text-anchor="start">红色箭头：常规电流 / 电荷注入方向的定性示意。体结 A 为阳极，K 为阴极；LED_K 与 OUT 由封装 R/L 分隔。</text>
<text x="30" y="1200" font-size="17" fill="#6b7e8a" text-anchor="start">这些峰值是失败定位证据，不代表保护已通过；慢开与数据门控候选仍在验证。全部改法均需真实 MOS、供源计能和原生步长复查。</text>
