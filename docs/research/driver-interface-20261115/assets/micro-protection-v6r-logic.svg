</g><text font-size="20" x="20" y="770.0" fill="#385568">data_gate 接新增电阻后的 DATA；ready_rc 接真实 RC。DATA 在上管，READY 在下管。</text><text font-size="20" x="20" y="800.0" fill="#385568">data_safe → XDRV.D0 → 既有 XRIN → DI / GB / GP；必须检查慢输入延迟及 VDD 交越能耗。</text><text font-size="20" x="20" y="830.0" fill="#385568">实际网表：B-protected_v6r / fault-f2-net1.6-s40；本图不升级仿真、PVT 或版图证据等级。</text><text font-size="20" x="20" y="860.0" fill="#385568">Deck SHA-256：8e8473e2415079ed572a361e8922034696cfa757e0aed31cef0eb20e44697340</text></svg>
