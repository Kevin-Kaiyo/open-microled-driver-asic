<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020" role="img"><title>一根理想导线，为什么会变成多个电路节点？</title><desc>原创局部等效电路。用于解释分布式 RC 与器件模型的区别，数值不代表实际提取。</desc><style>text{font-family:"PingFang SC","Noto Sans CJK SC",Arial,sans-serif}path,polyline{stroke-linecap:round;stroke-linejoin:round}</style><defs><marker id="a233d4b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#233d4b"/></marker><marker id="ac97925" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c97925"/></marker><marker id="a188578" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#188578"/></marker><marker id="a8164a8" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8164a8"/></marker><marker id="a3d729e" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3d729e"/></marker></defs><rect width="1600" height="1020" fill="#fff"/><text x="48" y="62" font-size="32" fill="#233d4b" font-weight="600" text-anchor="start">一根理想导线，为什么会变成多个电路节点？</text><text x="48" y="103" font-size="19" fill="#667c87" font-weight="400" text-anchor="start">局部等效电路：用于解释 PEX；符号 Rwire、Cground、Ccouple 不是本次提取数值</text><polyline points="48,128 1552,128" fill="none" stroke="#e0e8ec" stroke-width="1.5"/><text x="52" y="190" font-size="24" fill="#233d4b" font-weight="600" text-anchor="start">① 原理图：输出缓冲器直接驱动 MOS 栅极</text><rect x="60" y="245" width="265" height="120" rx="12" fill="#f4f7f9" stroke="#8164a8" stroke-width="1.5"/><text x="80" y="279" font-size="21" fill="#8164a8" font-weight="600" text-anchor="start">前置 CMOS 缓冲器</text><text x="80" y="312" font-size="19" fill="#233d4b" font-weight="400" text-anchor="start">输出节点 CTRL</text><polyline points="325,305 800,305 800,350 998,350" fill="none" stroke="#8164a8" stroke-width="2.7"/><g data-device="MN" data-terminal-order="D G S B" data-nets="OUT CTRL VSS VSS" transform="translate(1060 350)"><polyline points="-10,-23 -10,-13" fill="none" stroke="#c97925" stroke-width="3"/><polyline points="-10,-5 -10,5" fill="none" stroke="#c97925" stroke-width="3"/><polyline points="-10,13 -10,23" fill="none" stroke="#c97925" stroke-width="3"/><polyline points="-28,-26 -28,26" fill="none" stroke="#8164a8" stroke-width="2.7"/><polyline points="0,-52 0,-21 -10,-21" fill="none" stroke="#c97925" stroke-width="2.7"/><polyline points="-10,21 0,21 0,52" fill="none" stroke="#c97925" stroke-width="2.7"/><polyline points="-62,0 -28,0" fill="none" stroke="#8164a8" stroke-width="2.7"/></g><text x="1069" y="316" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">D</text><text x="1069" y="399" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">S</text><text x="999" y="337" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">G</text><text x="1096" y="346" font-size="21" fill="#c97925" font-weight="600" text-anchor="start">MN</text><polyline points="1060,298 1060,230" fill="none" stroke="#c97925" stroke-width="2.7"/><text x="1060" y="205" font-size="21" fill="#c97925" font-weight="600" text-anchor="middle">OUT</text><polyline points="1060,402 1060,440" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="1040,440 1080,440" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="1047,447 1073,447" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="1054,454 1066,454" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="380" y="280" font-size="20" fill="#8164a8" font-weight="400" text-anchor="start">整条线同一个电位 V(CTRL)</text><text x="1110" y="410" font-size="20" fill="#667c87" font-weight="400" text-anchor="start">B = VSS</text><polyline points="48,492 1552,492" fill="none" stroke="#e0e8ec" stroke-width="1.5"/><text x="52" y="545" font-size="24" fill="#233d4b" font-weight="600" text-anchor="start">② 提取后：金属 / 通孔有电阻；导线与其他网络有电容</text><rect x="60" y="620" width="265" height="120" rx="12" fill="#f4f7f9" stroke="#8164a8" stroke-width="1.5"/><text x="80" y="654" font-size="21" fill="#8164a8" font-weight="600" text-anchor="start">同一个 CMOS 缓冲器</text><text x="80" y="687" font-size="19" fill="#233d4b" font-weight="400" text-anchor="start">驱动端 CTRL</text><polyline points="325,680 400,680" fill="none" stroke="#8164a8" stroke-width="2.7"/><polyline points="400,680 541.0,680" fill="none" stroke="#233d4b" stroke-width="2.7"/><rect x="541.0" y="668" width="68" height="24" fill="white" stroke="#233d4b" stroke-width="2.7"/><polyline points="609.0,680 750,680" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="575.0" y="652" font-size="20" fill="#233d4b" font-weight="400" text-anchor="middle">Rwire：金属 + 通孔</text><polyline points="750,680 840.0,680" fill="none" stroke="#233d4b" stroke-width="2.7"/><rect x="840.0" y="668" width="68" height="24" fill="white" stroke="#233d4b" stroke-width="2.7"/><polyline points="908.0,680 998,680" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="874.0" y="652" font-size="20" fill="#233d4b" font-weight="400" text-anchor="middle">局部接触 R</text><g data-device="MN" data-terminal-order="D G S B" data-nets="OUT Glocal Slocal Blocal" transform="translate(1060 680)"><polyline points="-10,-23 -10,-13" fill="none" stroke="#c97925" stroke-width="3"/><polyline points="-10,-5 -10,5" fill="none" stroke="#c97925" stroke-width="3"/><polyline points="-10,13 -10,23" fill="none" stroke="#c97925" stroke-width="3"/><polyline points="-28,-26 -28,26" fill="none" stroke="#8164a8" stroke-width="2.7"/><polyline points="0,-52 0,-21 -10,-21" fill="none" stroke="#c97925" stroke-width="2.7"/><polyline points="-10,21 0,21 0,52" fill="none" stroke="#c97925" stroke-width="2.7"/><polyline points="-62,0 -28,0" fill="none" stroke="#8164a8" stroke-width="2.7"/></g><text x="1069" y="646" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">D</text><text x="1069" y="729" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">S</text><text x="999" y="667" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">G</text><text x="1096" y="676" font-size="21" fill="#c97925" font-weight="600" text-anchor="start">MN</text><circle cx="750" cy="680" r="4.5" fill="#8164a8"/><text x="760" y="620" font-size="20" fill="#8164a8" font-weight="400" text-anchor="start">中间节点</text><text x="1000" y="620" font-size="20" fill="#8164a8" font-weight="400" text-anchor="start">Glocal</text><polyline points="1060,628 1060,565" fill="none" stroke="#c97925" stroke-width="2.7"/><text x="1120" y="592" font-size="20" fill="#c97925" font-weight="400" text-anchor="start">OUT 也有自身互连 RC</text><polyline points="1060,732 1060,810" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="1090" y="790" font-size="20" fill="#667c87" font-weight="400" text-anchor="start">Slocal / Blocal</text><polyline points="750,680 750,720" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="750,720 750,752" fill="none" stroke="#3d729e" stroke-width="2.7"/><polyline points="728,752 772,752" fill="none" stroke="#3d729e" stroke-width="2.7"/><polyline points="728,768 772,768" fill="none" stroke="#3d729e" stroke-width="2.7"/><polyline points="750,768 750,800" fill="none" stroke="#3d729e" stroke-width="2.7"/><text x="784" y="767" font-size="20" fill="#3d729e" font-weight="400" text-anchor="start">Cground</text><polyline points="750,800 750,828" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="730,828 770,828" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="737,835 763,835" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="744,842 756,842" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="480,680 480,645" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="480,565 480,597" fill="none" stroke="#188578" stroke-width="2.7"/><polyline points="458,597 502,597" fill="none" stroke="#188578" stroke-width="2.7"/><polyline points="458,613 502,613" fill="none" stroke="#188578" stroke-width="2.7"/><polyline points="480,613 480,645" fill="none" stroke="#188578" stroke-width="2.7"/><text x="514" y="612" font-size="20" fill="#188578" font-weight="400" text-anchor="start">Ccouple</text><polyline points="480,565 700,565" fill="none" stroke="#188578" stroke-width="2.7"/><text x="720" y="572" font-size="20" fill="#188578" font-weight="400" text-anchor="start">相邻网 Vaggressor</text><polyline points="48,906 1552,906" fill="none" stroke="#e0e8ec" stroke-width="1.5"/><text x="48" y="932" font-size="17" fill="#667c87" font-weight="400" text-anchor="start">Rwire 使两端产生压降；Cground 需要充放电；Ccouple 的电流取决于两条线的电压差变化。</text><text x="48" y="960" font-size="17" fill="#667c87" font-weight="400" text-anchor="start">MOS 内部电容仍由 PDK 模型提供。提取 AD/AS/PD/PS 替换原扩散估计，不能把两套几何电容重复相加。</text></svg>
