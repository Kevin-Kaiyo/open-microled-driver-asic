<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1150" viewBox="0 0 1600 1150" role="img"><title>两条路线的版图范围与外部电路</title><desc>本项目两条高速 NRZ 路线的核心和外部边界；不显示制造完成的完整 ASIC。</desc><style>text{font-family:"PingFang SC","Noto Sans CJK SC",Arial,sans-serif}path,polyline{stroke-linecap:round;stroke-linejoin:round}</style><defs><marker id="a233d4b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#233d4b"/></marker><marker id="ac97925" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c97925"/></marker><marker id="a188578" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#188578"/></marker><marker id="a8164a8" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8164a8"/></marker><marker id="a3d729e" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3d729e"/></marker></defs><rect width="1600" height="1150" fill="#fff"/><text x="48" y="62" font-size="32" fill="#233d4b" font-weight="600" text-anchor="start">两条路线的版图范围与外部电路</text><text x="48" y="103" font-size="19" fill="#667c87" font-weight="400" text-anchor="start">虚线范围内为本次 MOS 核心；电源、LED 与电阻的边界在两条路线之间保持明确</text><polyline points="48,128 1552,128" fill="none" stroke="#e0e8ec" stroke-width="1.5"/><text x="55" y="195" font-size="27" fill="#3d729e" font-weight="600" text-anchor="start">A · 受限摆幅电压驱动</text><rect x="55" y="275" width="710" height="295" rx="8" fill="#f6f9fa" stroke="#3d729e" stroke-width="2" stroke-dasharray="10 7"/><text x="79" y="325" font-size="22" fill="#3d729e" font-weight="600" text-anchor="start">实际 GDS / DRC / LVS / PEX 的核心范围</text><text x="79" y="380" font-size="20" fill="#233d4b" font-weight="400" text-anchor="start">6 MOS：INV1 → INV2 → 输出 CMOS</text><polyline points="79,422 735,422" fill="none" stroke="#e0e8ec" stroke-width="1.5"/><text x="79" y="465" font-size="21" fill="#667c87" font-weight="400" text-anchor="start">VDD 3.3 V</text><text x="79" y="507" font-size="21" fill="#667c87" font-weight="400" text-anchor="start">VH / VL：原 DC 校准值</text><text x="71" y="248" font-size="21" fill="#8164a8" font-weight="600" text-anchor="start">DATA →</text><text x="79" y="620" font-size="21" fill="#c97925" font-weight="600" text-anchor="start">OUT → 同一封装 R/L → 同一 MicroLED</text><text x="79" y="690" font-size="20" fill="#667c87" font-weight="400" text-anchor="start">VH / VL 仍为可吸收电流的理想电源</text><text x="79" y="730" font-size="20" fill="#667c87" font-weight="400" text-anchor="start">稳压器、pad / ESD 未进入版图</text><text x="835" y="195" font-size="27" fill="#3d729e" font-weight="600" text-anchor="start">B · 电流转向</text><rect x="835" y="275" width="710" height="295" rx="8" fill="#f6f9fa" stroke="#3d729e" stroke-width="2" stroke-dasharray="10 7"/><text x="859" y="325" font-size="22" fill="#3d729e" font-weight="600" text-anchor="start">实际 GDS / DRC / LVS / PEX 的核心范围</text><text x="859" y="380" font-size="20" fill="#233d4b" font-weight="400" text-anchor="start">9 MOS：偏置镜 + 基线 + 转向 + 2级反相器</text><polyline points="859,422 1515,422" fill="none" stroke="#e0e8ec" stroke-width="1.5"/><text x="859" y="465" font-size="21" fill="#667c87" font-weight="400" text-anchor="start">VDD 3.3 V</text><text x="859" y="507" font-size="21" fill="#667c87" font-weight="400" text-anchor="start">外部 RREF → BIAS；RDUMMY → DUMMY</text><text x="851" y="248" font-size="21" fill="#8164a8" font-weight="600" text-anchor="start">DATA →</text><text x="859" y="620" font-size="21" fill="#c97925" font-weight="600" text-anchor="start">OUT → 同一封装 R/L → 同一 MicroLED</text><text x="859" y="690" font-size="20" fill="#667c87" font-weight="400" text-anchor="start">RREF = 88.386106 kΩ；RDUMMY = 28 kΩ</text><text x="859" y="730" font-size="20" fill="#667c87" font-weight="400" text-anchor="start">外部电阻及其布线寄生未物理实现</text><rect x="55" y="815" width="1490" height="105" rx="12" fill="#f4f7f9" stroke="#188578" stroke-width="1.5"/><text x="75" y="849" font-size="21" fill="#188578" font-weight="600" text-anchor="start">固定比较条件</text><text x="75" y="882" font-size="20" fill="#233d4b" font-weight="400" text-anchor="start">5 V LED；25 / 100 µA 目标；CLED = 200 fF；Rpkg = 1 Ω；Lpkg = 0.5 nH；同一 PRBS 与接收代理</text><polyline points="48,1036 1552,1036" fill="none" stroke="#e0e8ec" stroke-width="1.5"/><text x="48" y="1062" font-size="17" fill="#667c87" font-weight="400" text-anchor="start">本阶段面积只统计 MOS 核心的实际 GDS 包围盒，不能称为最终 ASIC die area。</text><text x="48" y="1090" font-size="17" fill="#667c87" font-weight="400" text-anchor="start">实测静态 LED I–V 与假设的高速电容、封装及接收模型分开记录；不由 PEX 推导实测光学 BER。</text></svg>
