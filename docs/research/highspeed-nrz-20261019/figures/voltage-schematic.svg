t-weight="400" text-anchor="start">LED -&gt; XNOUT -&gt; VL</text><rect x="48" y="892" width="730" height="192" rx="12" fill="#f4f7f9" stroke="#188578" stroke-width="1.5"/><text x="68" y="926" font-size="21" fill="#188578" font-weight="600" text-anchor="start">DC 校准：同一负载，设定两档电流</text><text x="68" y="959" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">DATA = 0：OUT = 1.638636 V，ILED = 25.000 uA；</text><text x="68" y="988" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">DATA = 1：OUT = 1.231990 V，ILED = 100.000 uA。</text><text x="68" y="1017" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">输出摆幅约 0.407 V；栅极仍由 0 / 3.3 V 全摆幅控制。</text><text x="68" y="1046" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">NMOS 体端接 VSS；PMOS 体端分别接自身上电源轨。</text><rect x="802" y="892" width="750" height="192" rx="12" fill="#f4f7f9" stroke="#3d729e" stroke-width="1.5"/><text x="822" y="926" font-size="21" fill="#3d729e" font-weight="600" text-anchor="start">能耗与可靠性的边界</text><text x="822" y="959" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">统计 VLED、VDD、VH、VL：分别记录供能与吸收的能量。</text><text x="822" y="988" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">理想电源可吸收电流；实际稳压器及其损耗尚未实现。</text><text x="822" y="1017" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">前置驱动节点有瞬态过冲：继续检查各管 VGS / VGD / VDS。</text><text x="822" y="1046" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">AD/AS/PD/PS 已非零；为几何估计，尚无实际版图寄生。</text><polyline points="48,1136 1552,1136" fill="none" stroke="#e0e8ec" stroke-width="1.5"/><text x="48" y="1162" font-size="17" fill="#667c87" font-weight="400" text-anchor="start">D/G/S 已在器件旁标注；B 连接写在各管尺寸下方。um 为微米，uA 为微安；体二极管未单独画出，PDK 模型中包含体结。</text><text x="48" y="1190" font-size="17" fill="#667c87" font-weight="400" text-anchor="start">此图对应 voltage_driver.spice 的晶体管级预版图仿真；不代表 DRC/LVS/PEX、光学带宽或误码率已验证。</text></svg>
