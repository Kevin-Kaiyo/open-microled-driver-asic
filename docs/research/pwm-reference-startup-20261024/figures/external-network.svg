<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1170" viewBox="0 0 1600 1170" role="img"><title>显示 PWM：板级元件、封装与片内 PEX 的连接边界</title><desc>本轮仿真电路局部图；实验版本及验收状态见报告，不代表整片物理或生产签核。</desc><style>text{font-family:"PingFang SC","Noto Sans CJK SC",Arial,sans-serif}path,polyline{stroke-linecap:round;stroke-linejoin:round}</style><defs><marker id="a233d4b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#233d4b"/></marker><marker id="ac97925" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c97925"/></marker><marker id="a188578" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#188578"/></marker><marker id="a8164a8" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8164a8"/></marker><marker id="a3d729e" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3d729e"/></marker></defs><rect width="1600" height="1170" fill="#fff"/><text x="48" y="62" font-size="32" fill="#233d4b" font-weight="600" text-anchor="start">显示 PWM：板级元件、封装与片内 PEX 的连接边界</text><text x="48" y="103" font-size="19" fill="#667c87" font-weight="400" text-anchor="start">最终候选网络示意：器件和取值按 final-network.json；图中电阻、电容及封装电感是显式模型</text><polyline points="48,128 1552,128" fill="none" stroke="#e0e8ec" stroke-width="1.5"/><rect x="1080" y="225" width="430" height="570" rx="12" fill="#edf4f3" stroke="#3d729e" stroke-width="1.5"/><text x="1100" y="259" font-size="21" fill="#3d729e" font-weight="600" text-anchor="start">原 39 MOS 实际 PEX 宏</text><text x="1100" y="292" font-size="22" fill="#233d4b" font-weight="400" text-anchor="start">参考电流 / 镜像</text><text x="1100" y="321" font-size="22" fill="#233d4b" font-weight="400" text-anchor="start">隔离 / 故障保护</text><text x="1100" y="350" font-size="22" fill="#233d4b" font-weight="400" text-anchor="start">buffer / 像素驱动</text><polyline points="80,320 190,320" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="80" y="290" font-size="22" fill="#3d729e" font-weight="600" text-anchor="start">VREF 输入</text><polyline points="190,320 210,320" fill="none" stroke="#233d4b" stroke-width="2.7"/><rect x="210" y="308" width="60" height="24" fill="white" stroke="#233d4b" stroke-width="2.7"/><polyline points="270,320 290,320" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="240" y="293" font-size="18" fill="#233d4b" font-weight="400" text-anchor="middle">100 ohm</text><polyline points="290,320 430,320" fill="none" stroke="#233d4b" stroke-width="2.7"/><circle cx="430" cy="320" r="4.5" fill="#233d4b"/><polyline points="430,320 430,370" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="430,370 430,402" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="408,402 452,402" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="408,418 452,418" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="430,418 430,450" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="460" y="417" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">15 nF</text><polyline points="430,450 430,490" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="410,490 450,490" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="417,497 443,497" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="424,504 436,504" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="470" y="490" font-size="19" fill="#3d729e" font-weight="400" text-anchor="start">PCB GND</text><polyline points="430,320 580,320" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="580,320 600,320" fill="none" stroke="#233d4b" stroke-width="2.7"/><rect x="600" y="308" width="60" height="24" fill="white" stroke="#233d4b" stroke-width="2.7"/><polyline points="660,320 680,320" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="630" y="293" font-size="18" fill="#233d4b" font-weight="400" text-anchor="middle">1 ohm</text><polyline points="680,320 745,320" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="745,320 758,320" fill="none" stroke="#233d4b" stroke-width="2.7"/><path d="M758,320 a8,12 0 0 1 16,0 a8,12 0 0 1 16,0 a8,12 0 0 1 16,0 a8,12 0 0 1 16,0" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="822,320 835,320" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="790" y="293" font-size="18" fill="#233d4b" font-weight="400" text-anchor="middle">5 nH</text><polyline points="835,320 1080,320" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="945" y="300" font-size="20" fill="#3d729e" font-weight="400" text-anchor="start">VREF pin</text><polyline points="1080,560 840,560" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="945" y="540" font-size="20" fill="#8164a8" font-weight="400" text-anchor="start">N2 pin</text><polyline points="740,560 760,560" fill="none" stroke="#233d4b" stroke-width="2.7"/><rect x="760" y="548" width="60" height="24" fill="white" stroke="#233d4b" stroke-width="2.7"/><polyline points="820,560 840,560" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="790" y="533" font-size="18" fill="#233d4b" font-weight="400" text-anchor="middle">1 ohm</text><polyline points="740,560 675,560" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="585,560 598,560" fill="none" stroke="#233d4b" stroke-width="2.7"/><path d="M598,560 a8,12 0 0 1 16,0 a8,12 0 0 1 16,0 a8,12 0 0 1 16,0 a8,12 0 0 1 16,0" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="662,560 675,560" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="630" y="533" font-size="18" fill="#233d4b" font-weight="400" text-anchor="middle">5 nH</text><polyline points="585,560 510,560" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="410,560 430,560" fill="none" stroke="#233d4b" stroke-width="2.7"/><rect x="430" y="548" width="60" height="24" fill="white" stroke="#233d4b" stroke-width="2.7"/><polyline points="490,560 510,560" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="460" y="533" font-size="18" fill="#233d4b" font-weight="400" text-anchor="middle">阻尼 10 ohm</text><polyline points="410,560 360,560" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="260,560 280,560" fill="none" stroke="#233d4b" stroke-width="2.7"/><rect x="280" y="548" width="60" height="24" fill="white" stroke="#233d4b" stroke-width="2.7"/><polyline points="340,560 360,560" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="310" y="533" font-size="18" fill="#233d4b" font-weight="400" text-anchor="middle">ESR 0.5 ohm</text><polyline points="260,560 150,560 150,630" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="150,630 150,662" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="128,662 172,662" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="128,678 172,678" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="150,678 150,710" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="180" y="677" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">150 pF</text><polyline points="150,710 150,750" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="130,750 170,750" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="137,757 163,757" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="144,764 156,764" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="85" y="790" font-size="19" fill="#3d729e" font-weight="400" text-anchor="start">PCB GND</text><polyline points="1080,740 840,740" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="950" y="717" font-size="20" fill="#3d729e" font-weight="400" text-anchor="start">VSS pin</text><polyline points="740,740 760,740" fill="none" stroke="#233d4b" stroke-width="2.7"/><rect x="760" y="728" width="60" height="24" fill="white" stroke="#233d4b" stroke-width="2.7"/><polyline points="820,740 840,740" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="790" y="713" font-size="18" fill="#233d4b" font-weight="400" text-anchor="middle">1 ohm</text><polyline points="740,740 675,740" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="585,740 598,740" fill="none" stroke="#233d4b" stroke-width="2.7"/><path d="M598,740 a8,12 0 0 1 16,0 a8,12 0 0 1 16,0 a8,12 0 0 1 16,0 a8,12 0 0 1 16,0" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="662,740 675,740" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="630" y="713" font-size="18" fill="#233d4b" font-weight="400" text-anchor="middle">5 nH</text><polyline points="585,740 510,740 510,810" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="490,810 530,810" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="497,817 523,817" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="504,824 516,824" fill="none" stroke="#233d4b" stroke-width="2.7"/><rect x="48" y="875" width="1505" height="150" rx="12" fill="#f4f7f9" stroke="#3d729e" stroke-width="1.5"/><text x="68" y="909" font-size="21" fill="#3d729e" font-weight="600" text-anchor="start">为什么要把返回点画出来</text><text x="68" y="942" font-size="19" fill="#233d4b" font-weight="400" text-anchor="start">15 nF 滤波电容在封装之前回 PCB 地；150 pF 补偿支路新增 N2 外引 R/L、10 ohm 阻尼和 ESR。</text><text x="68" y="971" font-size="19" fill="#233d4b" font-weight="400" text-anchor="start">片内提取 R/C 保留在宏内；上图 1 ohm / 5 nH 与 0.5 ohm ESR 是工程应力假设，不是封装实测或场解结果。</text><text x="68" y="1000" font-size="19" fill="#233d4b" font-weight="400" text-anchor="start">PWM / FAULT / PERMIT 输入另含 10 ohm 外部驱动阻抗；VSET、RSET 及其误差保持独立测试。</text><polyline points="48,1056 1552,1056" fill="none" stroke="#e0e8ec" stroke-width="1.5"/><text x="48" y="1082" font-size="17" fill="#667c87" font-weight="400" text-anchor="start">本轮改变的是外部补偿与输入边界，原39MOS实际版图不变；不能把板级电容算入芯片面积或新PEX统计。</text><text x="48" y="1110" font-size="17" fill="#667c87" font-weight="400" text-anchor="start">实际电路包含其它供电与LED支路，本图只展开参考电源、N2补偿和公共回流这三条关键路径。</text></svg>
