"#233d4b"/><text x="850" y="185" font-size="23" fill="#188578" font-weight="600" text-anchor="start">修改：N2 经 150 pF 回 PCB 地</text><text x="1260" y="235" font-size="20" fill="#3d729e" font-weight="600" text-anchor="start">VREF</text><polyline points="1290,250 1290,298" fill="none" stroke="#3d729e" stroke-width="2.7"/><g data-device="PLOAD" data-terminal-order="D G S B" data-nets="CTRL CTRL VREF VREF" transform="translate(1290 350)"><polyline points="-10,-23 -10,-13" fill="none" stroke="#233d4b" stroke-width="3"/><polyline points="-10,-5 -10,5" fill="none" stroke="#233d4b" stroke-width="3"/><polyline points="-10,13 -10,23" fill="none" stroke="#233d4b" stroke-width="3"/><polyline points="-28,-26 -28,26" fill="none" stroke="#8164a8" stroke-width="2.7"/><polyline points="0,-52 0,-21 -10,-21" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="-10,21 0,21 0,52" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="-62,0 -43,0" fill="none" stroke="#8164a8" stroke-width="2.7"/><circle cx="-38" cy="0" r="5" fill="white" stroke="#8164a8" stroke-width="2.6"/><polyline points="-33,0 -28,0" fill="none" stroke="#8164a8" stroke-width="2.7"/></g><text x="1299" y="316" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">S</text><text x="1299" y="399" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">D</text><text x="1229" y="337" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">G</text><text x="1328" y="350" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">PLOAD</text><polyline points="1290,402 1290,598" fill="none" stroke="#233d4b" stroke-width="2.7"/><circle cx="1290" cy="460" r="4.5" fill="#233d4b"/><polyline points="1290,460 1190,460 1190,350 1228,350" fill="none" stroke="#8164a8" stroke-width="2.7"/><g data-device="NSTAGE" data-terminal-order="D G S B" data-nets="CTRL N2 VSS VSS" transform="translate(1290 650)"><polyline points="-10,-23 -10,-13" fill="none" stroke="#233d4b" strok