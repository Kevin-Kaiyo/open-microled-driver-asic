<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130" role="img"><title>显示 PWM：MOS 受控参考电源候选</title><desc>本轮仿真电路局部图；实验版本及验收状态见报告，不代表整片物理或生产签核。</desc><style>text{font-family:"PingFang SC","Noto Sans CJK SC",Arial,sans-serif}path,polyline{stroke-linecap:round;stroke-linejoin:round}</style><defs><marker id="a233d4b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#233d4b"/></marker><marker id="ac97925" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c97925"/></marker><marker id="a188578" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#188578"/></marker><marker id="a8164a8" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8164a8"/></marker><marker id="a3d729e" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3d729e"/></marker></defs><rect width="1600" height="1130" fill="#fff"/><text x="48" y="62" font-size="32" fill="#233d4b" font-weight="600" text-anchor="start">显示 PWM：MOS 受控参考电源候选</text><text x="48" y="103" font-size="19" fill="#667c87" font-weight="400" text-anchor="start">两只并联 PMOS 降低导通压降；NMOS 接受外部 START；图示为 v1 实验连接，验收见结果</text><polyline points="48,128 1552,128" fill="none" stroke="#e0e8ec" stroke-width="1.5"/><polyline points="340,230 1200,230" fill="none" stroke="#3d729e" stroke-width="2.7"/><text x="340" y="207" font-size="22" fill="#3d729e" font-weight="600" text-anchor="start">VIN / 原参考电源输入</text><polyline points="780,230 780,318" fill="none" stroke="#3d729e" stroke-width="2.7"/><g data-device="P0" data-terminal-order="D G S B" data-nets="VOUT GSOFT VIN VIN" transform="translate(780 370)"><polyline points="-10,-23 -10,-13" fill="none" stroke="#233d4b" stroke-width="3"/><polyline points="-10,-5 -10,5" fill="none" stroke="#233d4b" stroke-width="3"/><polyline points="-10,13 -10,23" fill="none" stroke="#233d4b" stroke-width="3"/><polyline points="-28,-26 -28,26" fill="none" stroke="#8164a8" stroke-width="2.7"/><polyline points="0,-52 0,-21 -10,-21" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="-10,21 0,21 0,52" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="-62,0 -43,0" fill="none" stroke="#8164a8" stroke-width="2.7"/><circle cx="-38" cy="0" r="5" fill="white" stroke="#8164a8" stroke-width="2.6"/><polyline points="-33,0 -28,0" fill="none" stroke="#8164a8" stroke-width="2.7"/></g><text x="789" y="336" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">S</text><text x="789" y="419" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">D</text><text x="719" y="357" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">G</text><text x="816" y="366" font-size="21" fill="#233d4b" font-weight="600" text-anchor="start">P0</text><polyline points="780,422 780,500" fill="none" stroke="#233d4b" stroke-width="2.7"/><circle cx="780" cy="230" r="4.5" fill="#3d729e"/><polyline points="1120,230 1120,318" fill="none" stroke="#3d729e" stroke-width="2.7"/><g data-device="P1" data-terminal-order="D G S B" data-nets="VOUT GSOFT VIN VIN" transform="translate(1120 370)"><polyline points="-10,-23 -10,-13" fill="none" stroke="#233d4b" stroke-width="3"/><polyline points="-10,-5 -10,5" fill="none" stroke="#233d4b" stroke-width="3"/><polyline points="-10,13 -10,23" fill="none" stroke="#233d4b" stroke-width="3"/><polyline points="-28,-26 -28,26" fill="none" stroke="#8164a8" stroke-width="2.7"/><polyline points="0,-52 0,-21 -10,-21" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="-10,21 0,21 0,52" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="-62,0 -43,0" fill="none" stroke="#8164a8" stroke-width="2.7"/><circle cx="-38" cy="0" r="5" fill="white" stroke="#8164a8" stroke-width="2.6"/><polyline points="-33,0 -28,0" fill="none" stroke="#8164a8" stroke-width="2.7"/></g><text x="1129" y="336" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">S</text><text x="1129" y="419" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">D</text><text x="1059" y="357" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">G</text><text x="1156" y="366" font-size="21" fill="#233d4b" font-weight="600" text-anchor="start">P1</text><polyline points="1120,422 1120,500" fill="none" stroke="#233d4b" stroke-width="2.7"/><circle cx="1120" cy="230" r="4.5" fill="#3d729e"/><polyline points="780,500 1350,500" fill="none" stroke="#188578" stroke-width="2.7"/><circle cx="1120" cy="500" r="4.5" fill="#188578"/><text x="1190" y="475" font-size="22" fill="#188578" font-weight="600" text-anchor="start">VOUT</text><path d="M1350,500 L1450,500" fill="none" stroke="#188578" stroke-width="3" marker-end="url(#a188578)"/><text x="1220" y="545" font-size="19" fill="#233d4b" font-weight="400" text-anchor="start">供给原参考宏</text><text x="1220" y="575" font-size="19" fill="#233d4b" font-weight="400" text-anchor="start">不改变 LED 负载</text><polyline points="600,370 718,370" fill="none" stroke="#8164a8" stroke-width="2.7"/><polyline points="600,370 600,300 1058,300 1058,370" fill="none" stroke="#8164a8" stroke-width="2.7"/><circle cx="600" cy="370" r="4.5" fill="#233d4b"/><text x="430" y="345" font-size="22" fill="#8164a8" font-weight="600" text-anchor="start">GSOFT</text><polyline points="340,230 340,316" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="340,316 340,330" fill="none" stroke="#233d4b" stroke-width="2.7"/><rect x="328" y="330" width="24" height="60" fill="white" stroke="#233d4b" stroke-width="2.7"/><polyline points="340,390 340,404" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="364" y="367" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">RUP 1 Mohm</text><polyline points="340,404 340,450 600,450 600,370" fill="none" stroke="#8164a8" stroke-width="2.7"/><circle cx="600" cy="450" r="4.5" fill="#233d4b"/><polyline points="450,230 450,256" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="450,256 450,288" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="428,288 472,288" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="428,304 472,304" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="450,304 450,336" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="480" y="303" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">CBOOT 33 pF</text><polyline points="450,336 450,450" fill="none" stroke="#233d4b" stroke-width="2.7"/><circle cx="450" cy="450" r="4.5" fill="#8164a8"/><circle cx="450" cy="230" r="4.5" fill="#3d729e"/><polyline points="600,450 600,526" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="600,526 600,540" fill="none" stroke="#233d4b" stroke-width="2.7"/><rect x="588" y="540" width="24" height="60" fill="white" stroke="#233d4b" stroke-width="2.7"/><polyline points="600,600 600,614" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="624" y="577" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">RDOWN 100 kohm</text><polyline points="600,614 600,708" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="620" y="667" font-size="19" fill="#8164a8" font-weight="400" text-anchor="start">NDRAIN</text><g data-device="N0" data-terminal-order="D G S B" data-nets="NDRAIN START VSS VSS" transform="translate(600 760)"><polyline points="-10,-23 -10,-13" fill="none" stroke="#233d4b" stroke-width="3"/><polyline points="-10,-5 -10,5" fill="none" stroke="#233d4b" stroke-width="3"/><polyline points="-10,13 -10,23" fill="none" stroke="#233d4b" stroke-width="3"/><polyline points="-28,-26 -28,26" fill="none" stroke="#8164a8" stroke-width="2.7"/><polyline points="0,-52 0,-21 -10,-21" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="-10,21 0,21 0,52" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="-62,0 -28,0" fill="none" stroke="#8164a8" stroke-width="2.7"/></g><text x="609" y="726" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">D</text><text x="609" y="809" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">S</text><text x="539" y="747" font-size="15" fill="#667c87" font-weight="400" text-anchor="start">G</text><text x="636" y="756" font-size="21" fill="#233d4b" font-weight="600" text-anchor="start">N0</text><polyline points="600,812 600,880" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="580,880 620,880" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="587,887 613,887" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="594,894 606,894" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="260,760 538,760" fill="none" stroke="#8164a8" stroke-width="2.7"/><text x="260" y="736" font-size="21" fill="#8164a8" font-weight="600" text-anchor="start">START / 外部控制</text><rect x="860" y="650" width="680" height="225" rx="12" fill="#f4f7f9" stroke="#3d729e" stroke-width="1.5"/><text x="880" y="684" font-size="21" fill="#3d729e" font-weight="600" text-anchor="start">启动顺序的物理含义</text><text x="880" y="717" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">START=0：RUP 将 GSOFT 拉向 VIN，PMOS 关断。</text><text x="880" y="746" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">START=1：N0 通过 RDOWN 放电，PMOS 逐渐导通。</text><text x="880" y="775" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">CBOOT 接 VIN，减小上电时瞬间 VSG 的变化。</text><text x="880" y="804" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">FAULT 与参考供电启动分别控制；这不是自主 POR。</text><text x="880" y="833" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">P0/P1：W/L=100/1 um；N0：W/L=2/1 um。</text><polyline points="48,1016 1552,1016" fill="none" stroke="#e0e8ec" stroke-width="1.5"/><text x="48" y="1042" font-size="17" fill="#667c87" font-weight="400" text-anchor="start">全部06v0器件；PMOS B=VIN，NMOS B=VSS。RUP、RDOWN、CBOOT 为片外建模。</text><text x="48" y="1070" font-size="17" fill="#667c87" font-weight="400" text-anchor="start">源：analog/pwm_reference_v2/softstart_v1.spice。是否收敛、是否满足保持电流及恢复门槛，以对应实验表为准。</text></svg>
