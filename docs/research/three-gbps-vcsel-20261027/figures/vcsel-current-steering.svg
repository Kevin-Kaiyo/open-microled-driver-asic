t-weight="400">固定偏置：两种数据状态均存在</text><text x="675" y="800" font-size="17" fill="#657984" text-anchor="middle" font-weight="400">VSS；电流镜及顺从电压未展开</text><text x="390" y="420" font-size="18" fill="#147b78" text-anchor="end" font-weight="400">D+</text><text x="780" y="420" font-size="18" fill="#147b78" text-anchor="end" font-weight="400">D-</text><polyline points="395,430 405,430" fill="none" stroke="#147b78" stroke-width="2"/><polyline points="785,430 795,430" fill="none" stroke="#147b78" stroke-width="2"/><text x="35" y="865" font-size="20" fill="#147b78" text-anchor="start" font-weight="400">数据 1：Q_LED 导通时：I_LASER = I_BIAS + I_MOD；Dummy 支路基本无调制电流。</text><text x="35" y="905" font-size="20" fill="#39789e" text-anchor="start" font-weight="400">数据 0：Q_DUMMY 导通时：I_LASER = I_BIAS；I_MOD 改走 Dummy，仍消耗供电能量。</text><text x="35" y="955" font-size="17" fill="#657984" text-anchor="start" font-weight="400">限流、过温、异常关断、APC/温度补偿及负载寄生是完整设计的必要补充；本图未给出流片电路。</text></svg>
