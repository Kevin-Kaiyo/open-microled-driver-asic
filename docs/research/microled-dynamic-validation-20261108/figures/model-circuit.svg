700,255 720,225 720" fill="none" stroke="#233e50" stroke-width="3"/><path d="M225 720 C255 720,255 740,225 740" fill="none" stroke="#233e50" stroke-width="3"/><path d="M225 740 C255 740,255 760,225 760" fill="none" stroke="#233e50" stroke-width="3"/><path d="M225 760 L225 805" stroke="#233e50" stroke-width="3" fill="none"/><text x="275" y="733.0" font-size="18" fill="#233e50" font-weight="400">Lpkg = 0.5 nH</text><text x="245" y="797.0" font-size="18" fill="#287c83" font-weight="400">OUT</text><rect x="95" y="817" width="590" height="90" rx="9" stroke="#cedbdf" stroke-width="2" fill="#e5f1ef"/><text x="113" y="851.0" font-size="21" fill="#233e50" font-weight="400">A 电压输出 / B 电流转向 / C 四电平</text><text x="113" y="883.55" font-size="21" fill="#233e50" font-weight="400">共同真实参考、供电和数据缓冲</text><path d="M225 805 L225 817" stroke="#233e50" stroke-width="3" fill="none"/><rect x="800" y="135" width="750" height="255" rx="9" stroke="#cedbdf" stroke-width="2" fill="#f3f7f8"/><text x="818" y="169.0" font-size="21" fill="#233e50" font-weight="400">从导电电流到同一接收代理</text><rect x="830" y="195" width="210" height="90" rx="9" stroke="#cedbdf" stroke-width="2" fill="white"/><text x="848" y="229.0" font-size="21" fill="#233e50" font-weight="400">I导电(t)</text><text x="848" y="261.55" font-size="21" fill="#233e50" font-weight="400">原生时间序列</text><rect x="1070" y="195" width="190" height="90" rx="9" stroke="#cedbdf" stroke-width="2" fill="white"/><text x="1088" y="229.0" font-size="21" fill="#233e50" font-weight="400">H光响应</text><text x="1088" y="262.0" font-size="16" fill="#233e50" font-weight="400"><tspan font-family="Arial">τ</tspan>:0/25/75/200 ps</text><rect x="1290" y="195" width="220" height="90" rx="9" stroke="#cedbdf" stroke-width="2" fill="white"/><text x="1308" y="229.0" font-size="21" fill="#233e50" font-weight="400">固定 RX 1 GHz</text><text x="1308" y="261.55" font-size="21" fill="#233e50" font-weight="400">原 v2 判决</text><path d="M1040 239 L1070 239" stroke="#287c83" stroke-width="3" fill="none"/><path d="M1260 239 L1290 239" stroke="#287c83" stroke-width="3" fill="none"/><text x="828" y="333.0" font-size="19" fill="#233e50" font-weight="400">阈值与幅度 / 时间门槛不随负载或路线重新设定。</text><rect x="800" y="425" width="750" height="245" rx="9" stroke="#cedbdf" stroke-width="2" fill="#f3f7f8"/><text x="818" y="459.0" font-size="21" fill="#233e50" font-weight="400">电荷与能量分别守恒</text><text x="830" y="490.0" font-size="23" fill="#287c83" font-weight="400">I端口 = I导电 + C · d(Va <tspan font-family="Arial">−</tspan> Vk)/dt</text><text x="830" y="541.0" font-size="18" fill="#233e50" font-weight="400">七个输入源：VIN / VDD / VREF / VLED / D0 / D1 / DISABLE</text><text x="830" y="587.0" font-size="20" fill="#233e50" font-weight="400">E = <tspan font-family="Arial">∫</tspan>(各独立输入端口功率)dt / 4096 个尝试净位</text><text x="830" y="628.0" font-size="18" fill="#233e50" font-weight="400">积分覆盖完整 1.28 <tspan font-family="Arial">µ</tspan>s 帧；正向 / 返回 / 净能量分别记录。</text><rect x="800" y="705" width="750" height="235" rx="9" stroke="#cedbdf" stroke-width="2" fill="#f8efe6"/><text x="818" y="739.0" font-size="21" fill="#233e50" font-weight="400">整链频响是另一项证据</text><text x="830" y="771.0" font-size="21" fill="#233e50" font-weight="400">VNA <tspan font-family="Arial">→</tspan> bias tee <tspan font-family="Arial">→</tspan> LED <tspan font-family="Arial">→</tspan> 光路 <tspan font-family="Arial">→</tspan> 检测器 <tspan font-family="Arial">→</tspan> VNA</text><text x="830" y="820.0" font-size="20" fill="#233e50" font-weight="400">仅对公开归一化幅度作独立频域拟合和留出检验。</text><text x="830" y="865.0" font-size="18" fill="#233e50" font-weight="400">缺 S11、相位和去嵌：尚不能分配唯一 C、寿命与 RX 极点。</text><text x="830" y="907.0" font-size="19" fill="#ad6f3e" font-weight="400">H整链没有再次接到上方已含 CLED / RX 的仿真中。</text><text x="50" y="1000.0" font-size="21" fill="#233e50" font-weight="400">证据层级：实际原理图 SPICE + 合成动态敏感性；无新 GDS、PEX、器件实测或光学 BER。</text><text x="50" y="1041.0" font-size="19" fill="#657986" font-weight="400">图中二极管 / C / R / L 连接对应 testbench；完整 MOS、参考与辅助轨见报告所链原理图。</text></svg>
