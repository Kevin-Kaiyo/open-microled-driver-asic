<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1030" viewBox="0 0 1600 1030" role="img"><title>掉电时的寄生 PN 结：为什么端压幅值通过仍不够</title><desc>从实际保存波形解释掉电风险的局部等效图；无新增电路或可靠性验收。</desc><style>text{font-family:"PingFang SC","Noto Sans CJK SC",Arial,sans-serif}path,polyline{stroke-linecap:round;stroke-linejoin:round}</style><defs><marker id="a233d4b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#233d4b"/></marker><marker id="ac97925" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c97925"/></marker><marker id="a188578" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#188578"/></marker><marker id="a8164a8" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8164a8"/></marker><marker id="a3d729e" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3d729e"/></marker></defs><rect width="1600" height="1030" fill="#fff"/><text x="48" y="62" font-size="32" fill="#233d4b" font-weight="600" text-anchor="start">掉电时的寄生 PN 结：为什么端压幅值通过仍不够</text><text x="48" y="103" font-size="19" fill="#667c87" font-weight="400" text-anchor="start">只展开 IPD2 的扩散区—n阱结及 IN2 外部补偿；并非新增器件，也不代替完整 PMOS 原理图</text><polyline points="48,128 1552,128" fill="none" stroke="#e0e8ec" stroke-width="1.5"/><text x="60" y="190" font-size="24" fill="#3d729e" font-weight="600" text-anchor="start">正常供电：结反偏</text><text x="140" y="280" font-size="20" fill="#8164a8" font-weight="600" text-anchor="start">IN2.t1 / p+ 扩散区</text><text x="530" y="280" font-size="20" fill="#3d729e" font-weight="600" text-anchor="start">VIN.t6 / n阱</text><text x="190" y="325" font-size="21" fill="#8164a8" font-weight="600" text-anchor="start">IN2 低于 VIN</text><text x="555" y="325" font-size="21" fill="#3d729e" font-weight="600" text-anchor="start">约 5 V</text><polyline points="230,410 420,410" fill="none" stroke="#233d4b" stroke-width="2.7"/><circle cx="230" cy="410" r="4.5" fill="#233d4b"/><path d="M420,380 L420,440 L470,410 Z" fill="white" stroke="#3d729e" stroke-width="3"/><polyline points="475,376 475,444" fill="none" stroke="#3d729e" stroke-width="3"/><polyline points="475,410 690,410" fill="none" stroke="#3d729e" stroke-width="2.7"/><circle cx="640" cy="410" r="4.5" fill="#3d729e"/><text x="405" y="475" font-size="19" fill="#3d729e" font-weight="600" text-anchor="start">寄生 PN 结</text><text x="385" y="510" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">A：p+       K：n阱</text><polyline points="230,410 230,570" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="206,570 254,570" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="206,586 254,586" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="230,586 230,700" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="210,700 250,700" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="217,707 243,707" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="224,714 236,714" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="265" y="600" font-size="21" fill="#188578" font-weight="600" text-anchor="start">150 pF</text><text x="165" y="752" font-size="18" fill="#3d729e" font-weight="400" text-anchor="start">PCB GND</text><text x="360" y="620" font-size="20" fill="#233d4b" font-weight="400" text-anchor="start">PMOS 的 n阱连接 VIN。</text><text x="360" y="652" font-size="20" fill="#233d4b" font-weight="400" text-anchor="start">扩散区低于 n阱时，</text><text x="360" y="684" font-size="20" fill="#233d4b" font-weight="400" text-anchor="start">该寄生结不正向导通。</text><text x="860" y="190" font-size="24" fill="#c97925" font-weight="600" text-anchor="start">RAW 掉电后：观察到正向结压</text><text x="940" y="280" font-size="20" fill="#8164a8" font-weight="600" text-anchor="start">IN2.t1 / p+ 扩散区</text><text x="1330" y="280" font-size="20" fill="#3d729e" font-weight="600" text-anchor="start">VIN.t6 / n阱</text><text x="990" y="325" font-size="21" fill="#8164a8" font-weight="600" text-anchor="start">0.749006 V</text><text x="1355" y="325" font-size="21" fill="#3d729e" font-weight="600" text-anchor="start">0.002357 V</text><polyline points="1030,410 1220,410" fill="none" stroke="#233d4b" stroke-width="2.7"/><circle cx="1030" cy="410" r="4.5" fill="#233d4b"/><path d="M1220,380 L1220,440 L1270,410 Z" fill="white" stroke="#c97925" stroke-width="3"/><polyline points="1275,376 1275,444" fill="none" stroke="#c97925" stroke-width="3"/><polyline points="1275,410 1490,410" fill="none" stroke="#c97925" stroke-width="2.7"/><circle cx="1440" cy="410" r="4.5" fill="#c97925"/><text x="1205" y="475" font-size="19" fill="#c97925" font-weight="600" text-anchor="start">寄生 PN 结</text><text x="1185" y="510" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">A：p+       K：n阱</text><polyline points="1030,410 1030,570" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="1006,570 1054,570" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="1006,586 1054,586" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="1030,586 1030,700" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="1010,700 1050,700" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="1017,707 1043,707" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="1024,714 1036,714" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="1065" y="600" font-size="21" fill="#188578" font-weight="600" text-anchor="start">150 pF</text><text x="965" y="752" font-size="18" fill="#3d729e" font-weight="400" text-anchor="start">PCB GND</text><path d="M1140,545 L1385,545" fill="none" stroke="#c97925" stroke-width="3" marker-end="url(#ac97925)"/><text x="1150" y="585" font-size="18" fill="#c97925" font-weight="400" text-anchor="start">可能的储能释放路径</text><text x="1160" y="660" font-size="20" fill="#233d4b" font-weight="400" text-anchor="start">结压 = 0.746649 V</text><text x="1160" y="692" font-size="20" fill="#233d4b" font-weight="400" text-anchor="start">t = 21.173660 us</text><text x="1160" y="724" font-size="20" fill="#233d4b" font-weight="400" text-anchor="start">并未保存该结电流</text><polyline points="800,190 800,795" fill="none" stroke="#e0e8ec" stroke-width="1.4"/><rect x="48" y="815" width="1504" height="105" rx="12" fill="#f4f7f9" stroke="#3d729e" stroke-width="1.5"/><text x="68" y="849" font-size="21" fill="#3d729e" font-weight="600" text-anchor="start">从已验证事实到待验证机制</text><text x="68" y="882" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">已核对：扩散区、阱、RAW 与 DISABLE 的原始波形；&gt;0.7 V 约1.400 us，仅描述时长，不是允许值。</text><text x="68" y="911" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">尚待验证：结电流与电荷、井电阻/注入影响，以及掉电时主动释放补偿电荷的复位电路。</text><polyline points="48,916 1552,916" fill="none" stroke="#e0e8ec" stroke-width="1.5"/><text x="48" y="942" font-size="17" fill="#667c87" font-weight="400" text-anchor="start">原始条件：VLED与2.5V基准保留；RAW在20–21us从5V降至0V，DISABLE保持高；绝对端压筛查不覆盖这一正向结风险。</text><text x="48" y="970" font-size="17" fill="#667c87" font-weight="400" text-anchor="start">IPD2 原D对应提取S=IN2.t1，B=VIN.t6；D/S互换有记录。图中箭头为机制推断，不是已测量的结电流。</text></svg>
