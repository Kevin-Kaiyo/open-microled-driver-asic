<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1110" viewBox="0 0 1600 1110" role="img"><title>高速 B：片外供电、基准分压与补偿接口</title><desc>与最终TT冻结网表核对的片外接口图；器件实现和验收范围见正文。</desc><style>text{font-family:"PingFang SC","Noto Sans CJK SC",Arial,sans-serif}path,polyline{stroke-linecap:round;stroke-linejoin:round}</style><defs><marker id="a233d4b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#233d4b"/></marker><marker id="ac97925" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c97925"/></marker><marker id="a188578" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#188578"/></marker><marker id="a8164a8" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8164a8"/></marker><marker id="a3d729e" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3d729e"/></marker></defs><rect width="1600" height="1110" fill="#fff"/><text x="48" y="62" font-size="32" fill="#233d4b" font-weight="600" text-anchor="start">高速 B：片外供电、基准分压与补偿接口</text><text x="48" y="103" font-size="19" fill="#667c87" font-weight="400" text-anchor="start">同名网络接前页真实21 MOS宏；下面的元件属于明确的片外边界，不能计入芯片面积</text><polyline points="48,128 1552,128" fill="none" stroke="#e0e8ec" stroke-width="1.5"/><text x="60" y="185" font-size="23" fill="#3d729e" font-weight="600" text-anchor="start">1. RAW 电源：供电阻抗与去耦分开建模</text><text x="80" y="250" font-size="20" fill="#3d729e" font-weight="600" text-anchor="start">外部 5 V</text><polyline points="80,280 190,280" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="190,280 210,280" fill="none" stroke="#233d4b" stroke-width="2.7"/><rect x="210" y="268" width="60" height="24" fill="white" stroke="#233d4b" stroke-width="2.7"/><polyline points="270,280 290,280" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="240" y="250" font-size="18" fill="#233d4b" font-weight="400" text-anchor="middle">0.25 ohm</text><polyline points="290,280 370,280" fill="none" stroke="#233d4b" stroke-width="2.7"/><path d="M370,280 a8,12 0 0 1 16,0 a8,12 0 0 1 16,0 a8,12 0 0 1 16,0 a8,12 0 0 1 16,0" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="400" y="250" font-size="18" fill="#233d4b" font-weight="400" text-anchor="middle">0.5 nH</text><polyline points="434,280 700,280" fill="none" stroke="#3d729e" stroke-width="2.7"/><circle cx="540" cy="280" r="4.5" fill="#233d4b"/><text x="640" y="255" font-size="22" fill="#3d729e" font-weight="600" text-anchor="start">VIN</text><polyline points="540,280 540,326" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="540,326 540,340" fill="none" stroke="#233d4b" stroke-width="2.7"/><rect x="528" y="340" width="24" height="60" fill="white" stroke="#233d4b" stroke-width="2.7"/><polyline points="540,400 540,414" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="564" y="377" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">ESR 0.2 ohm</text><polyline points="540,414 540,440" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="540,440 540,472" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="520,472 560,472" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="520,488 560,488" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="540,488 540,520" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="568" y="487" font-size="19" fill="#233d4b" font-weight="400" text-anchor="start">100 nF</text><polyline points="540,520 540,545" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="520,545 560,545" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="527,552 553,552" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="534,559 546,559" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="60" y="380" font-size="19" fill="#233d4b" font-weight="400" text-anchor="start">VIN 同时供给 VI 参考与 RDUMMY。</text><text x="60" y="412" font-size="19" fill="#233d4b" font-weight="400" text-anchor="start">没有片内 3.3 V LDO。</text><text x="60" y="444" font-size="19" fill="#233d4b" font-weight="400" text-anchor="start">数字 VDD 与 LED 电源仍独立。</text><text x="60" y="476" font-size="19" fill="#233d4b" font-weight="400" text-anchor="start">额外封装 R/L 在专门应力点加入。</text><text x="820" y="185" font-size="23" fill="#8164a8" font-weight="600" text-anchor="start">2. 电压基准：分压得到 VSET</text><text x="840" y="250" font-size="20" fill="#8164a8" font-weight="600" text-anchor="start">外部 2.5 V</text><polyline points="840,280 960,280" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="960,280 980,280" fill="none" stroke="#233d4b" stroke-width="2.7"/><rect x="980" y="268" width="60" height="24" fill="white" stroke="#233d4b" stroke-width="2.7"/><polyline points="1040,280 1060,280" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="1010" y="250" font-size="18" fill="#233d4b" font-weight="400" text-anchor="middle">Rout 0.2 ohm</text><polyline points="1060,280 1150,280" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="1150,280 1170,280" fill="none" stroke="#233d4b" stroke-width="2.7"/><rect x="1170" y="268" width="60" height="24" fill="white" stroke="#233d4b" stroke-width="2.7"/><polyline points="1230,280 1250,280" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="1200" y="250" font-size="18" fill="#233d4b" font-weight="400" text-anchor="middle">200 kohm</text><polyline points="1250,280 1510,280" fill="none" stroke="#8164a8" stroke-width="2.7"/><circle cx="1350" cy="280" r="4.5" fill="#233d4b"/><text x="1400" y="255" font-size="22" fill="#8164a8" font-weight="600" text-anchor="start">VSET</text><polyline points="1350,280 1350,326" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="1350,326 1350,340" fill="none" stroke="#233d4b" stroke-width="2.7"/><rect x="1338" y="340" width="24" height="60" fill="white" stroke="#233d4b" stroke-width="2.7"/><polyline points="1350,400 1350,414" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="1374" y="377" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">50 kohm</text><polyline points="1350,414 1350,545" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="1330,545 1370,545" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="1337,552 1363,552" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="1344,559 1356,559" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="830" y="420" font-size="19" fill="#233d4b" font-weight="400" text-anchor="start">VSET = 2.5 x 50 / (200 + 50)</text><text x="830" y="452" font-size="19" fill="#233d4b" font-weight="400" text-anchor="start">          = 0.5 V</text><text x="830" y="484" font-size="19" fill="#233d4b" font-weight="400" text-anchor="start">电压基准内部启动、噪声及 Iq</text><text x="830" y="516" font-size="19" fill="#233d4b" font-weight="400" text-anchor="start">目前仍是待补的系统边界。</text><polyline points="800,190 800,965" fill="none" stroke="#e0e8ec" stroke-width="1.2"/><text x="60" y="650" font-size="23" fill="#188578" font-weight="600" text-anchor="start">3. 补偿接口：稳定参考，不跟随每一数据位</text><text x="100" y="720" font-size="21" fill="#8164a8" font-weight="600" text-anchor="start">IN2 引脚</text><polyline points="100,750 340,750" fill="none" stroke="#233d4b" stroke-width="2.7"/><circle cx="340" cy="750" r="4.5" fill="#233d4b"/><polyline points="340,750 340,770" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="340,770 340,802" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="320,802 360,802" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="320,818 360,818" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="340,818 340,850" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="368" y="817" font-size="19" fill="#233d4b" font-weight="400" text-anchor="start">150 pF</text><polyline points="340,850 340,900" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="320,900 360,900" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="327,907 353,907" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="334,914 346,914" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="460" y="760" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">主矩阵为外部补偿支路。</text><text x="460" y="790" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">另测 1 ohm / 5 nH 外引线</text><text x="460" y="820" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">及 0.5 ohm ESR 的 FF 点；</text><text x="460" y="850" font-size="18" fill="#233d4b" font-weight="400" text-anchor="start">未覆盖全部通信矩阵。</text><text x="830" y="650" font-size="23" fill="#188578" font-weight="600" text-anchor="start">4. 外部启动互锁：先禁止，再等待参考</text><text x="850" y="720" font-size="20" fill="#8164a8" font-weight="600" text-anchor="start">0 / 3.3 V</text><polyline points="850,750 1050,750" fill="none" stroke="#233d4b" stroke-width="2.7"/><polyline points="1050,750 1070,750" fill="none" stroke="#233d4b" stroke-width="2.7"/><rect x="1070" y="738" width="60" height="24" fill="white" stroke="#233d4b" stroke-width="2.7"/><polyline points="1130,750 1150,750" fill="none" stroke="#233d4b" stroke-width="2.7"/><text x="1100" y="720" font-size="18" fill="#233d4b" font-weight="400" text-anchor="middle">100 ohm</text><polyline points="1150,750 1510,750" fill="none" stroke="#8164a8" stroke-width="2.7"/><text x="1290" y="725" font-size="22" fill="#8164a8" font-weight="600" text-anchor="start">DISABLE</text><text x="850" y="810" font-size="19" fill="#233d4b" font-weight="400" text-anchor="start">高：MDIS、MK 导通，限制电流与悬空电压。</text><text x="850" y="842" font-size="19" fill="#233d4b" font-weight="400" text-anchor="start">低：退出保护，正常传输。</text><text x="850" y="874" font-size="19" fill="#233d4b" font-weight="400" text-anchor="start">参考从 0 us 上升 -&gt; 20 us 释放；</text><text x="850" y="906" font-size="19" fill="#233d4b" font-weight="400" text-anchor="start">参考从 30 us 上升 -&gt; 50 us 释放。</text><polyline points="48,996 1552,996" fill="none" stroke="#e0e8ec" stroke-width="1.5"/><text x="48" y="1022" font-size="17" fill="#667c87" font-weight="400" text-anchor="start">示意采用最终TT原始网表逐项核对；器件取值、容差和寄生应力点分别记录，不把理想端口称为已实现的电源IC。</text><text x="48" y="1050" font-size="17" fill="#667c87" font-weight="400" text-anchor="start">所有地符号为PCB参考地；实际芯片互连RC仍留在宏内。RSET与RIBIAS见晶体管参考原理图。</text></svg>
